<style>
/* ── Study (from Hiranda's old Study section) ─────────────────────────── */
.page:has(.st-root) { max-width: 1100px; }
.st-root { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.st-root [hidden] { display: none !important; }
.st-root textarea, .st-root select { font: 14px var(--mono-font); color: inherit; background: rgba(13, 2, 33, 0.7); border: 1px solid var(--line); border-radius: var(--radius, 6px); padding: 10px 12px; width: 100%; }
.st-root textarea { resize: vertical; min-height: 110px; }
.st-root textarea:focus, .st-root select:focus { outline: none; border-color: var(--magenta); box-shadow: var(--glow-magenta); }
.st-root input[type="date"] { color-scheme: dark; }
.st-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.st-eyebrow { font: 11px var(--mono-font); letter-spacing: 0.3em; text-transform: uppercase; color: var(--cyan); }
.st-title { font: 900 28px/1.1 var(--display); letter-spacing: 0.04em; margin: 2px 0 0; }
.st-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.st-span2 { grid-column: span 2; }
.st-span4 { grid-column: 1 / -1; }
.st-w { position: relative; min-width: 0; background: rgba(22, 9, 52, 0.9); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.st-w h2, .st-label { font: 11px var(--mono-font); letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 6px; }
.st-big { font: 900 32px/1 var(--display); color: var(--text); }
.st-big small { font-size: 15px; color: var(--muted); }
.st-sub { font: 11px var(--mono-font); color: var(--muted); }
button.st-w { text-align: left; color: inherit; font: inherit; cursor: pointer; }
button.st-w:hover { border-color: var(--yellow); box-shadow: 0 0 14px rgba(255, 211, 25, 0.35); }
.st-health .st-big { color: var(--bad); text-shadow: 0 0 12px rgba(255, 77, 109, 0.45); }
.st-coins .st-big { color: var(--yellow); text-shadow: 0 0 12px rgba(255, 211, 25, 0.45); }
.st-xp { color: var(--cyan); }
.st-coin { color: var(--yellow); }
.st-life { color: var(--bad); }
.st-good { color: var(--good); }
.st-goal { display: flex; align-items: center; gap: 12px; }
.st-ring { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
.st-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.st-ring span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 12px var(--mono-font); }
.st-goal-edit { display: flex; gap: 6px; flex-wrap: wrap; }
.st-goal-edit input { padding: 6px 10px; font-size: 14px; }
.st-goal-edit input[type="number"] { width: 110px; }
.st-smart { flex-direction: row; align-items: center; gap: 14px; background: linear-gradient(120deg, rgba(255, 43, 214, 0.22), rgba(0, 240, 255, 0.1)), rgba(22, 9, 52, 0.94); border-color: var(--magenta); }
.st-smart-icon { font-size: 26px; width: 48px; height: 48px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; background: rgba(13, 2, 33, 0.6); border: 1px solid var(--line); }
.st-smart .st-label { color: var(--magenta); }
.st-smart strong { display: block; font-size: 16px; margin-top: 2px; }
.st-chev { margin-left: auto; color: var(--muted); font-size: 22px; }
.st-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.st-stat { background: rgba(13, 2, 33, 0.55); border: 1px solid rgba(169, 155, 209, 0.2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.st-stat b { display: block; font: 700 18px var(--display); }
.st-log { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
.st-log-row { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.st-log-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-log-row .c { font: 12px var(--mono-font); flex-shrink: 0; }
.st-log-row .ago { font: 11px var(--mono-font); color: var(--muted); width: 30px; text-align: right; flex-shrink: 0; }
.st-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 10px 0; }
/* Assignments */
.st-add { display: flex; gap: 8px; flex-wrap: wrap; }
.st-add input { padding: 9px 12px; font-size: 14px; }
.st-add input[name="title"] { flex: 1 1 160px; min-width: 0; }
.st-add input[type="date"] { flex: 0 1 160px; width: auto; }
.st-list { display: flex; flex-direction: column; gap: 6px; }
.st-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 1px solid rgba(169, 155, 209, 0.22); background: rgba(13, 2, 33, 0.55); min-width: 0; }
.st-item.over { border-color: rgba(255, 77, 109, 0.55); background: rgba(255, 77, 109, 0.08); }
.st-item.done { opacity: 0.6; }
.st-item .main { flex: 1; min-width: 0; }
.st-item .main p { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-item.done .main p:first-child { text-decoration: line-through; color: var(--muted); }
.st-due { font: 11px var(--mono-font); }
.st-due.over { color: var(--bad); } .st-due.today { color: var(--yellow); } .st-due.soon { color: var(--cyan); } .st-due.far { color: var(--muted); }
.st-check { width: 26px; height: 26px; padding: 0; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(169, 155, 209, 0.6); background: transparent; display: grid; place-items: center; font-size: 13px; line-height: 1; }
.st-check.on { background: var(--good); border-color: var(--good); color: #0d0221; }
.st-icon { padding: 4px 8px; border: none; background: none; color: var(--muted); flex-shrink: 0; font-size: 14px; }
.st-icon:hover:not(:disabled) { color: var(--bad); box-shadow: none; }
/* Calendar */
.st-cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.st-cal-head strong { font: 700 15px var(--display); letter-spacing: 0.04em; }
.st-cal-nav { display: flex; gap: 4px; align-items: center; }
.st-cal-nav button { padding: 4px 10px; }
.st-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
.st-wd { font: 10px var(--mono-font); color: var(--muted); padding: 4px 0; }
.st-day { padding: 2px 0 4px; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 6px; }
.st-day:hover:not(:disabled) { box-shadow: none; background: rgba(0, 240, 255, 0.08); }
.st-day span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; }
.st-day.today span { box-shadow: inset 0 0 0 1px var(--cyan); color: var(--cyan); }
.st-day.sel span { background: var(--magenta); color: #fff; box-shadow: var(--glow-magenta); }
.st-dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.st-dot.done { background: var(--good); } .st-dot.over { background: var(--bad); } .st-dot.today { background: var(--yellow); } .st-dot.soon { background: var(--cyan); }
.st-agenda { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
/* Decks */
.st-section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.st-decks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.st-deck { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 14px; background: rgba(22, 9, 52, 0.9); border-radius: 10px; min-width: 0; }
.st-deck strong { font: 700 17px var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-deck .row { justify-content: space-between; flex-wrap: wrap; font: 12px var(--mono-font); color: var(--muted); }
.st-badge { display: inline-block; background: var(--magenta); color: #fff; border-radius: 10px; padding: 0 7px; font: 700 11px var(--mono-font); }
.st-modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.st-mode { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px; background: rgba(22, 9, 52, 0.9); border-radius: 10px; min-width: 0; }
.st-mode .ic { font-size: 22px; }
.st-mode strong { font: 700 15px var(--display); }
.st-mode .st-sub { white-space: normal; }
.st-mode.accent { border-color: rgba(255, 211, 25, 0.5); background: linear-gradient(160deg, rgba(255, 211, 25, 0.12), var(--panel)); }
.st-mode .st-badge { position: absolute; top: 10px; right: 10px; }
.st-cards { display: flex; flex-direction: column; gap: 6px; }
.st-card-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(169, 155, 209, 0.22); background: rgba(13, 2, 33, 0.55); min-width: 0; font-size: 14px; }
.st-card-row > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-card-row > span + span { color: var(--muted); }
.st-card-row input { padding: 6px 10px; font-size: 14px; flex: 1; min-width: 0; }
.st-card-add { display: flex; gap: 8px; flex-wrap: wrap; }
.st-card-add input { flex: 1 1 180px; min-width: 0; padding: 9px 12px; font-size: 14px; }
.st-back { align-self: flex-start; }
/* Study modes */
.st-mode-view { max-width: 620px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.st-shell-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(13, 2, 33, 0.7); }
.st-prog { font: 13px var(--mono-font); color: var(--muted); }
.st-face { min-height: 230px; width: 100%; border-radius: 14px; padding: 28px 20px; display: grid; place-items: center; text-align: center; background: linear-gradient(160deg, rgba(255, 43, 214, 0.14), rgba(13, 2, 33, 0.85)); border: 1px solid var(--magenta); box-shadow: var(--glow-magenta); }
.st-face .side { font: 10px var(--mono-font); letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.st-face .txt { font: 700 24px/1.3 var(--display); overflow-wrap: anywhere; }
.st-face .ans { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--yellow); font-size: 18px; overflow-wrap: anywhere; }
.st-q { padding: 20px; border-radius: 12px; text-align: center; background: rgba(22, 9, 52, 0.92); border: 1px solid var(--line); }
.st-q .side { font: 10px var(--mono-font); letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.st-q .txt { font: 700 22px/1.3 var(--display); overflow-wrap: anywhere; }
.st-opts { display: flex; flex-direction: column; gap: 8px; }
.st-opt { text-align: left; padding: 13px 14px; font-size: 15px; overflow-wrap: anywhere; background: rgba(13, 2, 33, 0.92); }
.st-opt.right { border-color: var(--good); background: rgba(61, 255, 168, 0.15); color: #fff; }
.st-opt.wrong { border-color: var(--bad); background: rgba(255, 77, 109, 0.18); color: #fff; }
.st-opt.dim { opacity: 0.45; }
.st-bar { height: 6px; border-radius: 3px; background: rgba(169, 155, 209, 0.2); overflow: hidden; }
.st-bar > div { height: 100%; background: var(--cyan); box-shadow: var(--glow-cyan); transition: width 0.3s; }
.st-bar.time > div { background: var(--yellow); transition: width 1s linear; }
.st-write { font-size: 18px; }
.st-write.right { border-color: var(--good); background: rgba(61, 255, 168, 0.12); }
.st-write.wrong { border-color: var(--bad); background: rgba(255, 77, 109, 0.14); }
.st-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.st-tile { min-height: 84px; padding: 10px; font-size: 14px; overflow-wrap: anywhere; display: grid; place-items: center; text-align: center; background: rgba(13, 2, 33, 0.92); }
.st-tile.sel { border-color: var(--yellow); box-shadow: 0 0 12px rgba(255, 211, 25, 0.5); }
.st-tile.wrong { border-color: var(--bad); background: rgba(255, 77, 109, 0.18); }
.st-tile.gone { visibility: hidden; }
.st-two { display: flex; gap: 8px; }
.st-two > * { flex: 1; }
.st-mode-view button:not(.link):not(.primary):not(.st-face) { background-color: rgba(13, 2, 33, 0.92); }
.st-miss { border-color: rgba(255, 77, 109, 0.6); }
.st-got { border-color: rgba(61, 255, 168, 0.6); }
.st-result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 18px; background: rgba(22, 9, 52, 0.94); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; }
.st-result .em { font-size: 44px; }
.st-result .score { font: 900 56px/1 var(--display); }
.st-result .score small { font-size: 26px; color: var(--muted); }
.st-gain { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.st-gain span { font: 700 15px var(--mono-font); padding: 5px 14px; border-radius: 20px; border: 1px solid var(--line); background: rgba(13, 2, 33, 0.6); }
/* Shop */
.st-shop { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.st-coupon { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 12px; background: rgba(22, 9, 52, 0.9); border-radius: 10px; min-width: 0; }
.st-coupon .em { font-size: 24px; }
.st-coupon .ttl { font-size: 13px; line-height: 1.35; }
.st-coupon .cost { font: 700 13px var(--mono-font); color: var(--yellow); margin-top: auto; }
.st-custom { display: flex; gap: 8px; flex-wrap: wrap; }
.st-custom input { padding: 9px 12px; font-size: 14px; }
.st-custom input[name="emoji"] { width: 64px; text-align: center; }
.st-custom input[name="title"] { flex: 1 1 180px; min-width: 0; }
.st-custom input[name="cost"] { width: 100px; }
.st-backup { flex-direction: row; gap: 8px; flex-wrap: wrap; align-items: center; }
.st-backup .grow { flex: 1 1 240px; }
.st-pop { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; padding: 8px 18px; border-radius: 20px; font: 700 15px var(--mono-font); background: var(--panel-solid, #160934); border: 1px solid var(--cyan); box-shadow: var(--glow-cyan); animation: st-pop 1.6s ease-out forwards; pointer-events: none; white-space: nowrap; }
@keyframes st-pop { 0% { opacity: 0; transform: translate(-50%, 12px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -18px); } }
.st-warn { color: var(--bad); font: 12px var(--mono-font); }
@media (max-width: 720px) {
  .st-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .st-span2 { grid-column: 1 / -1; }
  .st-decks { grid-template-columns: minmax(0, 1fr); }
  .st-modes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .st-shop { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .st-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .st-big { font-size: 28px; }
  .st-day span { width: 28px; height: 28px; font-size: 13px; }
  .st-smart strong { font-size: 14px; }
}

/* ── Mission control (shared with Home through .mc, see Hub.html) ──
   Panels become charcoal consoles with numbered amber plates, readouts
   sit on dark amber screens, buttons are keys, and the flashcards are
   ruled index cards. */
.mc .st-root { counter-reset: st-plate; font-family: var(--hub-sans); }
.mc .st-eyebrow { color: #6b6457; font-family: var(--hub-mono); letter-spacing: 0.24em; }
.mc .st-title { font: 700 34px/1.05 var(--hub-sans); letter-spacing: 0.06em; color: var(--hub-ink); text-transform: uppercase; }
.mc .st-warn { color: var(--hub-red); font: 12px var(--hub-mono); }
.mc .st-w, .mc .st-deck, .mc .st-mode, .mc .st-coupon, .mc .st-result, .mc .st-q {
  background: linear-gradient(180deg, var(--hub-ink-2), var(--hub-ink)); color: var(--hub-paper); border: none; border-radius: 14px; backdrop-filter: none;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 3px 0 #1d1e21, 0 12px 24px rgba(45, 47, 51, 0.2); }
.mc .st-w { padding: 14px 16px 16px; }
/* Corner screws on the big panels */
.mc .st-w::before, .mc .st-w::after { content: ''; position: absolute; top: 8px; width: 8px; height: 8px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 35% 35%, #b9b3a5, #6f6a60 60%, #4a4740); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4); }
.mc .st-w::before { left: 8px; }
.mc .st-w::after { right: 8px; }
/* Each panel's heading is a plate with its own amber number: S1, S2… */
.mc .st-w h2, .mc .st-label { font: 700 12px var(--hub-sans); letter-spacing: 0.18em; color: var(--hub-paper); padding-left: 10px; }
.mc .st-w > h2::before { counter-increment: st-plate; content: 'S' counter(st-plate); font: 600 10px var(--hub-mono); color: var(--hub-ink); background: var(--hub-amber); border-radius: 4px; padding: 1px 5px; letter-spacing: 0.06em; margin-right: 4px; }
.mc .st-big { font: 600 34px/1 var(--hub-mono); color: var(--hub-amber); text-shadow: 0 0 10px rgba(255, 176, 0, 0.45); }
.mc .st-big small { color: #9b7a37; }
.mc .st-health .st-big { color: #ff7a5c; text-shadow: 0 0 10px rgba(217, 72, 43, 0.6); }
.mc .st-coins .st-big { color: var(--hub-amber); }
.mc .st-sub { color: #b8b1a1; font-family: var(--hub-mono); }
.mc .st-xp { color: var(--hub-amber); } .mc .st-coin { color: #ffd06b; } .mc .st-life { color: #ff7a5c; } .mc .st-good { color: #8fd1ad; }
.mc button.st-w:hover:not(:disabled) { background: linear-gradient(180deg, #45474d, var(--hub-ink-2)); color: var(--hub-paper); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 3px 0 #1d1e21, 0 0 0 2px var(--hub-amber); }
.mc button.st-w { text-transform: none; letter-spacing: normal; font: inherit; }
.mc .st-ring circle:last-child { stroke: var(--hub-amber) !important; }
.mc .st-ring span { color: var(--hub-amber); font-family: var(--hub-mono); }
.mc .st-smart { background: linear-gradient(90deg, rgba(255, 176, 0, 0.18), transparent 60%), linear-gradient(180deg, var(--hub-ink-2), var(--hub-ink)); box-shadow: inset 4px 0 0 var(--hub-amber), 0 3px 0 #1d1e21, 0 12px 24px rgba(45, 47, 51, 0.2); }
.mc .st-smart .st-label { color: var(--hub-amber); }
.mc .st-smart-icon { background: var(--hub-screen); border: none; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8); }
.mc .st-chev { color: var(--hub-amber); }
/* Screens: stats, rows, logs */
.mc .st-stat, .mc .st-item, .mc .st-card-row, .mc .st-shell-top, .mc .st-log, .mc .st-cal {
  background: var(--hub-screen); border: none; border-radius: 10px; box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.06); color: var(--hub-amber); font-family: var(--hub-mono); }
.mc .st-stat b { font: 600 20px var(--hub-mono); color: var(--hub-amber); text-shadow: 0 0 6px rgba(255, 176, 0, 0.35); }
.mc .st-log { padding: 8px 10px; }
.mc .st-log-row .t { color: #e9dcc0; }
.mc .st-log-row .ago { color: #9b7a37; }
.mc .st-empty { color: #9b7a37; font-family: var(--hub-mono); }
.mc .st-item.over { box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8), inset 3px 0 0 var(--hub-red); background: #1c1716; }
.mc .st-item .main p:first-child { color: #f1e6cf; font-family: var(--hub-sans); font-size: 15px; }
.mc .st-item.done .main p:first-child { color: #8a8578; }
.mc .st-due { font-family: var(--hub-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.mc .st-due.over { color: #ff7a5c; } .mc .st-due.today { color: var(--hub-amber); animation: hub-blink 1.2s steps(2, start) infinite; } .mc .st-due.soon { color: #ffd06b; } .mc .st-due.far { color: #9b7a37; }
/* The turn-in button is an indicator lamp. */
.mc .st-check { border: 2px solid #5a5c61; background: #23252a; box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.6); color: transparent; }
.mc .st-check:hover:not(:disabled) { border-color: var(--hub-amber); background: #23252a; box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.6), 0 0 6px rgba(255, 176, 0, 0.5); color: transparent; }
.mc .st-check.on, .mc .st-check.on:hover:not(:disabled) { background: radial-gradient(circle at 40% 35%, #a6dcbd, #5c8a72); border-color: #3c5c4b; color: #17181b; box-shadow: 0 0 10px rgba(92, 138, 114, 0.9); }
.mc .st-icon, .mc .st-icon:hover:not(:disabled) { background: none; box-shadow: none; color: #8a8578; padding: 4px 8px; }
.mc .st-icon:hover:not(:disabled) { color: #ff7a5c; }
/* Calendar */
.mc .st-cal { padding: 6px; }

</style>
<script>
// Study: Hiranda's old Study section (as of its commit dcd6eaf, before it
// became Grow), for one person in one browser. Assignments with due dates
// you turn in, flashcard sets with Learn, Write, Quiz, Match, spaced
// repetition Review and Flashcards, and the economy around them: XP that
// only grows, coins you spend in a shop of rewards, and a daily health
// that misses cost and flawless sets earn back.
//
// Everything is kept in this browser (localStorage); Backup exports and
// imports it as a file. Loaded after App.html, whose el() and randomId()
// it uses. App.html shows Study.root on the Study tab.

const Study = (() => {
  const KEY = 'ds_study_v1'
  const TURN_IN_XP = 25
  const TURN_IN_COINS = 10
  const GRADED = new Set(['quiz', 'match', 'write', 'learn'])
  const HEALTH_BASE = 10
  const HEALTH_MAX = 20
  const DAILY_COIN_CAP = 50
  const TEST_COIN_EXTRA = 20       // quiz and write may go a little past the cap
  const INTERVALS = [1, 2, 4, 7, 15, 30] // Leitner boxes, in days
  const DEFAULT_GOAL = 500
  const QUESTION_SECONDS = 15
  const MODE_LABEL = { quiz: 'Quiz', write: 'Write', learn: 'Learn', match: 'Match', review: 'Review', assignment: 'Turned in' }
  // Hiranda's coupons were for your partner; here they're rewards for you.
  const PRESETS = [
    { emoji: '🎮', title: '30 minutes in the Arcade, guilt-free', cost: 20 },
    { emoji: '📺', title: 'One episode, no guilt', cost: 30 },
    { emoji: '🍫', title: 'A snack break', cost: 40 },
    { emoji: '☕', title: 'A coffee run', cost: 60 },
    { emoji: '🛋️', title: 'A lazy evening off', cost: 80 },
    { emoji: '😴', title: 'Sleep in tomorrow', cost: 100 },
    { emoji: '🎬', title: 'Movie night', cost: 120 },
    { emoji: '🍕', title: 'Order takeout', cost: 150 },
  ]

  // ── Dates, all local (YYYY-MM-DD keys from local time, never UTC) ──
  const pad = n => String(n).padStart(2, '0')
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
  const parseDay = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d) }
  const addDays = (k, n) => { const d = parseDay(k); d.setDate(d.getDate() + n); return dayKey(d) }
  const daysFrom = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 86400000)
  const isDay = k => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k)
  const dayOf = iso => dayKey(new Date(iso))

  function dueLabel(due) {
    const days = daysFrom(dayKey(), due)
    if (days < 0) return { text: `${-days}d overdue`, tone: 'over' }
    if (days === 0) return { text: 'due today', tone: 'today' }
    if (days === 1) return { text: 'due tomorrow', tone: 'soon' }
    if (days <= 6) return { text: `in ${days} days`, tone: 'soon' }
    return { text: parseDay(due).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), tone: 'far' }
  }

  function ago(iso) {
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000)
    if (s < 60) return 'now'
    if (s < 3600) return `${Math.floor(s / 60)}m`
    if (s < 86400) return `${Math.floor(s / 3600)}h`
    return `${Math.floor(s / 86400)}d`
  }

  const shuffle = arr => {
    const a = arr.slice()
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] }
    return a
  }
  const newId = () => (typeof randomId === 'function' ? randomId() : Math.random().toString(36).slice(2, 12))
  const str = (v, max) => String(v == null ? '' : v).trim().slice(0, max)

  // ── Storage ──
  const blank = () => ({ v: 1, decks: [], progress: {}, attempts: [], assignments: [], coupons: [], goal: DEFAULT_GOAL, status: '' })
  let saveFailed = false

  // Keeps only what looks right, so a hand-edited or old backup can't break
  // the page.
  function clean(raw) {
    const out = blank()
    if (!raw || typeof raw !== 'object') return out
    const arr = v => (Array.isArray(v) ? v : [])
    out.decks = arr(raw.decks).filter(d => d && d.id && d.title).map(d => ({
      id: str(d.id, 40), title: str(d.title, 120), description: str(d.description, 300), created: str(d.created, 40) || new Date().toISOString(),
      cards: arr(d.cards).filter(c => c && c.id && c.term && c.definition).map(c => ({ id: str(c.id, 40), term: str(c.term, 500), definition: str(c.definition, 1000) })),
    }))
    if (raw.progress && typeof raw.progress === 'object') {
      for (const [id, p] of Object.entries(raw.progress)) {
        if (p && isDay(p.due)) out.progress[id] = { box: Math.max(0, Math.min(INTERVALS.length - 1, p.box | 0)), due: p.due }
      }
    }
    out.attempts = arr(raw.attempts).filter(a => a && a.mode && a.at).map(a => ({
      deckId: a.deckId ? str(a.deckId, 40) : null, mode: str(a.mode, 20), correct: Math.max(0, a.correct | 0), total: Math.max(0, a.total | 0),
      xp: Math.max(0, a.xp | 0), coins: Math.max(0, a.coins | 0), at: str(a.at, 40), ms: a.ms ? Math.max(0, a.ms | 0) : null,
    })).slice(-5000)
    out.assignments = arr(raw.assignments).filter(a => a && a.id && a.title && isDay(a.due)).map(a => ({
      id: str(a.id, 40), title: str(a.title, 200), due: a.due, turnedIn: !!a.turnedIn, turnedInAt: a.turnedInAt ? str(a.turnedInAt, 40) : null,
      xpAwarded: !!a.xpAwarded, created: str(a.created, 40) || new Date().toISOString(),
    }))
    out.coupons = arr(raw.coupons).filter(c => c && c.id && c.title).map(c => ({
      id: str(c.id, 40), title: str(c.title, 120), emoji: str(c.emoji, 8) || '🎁', cost: Math.max(0, Math.min(100000, c.cost | 0)),
      at: str(c.at, 40) || new Date().toISOString(), redeemed: !!c.redeemed, redeemedAt: c.redeemedAt ? str(c.redeemedAt, 40) : null,
    }))
    const g = parseInt(raw.goal, 10)
    out.goal = g > 0 ? Math.max(50, Math.min(100000, g)) : DEFAULT_GOAL
    out.status = str(raw.status, 80)
    return out
  }

  function load() {
    try { return clean(JSON.parse(localStorage.getItem(KEY))) } catch (e) { return blank() }
  }
  let D = load()

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(D)); saveFailed = false } catch (e) { saveFailed = true }
    if (typeof hubRefresh === 'function') { try { hubRefresh() } catch (e) { /* the hub's problem */ } }
  }

  // ── Economy (Hiranda's stats.ts and actions.ts) ──
  function stats() {
    const today = dayKey()
    const graded = D.attempts.filter(a => dayOf(a.at) === today && GRADED.has(a.mode))
    const flawlessToday = graded.filter(a => a.total > 0 && a.correct === a.total).length
    const wrongToday = graded.reduce((s, a) => s + Math.max(0, a.total - a.correct), 0)
    const health = Math.max(0, Math.min(HEALTH_MAX, HEALTH_BASE + 5 * flawlessToday - wrongToday))
    const xp = D.attempts.reduce((s, a) => s + a.xp, 0)
    const weekAgo = Date.now() - 7 * 86400000
    const weeklyXp = D.attempts.filter(a => new Date(a.at).getTime() >= weekAgo).reduce((s, a) => s + a.xp, 0)
    const earned = D.attempts.reduce((s, a) => s + a.coins, 0)
    const spent = D.coupons.reduce((s, c) => s + c.cost, 0)
    // Best calendar week (Monday to Sunday) for the personal bests.
    const weeks = {}
    for (const a of D.attempts) {
      const d = new Date(a.at)
      const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7))
      const k = dayKey(mon)
      weeks[k] = (weeks[k] || 0) + a.xp
    }
    const bestWeek = Math.max(0, ...Object.values(weeks))
    // Study streak: days in a row with a set or a turn-in, up to today (or
    // yesterday, so it isn't lost before you've studied today).
    const days = new Set(D.attempts.map(a => dayOf(a.at)))
    let streak = 0
    let k = days.has(today) ? today : addDays(today, -1)
    while (days.has(k)) { streak++; k = addDays(k, -1) }
    return { health, flawlessToday, wrongToday, xp, weeklyXp, coins: Math.max(0, earned - spent), earned, spent, bestWeek, streak, studiedToday: days.has(today) }
  }

  // Records a finished set and works out what it's worth: repeating the same
  // deck and mode today earns steeply less, flawless graded sets earn a few
  // extra coins, and coins stop at a daily cap.
  function recordAttempt(deckId, mode, correct, total, xp, ms) {
    let finalXp = Math.max(0, Math.min(10000, Math.round(xp)))
    let coins
    const today = dayKey()
    if (GRADED.has(mode) && deckId) {
      const reps = D.attempts.filter(a => a.deckId === deckId && a.mode === mode && dayOf(a.at) === today).length
      finalXp = Math.round(finalXp * (reps === 0 ? 1 : reps === 1 ? 0.4 : 0.15))
      coins = Math.round(finalXp * 0.4) + (total > 0 && correct === total ? 3 : 0)
    } else coins = Math.round(finalXp * 0.4)
    if (coins > 0) {
      const earnedToday = D.attempts.filter(a => dayOf(a.at) === today).reduce((s, a) => s + a.coins, 0)
      const cap = DAILY_COIN_CAP + (mode === 'quiz' || mode === 'write' ? TEST_COIN_EXTRA : 0)
      coins = Math.max(0, Math.min(coins, cap - earnedToday))
    }
    const a = { deckId: deckId || null, mode, correct: Math.max(0, correct | 0), total: Math.max(0, total | 0), xp: finalXp, coins, at: new Date().toISOString(), ms: ms ? Math.round(ms) : null }
    D.attempts.push(a)
    if (D.attempts.length > 5000) D.attempts.splice(0, D.attempts.length - 5000)
    save()
    return a
  }

  // Leitner spaced repetition: right moves a card up a box (longer wait),
  // wrong sends it back to the first.
  function reviewCard(cardId, correct) {
    const prev = D.progress[cardId]
    const box = correct ? Math.min((prev ? prev.box : 0) + 1, INTERVALS.length - 1) : 0
    D.progress[cardId] = { box, due: addDays(dayKey(), INTERVALS[box]) }
    save()
  }
  const isDue = card => { const p = D.progress[card.id]; return !p || p.due <= dayKey() }
  const dueIn = deck => deck.cards.filter(isDue)
  const allDue = () => D.decks.flatMap(d => dueIn(d))
  const deckById = id => D.decks.find(d => d.id === id)
  const decksNewest = () => D.decks.slice().sort((a, b) => b.created.localeCompare(a.created))

  function bestQuiz(deckId) {
    const runs = D.attempts.filter(a => a.deckId === deckId && a.mode === 'quiz' && a.total > 0)
    if (!runs.length) return null
    return runs.reduce((b, a) => (a.correct / a.total > b.correct / b.total ? a : b))
  }

  // ── Assignments ──
  function addAssignment(title, due) {
    const t = str(title, 200)
    if (!t || !isDay(due)) return false
    D.assignments.push({ id: newId(), title: t, due, turnedIn: false, turnedInAt: null, xpAwarded: false, created: new Date().toISOString() })
    save()
    return true
  }
  // XP and coins come once ever, on the first turn-in, so undo and redo
  // can't farm them.
  function toggleTurnIn(a) {
    if (!a.turnedIn && !a.xpAwarded && !confirm(`Turn in “${a.title}”? You only earn the XP once.`)) return
    a.turnedIn = !a.turnedIn
    a.turnedInAt = a.turnedIn ? new Date().toISOString() : null
    if (a.turnedIn && !a.xpAwarded) {
      a.xpAwarded = true
      D.attempts.push({ deckId: null, mode: 'assignment', correct: 1, total: 1, xp: TURN_IN_XP, coins: TURN_IN_COINS, at: new Date().toISOString(), ms: null })
      pop(`✅ +${TURN_IN_XP} XP · +${TURN_IN_COINS} 🪙`)
    }
    save()
    render()
  }
  function deleteAssignment(a) {
    if (!confirm(`Delete “${a.title}”?`)) return
    D.assignments = D.assignments.filter(x => x !== a)
    save()
    render()
  }
  const openAssignments = () => D.assignments.filter(a => !a.turnedIn).sort((a, b) => a.due.localeCompare(b.due) || a.created.localeCompare(b.created))

  // ── Page plumbing ──
  // Like replaceChildren, but skips the false/null that conditional pieces
  // leave (replaceChildren would print them).
  function fill(node, ...kids) {
    node.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false && k !== ''))
    return node
  }
  const root = el('div', { class: 'st-root' })
  let view = { name: 'home' }
  let visible = false
  let timers = []
  let calMonth = (() => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), 1) })()
  let calSel = dayKey()
  let pendingScroll = null
  let shopMsg = null           // the shop's last complaint, shown once

  function stopTimers() {
    for (const t of timers) clearInterval(t)
    timers = []
  }
  function go(v, scrollTo) {
    stopTimers()
    view = v
    pendingScroll = scrollTo || null
    render()
    if (!scrollTo && visible) window.scrollTo(0, 0)
  }
  function render() {
    if (view.name === 'home') fill(root, homeView())
    else if (view.name === 'new') fill(root, newDeckView())
    else if (view.name === 'deck') {
      const deck = deckById(view.id)
      if (!deck) return go({ name: 'home' })
      fill(root, deckView(deck))
    } else if (view.name === 'shop') fill(root, shopView())
    else if (view.name === 'mode') {
      // Modes draw themselves; this is only for a fresh start.
      fill(root, view.node)
    }
    if (pendingScroll) {
      const target = root.querySelector(`[data-section="${pendingScroll}"]`)
      pendingScroll = null
      if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 0)
    }
  }
  function pop(text) {
    const n = el('div', { class: 'st-pop' }, text)
    root.append(n)
    setTimeout(() => n.remove(), 1700)
  }

  // ── Home ──
  function homeView() {
    const s = stats()
    const decks = decksNewest()
    const due = allDue().length
    const goalPct = D.goal > 0 ? Math.round((s.weeklyXp / D.goal) * 100) : 0
    const smart = s.health <= 0
      ? { icon: '🔁', title: 'Out of health — review (free)', hint: 'Spaced-repetition review doesn’t cost hearts', on: () => (due ? startReview(null) : go({ name: 'home' }, 'decks')) }
      : due > 0
        ? { icon: '🔁', title: `Review ${due} card${due !== 1 ? 's' : ''} due`, hint: 'Spaced repetition — the biggest retention win', on: () => startReview(null) }
        : decks.length
          ? { icon: '🧠', title: `Learn “${decks[0].title}”`, hint: 'Active recall beats rereading', on: () => go({ name: 'deck', id: decks[0].id }) }
          : { icon: '✨', title: 'Make your first flashcard set', hint: 'Paste in your notes and start recalling', on: () => go({ name: 'new' }) }

    return el('div', { class: 'st-root-home stack' },
      el('div', { class: 'st-head' },
        el('div', null, el('p', { class: 'st-eyebrow' }, 'Get it done, win coins'), el('h1', { class: 'st-title' }, 'Study')),
        saveFailed && el('p', { class: 'st-warn' }, 'This browser won’t let Study save (private mode?). Use Backup to keep your work.')),
      el('div', { class: 'st-grid' },
        el('div', { class: 'st-w st-health' },
          el('h2', null, '❤️ Health'),
          el('p', { class: 'st-big' }, String(s.health), el('small', null, `/${HEALTH_MAX}`)),
          el('p', { class: 'st-sub' }, s.health <= 0 ? 'Resting — back tomorrow' : s.flawlessToday > 0 ? `+${s.flawlessToday * 5} from flawless` : s.wrongToday > 0 ? `−${s.wrongToday} from misses` : 'Full for today')),
        el('button', { type: 'button', class: 'st-w st-coins', onClick: () => go({ name: 'shop' }) },
          el('h2', null, '🪙 Coins'),
          el('p', { class: 'st-big' }, s.coins.toLocaleString()),
          el('p', { class: 'st-sub st-coin' }, 'Open shop ›')),
        el('div', { class: 'st-w st-span2' }, el('h2', null, '🎯 Weekly goal'), goalWidget(s, goalPct)),
        el('button', { type: 'button', class: 'st-w st-smart st-span4', onClick: smart.on },
          el('span', { class: 'st-smart-icon' }, smart.icon),
          el('div', { style: 'min-width: 0' },

  function ring(pct) {
    const r = 26
    const c = 2 * Math.PI * r
    const p = Math.max(0, Math.min(100, pct))
    const svg = `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(169,155,209,0.22)" stroke-width="6"/>` +
      `<circle cx="32" cy="32" r="${r}" fill="none" stroke="${p >= 100 ? 'var(--good)' : 'var(--magenta)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - p / 100)).toFixed(1)}"/></svg>`
    const n = el('div', { class: 'st-ring' })
    n.innerHTML = svg
    n.append(el('span', null, `${p}%`))
    return n
  }

  function goalWidget(s, pct) {
    const box = el('div', { class: 'st-goal' })
    const show = () => {
      const hit = s.weeklyXp >= D.goal
      fill(box, ring(pct), el('div', { style: 'min-width: 0; flex: 1' },
        el('p', { class: 'name' }, `${s.weeklyXp.toLocaleString()} / ${D.goal.toLocaleString()} XP `,
          el('button', { type: 'button', class: 'st-icon', title: 'Edit goal', onClick: edit }, '✎')),
        el('p', { class: 'st-sub truncate' }, hit ? el('span', { class: 'st-good' }, 'Goal hit! 🎉') : `${(D.goal - s.weeklyXp).toLocaleString()} to go`, D.status ? ` · “${D.status}”` : ''),
        el('p', { class: 'st-sub' }, 'XP in the last 7 days')))
    }
    const edit = () => {
      const goal = el('input', { type: 'number', min: 50, max: 100000, value: String(D.goal), 'aria-label': 'Weekly XP goal' })
      const status = el('input', { maxlength: 80, value: D.status, placeholder: 'Status (optional), e.g. finals week' })
      const saveGoal = e => {
        e.preventDefault()
        const g = parseInt(goal.value, 10)
        if (g > 0) D.goal = Math.max(50, Math.min(100000, g))
        D.status = str(status.value, 80)
        save()
        render()
      }
      fill(box, el('form', { class: 'st-goal-edit grow', onSubmit: saveGoal }, goal, status,
        el('button', { type: 'submit', class: 'primary' }, 'Save'),
        el('button', { type: 'button', class: 'link', onClick: show }, 'Cancel')))
      goal.focus()
    }
    show()
    return box
  }

  function activityLog() {
    const events = [
      ...D.attempts.map(a => {
        const chips = []
        if (a.xp > 0) chips.push(el('span', { class: 'c st-xp' }, `⚡+${a.xp}`))
        if (a.coins > 0) chips.push(el('span', { class: 'c st-coin' }, `🪙+${a.coins}`))
        const wrong = a.mode !== 'assignment' && a.total > 0 ? a.total - a.correct : 0
        if (wrong > 0 && GRADED.has(a.mode)) chips.push(el('span', { class: 'c st-life' }, `❤️−${wrong}`))
        const deck = a.deckId ? deckById(a.deckId) : null
        const label = MODE_LABEL[a.mode] || a.mode
        const text = a.mode === 'assignment' ? 'Turned in an assignment' : `${label}${a.total > 0 ? ` · ${a.correct}/${a.total}` : ''}${deck ? ` · ${deck.title}` : a.mode === 'review' ? ' · all sets' : ''}`
        return { emoji: a.mode === 'assignment' ? '✅' : '📚', text, chips, when: a.at }
      }),
      ...D.coupons.map(c => ({ emoji: c.emoji || '🎁', text: `Bought “${c.title}”`, chips: [el('span', { class: 'c st-coin' }, `🪙−${c.cost}`)], when: c.at })),
    ].sort((a, b) => b.when.localeCompare(a.when)).slice(0, 14)
    if (!events.length) return el('p', { class: 'st-empty' }, 'Nothing yet — play a set or turn something in to see your gains here.')
    return el('div', { class: 'st-log' }, events.map(e => el('div', { class: 'st-log-row' },
      el('span', null, e.emoji), el('span', { class: 't' }, e.text), e.chips, el('span', { class: 'ago' }, ago(e.when)))))

  // ── Calendar: month view, a dot per day with something due ──
  function calendarWidget() {
    const today = dayKey()
    const byDay = {}
    for (const a of D.assignments) (byDay[a.due] = byDay[a.due] || []).push(a)
    const y = calMonth.getFullYear()
    const m = calMonth.getMonth()
    const firstDow = new Date(y, m, 1).getDay()
    const daysIn = new Date(y, m + 1, 0).getDate()
    const dot = k => {
      const list = byDay[k]
      if (!list || !list.length) return ''
      if (list.every(a => a.turnedIn)) return 'done'
      if (k < today) return 'over'
      if (k === today) return 'today'
      return 'soon'
    }
    const cells = []
    for (let i = 0; i < firstDow; i++) cells.push(el('span'))
    for (let d = 1; d <= daysIn; d++) {
      const k = dayKey(new Date(y, m, d))
      const list = byDay[k] || []
      cells.push(el('button', {
        type: 'button', class: `st-day ${k === today ? 'today' : ''} ${k === calSel ? 'sel' : ''}`,
        'aria-label': `${k}${list.length ? `, ${list.length} due` : ''}`, onClick: () => { calSel = k; render() },
      }, el('span', null, String(d)), el('i', { class: `st-dot ${dot(k)}` })))
    }
    const sel = (byDay[calSel] || []).slice().sort((a, b) => Number(a.turnedIn) - Number(b.turnedIn))
    const title = el('input', { maxlength: 200, placeholder: 'Assignment…', 'aria-label': 'New assignment for this day' })
    const add = el('form', { class: 'st-add', hidden: true, onSubmit: e => {
      e.preventDefault()
      if (addAssignment(title.value, calSel)) render()
    } }, title, el('button', { type: 'submit', class: 'primary' }, 'Add'))
    return [
      el('div', { class: 'st-cal-head' },
        el('strong', null, calMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })),
        el('div', { class: 'st-cal-nav' },
          el('button', { type: 'button', 'aria-label': 'Previous month', onClick: () => { calMonth = new Date(y, m - 1, 1); render() } }, '‹'),
          el('button', { type: 'button', class: 'link', onClick: () => { const t = new Date(); calMonth = new Date(t.getFullYear(), t.getMonth(), 1); calSel = dayKey(); render() } }, 'Today'),
          el('button', { type: 'button', 'aria-label': 'Next month', onClick: () => { calMonth = new Date(y, m + 1, 1); render() } }, '›'))),
      el('div', { class: 'st-cal' }, ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(w => el('span', { class: 'st-wd' }, w)), cells),
      el('div', { class: 'st-agenda' },
        el('div', { class: 'st-cal-head' },
          el('span', { class: 'st-sub' }, parseDay(calSel).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })),
          el('button', { type: 'button', class: 'link', onClick: () => { add.hidden = !add.hidden; if (!add.hidden) title.focus() } }, '+ Add')),
        add,
        !sel.length && el('p', { class: 'st-sub' }, 'Nothing due.'),
        el('div', { class: 'st-list' }, sel.map(a => el('div', { class: `st-item ${a.turnedIn ? 'done' : ''}` },
          el('button', { type: 'button', class: `st-check ${a.turnedIn ? 'on' : ''}`, title: a.turnedIn ? 'Undo turn-in' : 'Turn in', onClick: () => toggleTurnIn(a) }, a.turnedIn ? '✓' : ''),
          el('div', { class: 'main' }, el('p', null, a.title), !a.turnedIn && el('p', { class: `st-due ${dueLabel(a.due).tone}` }, dueLabel(a.due).text)),
          el('button', { type: 'button', class: 'st-icon', title: 'Delete', onClick: () => deleteAssignment(a) }, '🗑'))))),

  // A line per card, split on the first tab, " - ", " — ", " = ", ": " or "|".
  function parsePairs(text) {
    return String(text || '').split(/\r?\n/).map(line => {
      const m = line.match(/^(.*?)(?:\t| [—–-] | = |: |\|)(.*)$/)
      return m ? { term: m[1].trim(), definition: m[2].trim() } : null
    }).filter(p => p && p.term && p.definition)
  }

  function deckView(deck) {
    const s = stats()
    const n = deck.cards.length
    const due = dueIn(deck).length
    const enough = n >= 4
    const noHealth = s.health <= 0
    const graded = base => (noHealth ? 'no health — rest or review' : base)
    const best = bestQuiz(deck.id)
    const mode = (ic, label, hint, disabled, onClick, accent, badge) => el('button', { type: 'button', class: `st-mode ${accent ? 'accent' : ''}`, disabled, onClick },
      el('span', { class: 'ic' }, ic), el('strong', null, label), el('span', { class: 'st-sub' }, hint), badge ? el('span', { class: 'st-badge' }, String(badge)) : null)
    return el('div', { class: 'stack' },
      el('button', { type: 'button', class: 'link st-back', onClick: () => go({ name: 'home' }, 'decks') }, '‹ Study'),
      el('div', null,
        el('h1', { class: 'st-title' }, deck.title),
        deck.description && el('p', { class: 'muted' }, deck.description)),
      el('div', { class: 'row', style: 'flex-wrap: wrap' },
        el('span', { class: 'pill' }, `🏆 Your best quiz ${best ? `${best.correct}/${best.total}` : '—'}`),
        el('span', { class: 'pill' }, `❤️ ${s.health}/${HEALTH_MAX}`)),
      el('div', { class: 'st-modes' },
        mode('🧠', 'Learn', graded(enough ? 'adaptive · masters weak cards' : 'add 4+ cards'), !enough || noHealth, () => startLearn(deck), true),
        mode('⌨️', 'Write', graded(n >= 1 ? 'type it · best recall · most XP' : 'add cards'), n < 1 || noHealth, () => startWrite(deck), true),
        mode('⚡', 'Quiz', graded(enough ? 'timed multiple choice' : 'add 4+ cards'), !enough || noHealth, () => startQuiz(deck)),
        mode('🧩', 'Match', graded(enough ? 'beat the clock' : 'add 4+ cards'), !enough || noHealth, () => startMatch(deck)),
        mode('🔁', 'Review', due > 0 ? `${due} due now · free` : 'all caught up', due < 1, () => startReview(deck), false, due),
        mode('🗂️', 'Flashcards', `${n} card${n !== 1 ? 's' : ''} · free`, n < 1, () => startFlash(deck))),
      cardManager(deck))
  }

  function cardManager(deck) {
    const box = el('section', { class: 'st-w stack tight' })
    const paste = el('textarea', { rows: 5, placeholder: 'Paste one card per line:\nhola - hello\nadiós - goodbye\ngato: cat' })
    const count = el('span', { class: 'st-sub' }, '0 cards detected · splits on tab, “-”, “:”, “=”')
    const importBtn = el('button', { type: 'button', class: 'primary', disabled: true }, 'Import')
    const importBox = el('div', { class: 'stack tight', hidden: true }, paste,
      el('div', { class: 'row', style: 'justify-content: space-between; align-items: center; flex-wrap: wrap' }, count, importBtn))
    paste.addEventListener('input', () => {
      const k = parsePairs(paste.value).length
      count.textContent = `${k} card${k !== 1 ? 's' : ''} detected · splits on tab, “-”, “:”, “=”`
      importBtn.disabled = !k
      importBtn.textContent = k ? `Import ${k}` : 'Import'
    })
    importBtn.addEventListener('click', () => {
      const pairs = parsePairs(paste.value).slice(0, 500)
      if (!pairs.length) return
      for (const p of pairs) deck.cards.push({ id: newId(), term: str(p.term, 500), definition: str(p.definition, 1000) })
      save()
      pop(`🗂️ Added ${pairs.length} card${pairs.length !== 1 ? 's' : ''}`)
      render()
    })
    const term = el('input', { placeholder: 'Term', maxlength: 500, 'aria-label': 'Term' })
    const def = el('input', { placeholder: 'Definition', maxlength: 1000, 'aria-label': 'Definition' })
    term.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); def.focus() } })
    const add = el('form', { class: 'st-card-add', onSubmit: e => {
      e.preventDefault()
      if (!term.value.trim() || !def.value.trim()) return
      deck.cards.push({ id: newId(), term: str(term.value, 500), definition: str(def.value, 1000) })
      save()
      render()
      const again = root.querySelector('.st-card-add input')
      if (again) again.focus()
    } }, term, def, el('button', { type: 'submit', class: 'primary', 'aria-label': 'Add card' }, '+'))
    const row = c => {
      const r = el('div', { class: 'st-card-row' })
      const show = () => fill(r, el('span', null, c.term), el('span', null, c.definition),
        el('button', { type: 'button', class: 'link', onClick: edit }, 'edit'),
        el('button', { type: 'button', class: 'st-icon', title: 'Delete card', onClick: () => {
          deck.cards = deck.cards.filter(x => x !== c)
          delete D.progress[c.id]
          save()
          render()
        } }, '🗑'))
      const edit = () => {
        const t = el('input', { value: c.term, maxlength: 500 })
        const d = el('input', { value: c.definition, maxlength: 1000 })
        fill(r, el('form', { class: 'st-card-add grow', onSubmit: e => {
          e.preventDefault()
          if (!t.value.trim() || !d.value.trim()) return
          c.term = str(t.value, 500)
          c.definition = str(d.value, 1000)
          save()
          show()
        } }, t, d, el('button', { type: 'submit', class: 'primary' }, 'Save'), el('button', { type: 'button', class: 'link', onClick: show }, 'Cancel')))
        t.focus()
      }
      show()
      return r
    }
    fill(box,
      el('div', { class: 'st-section-head' },
        el('h2', { class: 'st-label' }, `${deck.cards.length} card${deck.cards.length !== 1 ? 's' : ''}`),
        el('button', { type: 'button', class: 'link', onClick: () => { importBox.hidden = !importBox.hidden; if (!importBox.hidden) paste.focus() } }, '📋 Paste to import')),
      importBox,
      add,
      el('div', { class: 'st-cards' }, deck.cards.map(row)),
      el('button', { type: 'button', class: 'link st-back', style: 'margin-top: 10px', onClick: () => {
        if (!confirm('Delete this set and all its cards? This can’t be undone.')) return
        for (const c of deck.cards) delete D.progress[c.id]
        D.decks = D.decks.filter(d => d !== deck)
        save()
        go({ name: 'home' }, 'decks')
      } }, '🗑 Delete set'))
    return box
  }

  // ── Study modes ──
  // Each mode owns a node it redraws; going anywhere else stops its timers.
  function modeShell(title, onExit) {
    const prog = el('span', { class: 'st-prog' })
    const body = el('div', { class: 'stack tight' })
    const node = el('div', { class: 'st-mode-view' },
      el('div', { class: 'st-shell-top' }, el('button', { type: 'button', class: 'link', onClick: onExit }, `‹ ${title}`), prog),
      body)
    return { node, body, prog, setProg: t => { prog.textContent = t || '' } }
  }
  function showMode(shell, extra) {
    stopTimers()
    view = Object.assign({ name: 'mode', node: shell.node }, extra || {})
    fill(root, shell.node)
    if (visible) window.scrollTo(0, 0)
  }
  const backTo = deck => () => (deck ? go({ name: 'deck', id: deck.id }) : go({ name: 'home' }, 'decks'))

  function distractors(card, cards) {
    const seen = new Set([card.definition])
    const out = []
    for (const c of shuffle(cards)) {
      if (out.length >= 3) break
      if (c.id === card.id || seen.has(c.definition)) continue
      seen.add(c.definition)
      out.push(c.definition)
    }
    return out
  }

  // The celebratory end screen every mode shares.
  function resultView(shell, { correct, total, attempt, label, extra, again, exit }) {
    const perfect = total > 0 && correct === total
    shell.setProg('')
    fill(shell.body, el('div', { class: 'st-result' },
      el('div', { class: 'em' }, perfect ? '🎉' : correct / Math.max(1, total) >= 0.6 ? '💪' : '🌱'),
      el('p', { class: 'st-label' }, label || 'You scored'),
      el('p', { class: 'score' }, String(correct), el('small', null, `/${total}`)),
      el('div', { class: 'st-gain' },
        el('span', { class: 'st-xp' }, `⚡ +${attempt.xp} XP`),
        el('span', { class: 'st-coin' }, `🪙 +${attempt.coins}`),
        GRADED.has(attempt.mode) && attempt.total - attempt.correct > 0 && el('span', { class: 'st-life' }, `❤️ −${attempt.total - attempt.correct}`)),
      extra,
      perfect && el('p', { class: 'st-good' }, 'Perfect run! 🔥'),
      el('div', { class: 'st-two', style: 'width: 100%; margin-top: 12px' },
        el('button', { type: 'button', onClick: exit }, 'Done'),
        again && el('button', { type: 'button', class: 'primary', onClick: again }, 'Again'))))
  }

  function startFlash(deck) {
    const shell = modeShell('Flashcards', backTo(deck))
    const order = shuffle(deck.cards)
    let i = 0
    let flipped = false
    const draw = () => {
      const c = order[i]
      shell.setProg(`${i + 1} / ${order.length}`)
      fill(shell.body,
        el('button', { type: 'button', class: 'st-face', onClick: () => { flipped = !flipped; draw() } },
          el('div', null, el('p', { class: 'side' }, flipped ? 'definition' : 'term'), el('p', { class: 'txt' }, flipped ? c.definition : c.term),
            el('p', { class: 'st-sub', style: 'margin-top: 18px' }, 'tap or Space to flip · ← → to move'))),
        el('div', { class: 'st-two' },
          el('button', { type: 'button', disabled: i === 0, onClick: () => { i--; flipped = false; draw() } }, 'Previous'),
          el('button', { type: 'button', class: 'primary', disabled: i === order.length - 1, onClick: () => { i++; flipped = false; draw() } }, 'Next')))
    }
    showMode(shell, {
      key: e => {
        if (e.key === ' ') { flipped = !flipped; draw(); return true }
        if (e.key === 'ArrowRight' && i < order.length - 1) { i++; flipped = false; draw(); return true }
        if (e.key === 'ArrowLeft' && i > 0) { i--; flipped = false; draw(); return true }
        return false
      },
    })
    draw()
  }

  function startQuiz(deck) {
    const shell = modeShell('Quiz', backTo(deck))
    const before = bestQuiz(deck.id)
    const qs = shuffle(deck.cards).slice(0, Math.min(10, deck.cards.length)).map(card => ({ card, options: shuffle([card.definition, ...distractors(card, deck.cards)]) }))
    let qi = 0
    let correct = 0
    let xp = 0
    let picked = null
    let left = QUESTION_SECONDS
    const started = Date.now()
    const choose = opt => {
      if (picked !== null) return
      picked = opt
      if (opt === qs[qi].card.definition) { correct++; xp += 10 + (left > QUESTION_SECONDS / 2 ? 5 : 0) }
      draw()
    }
    const advance = () => {
      if (qi + 1 >= qs.length) {
        stopTimers()
        const finalXp = xp + (correct === qs.length ? 25 : 0)
        const a = recordAttempt(deck.id, 'quiz', correct, qs.length, finalXp, Date.now() - started)
        const beat = !before || correct / qs.length > before.correct / before.total
        return resultView(shell, { correct, total: qs.length, attempt: a, extra: beat && correct > 0 && el('p', { class: 'st-coin' }, '🎉 New personal best!'), again: () => startQuiz(deck), exit: backTo(deck) })
      }
      qi++
      picked = null
      left = QUESTION_SECONDS
      draw()
    }
    const bar = el('div', { class: 'st-bar time' }, el('div'))
    const clock = el('span', { class: 'st-prog' })
    const tick = () => {
      bar.firstChild.style.width = `${(left / QUESTION_SECONDS) * 100}%`
      clock.textContent = `⏱ ${left}s`
    }
    const draw = () => {
      const q = qs[qi]
      shell.setProg(`${qi + 1} / ${qs.length}`)
      tick()
      fill(shell.body,
        el('div', { class: 'row', style: 'align-items: center' }, el('div', { class: 'grow' }, bar), clock),
        el('div', { class: 'st-q' }, el('p', { class: 'side' }, 'What matches'), el('p', { class: 'txt' }, q.card.term)),
        el('div', { class: 'st-opts' }, q.options.map((opt, k) => {
          const right = opt === q.card.definition
          const state = picked === null ? '' : right ? 'right' : picked === opt ? 'wrong' : 'dim'
          return el('button', { type: 'button', class: `st-opt ${state}`, disabled: picked !== null, onClick: () => choose(opt) }, `${state === 'right' ? '✓ ' : state === 'wrong' ? '✗ ' : `${k + 1}. `}${opt}`)
        })),
        picked !== null && el('button', { type: 'button', class: 'primary', onClick: advance }, qi + 1 >= qs.length ? 'See results' : 'Next'))
    }
    showMode(shell, {
      key: e => {
        if (picked === null && /^[1-4]$/.test(e.key)) { const o = qs[qi].options[Number(e.key) - 1]; if (o !== undefined) choose(o); return true }
        if (picked !== null && e.key === 'Enter') { advance(); return true }
        return false
      },
    })
    draw()
    // The clock only runs while Study is on screen.
    timers.push(setInterval(() => {
      if (!visible || picked !== null) return
      left--
      if (left <= 0) { left = 0; choose('') } else tick()
    }, 1000))
  }

  // Type the answer: compared without case, extra spaces or a trailing stop.
  const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?;:]$/, '')
  function startWrite(deck) {
    const shell = modeShell('Write', backTo(deck))
    const order = shuffle(deck.cards).slice(0, Math.min(12, deck.cards.length))
    let i = 0
    let correct = 0
    let checked = null
    const started = Date.now()
    const input = el('input', { class: 'st-write', placeholder: 'your answer…', autocomplete: 'off', 'aria-label': 'Your answer' })
    const submit = () => {
      if (checked !== null || !input.value.trim()) return
      checked = norm(input.value) === norm(order[i].definition)
      if (checked) correct++
      draw()
    }
    const next = () => {
      if (i + 1 >= order.length) {
        const xp = correct * 15 + (correct === order.length ? 30 : 0)
        const a = recordAttempt(deck.id, 'write', correct, order.length, xp, Date.now() - started)
        return resultView(shell, { correct, total: order.length, attempt: a, again: () => startWrite(deck), exit: backTo(deck) })
      }
      i++
      checked = null
      input.value = ''
      draw()
    }
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (checked === null) submit(); else next() } })
    const btn = el('button', { type: 'button', class: 'primary', onClick: () => (checked === null ? submit() : next()) })
    const draw = () => {
      const c = order[i]
      shell.setProg(`${i + 1} / ${order.length}`)
      input.disabled = checked !== null
      input.className = `st-write ${checked === null ? '' : checked ? 'right' : 'wrong'}`
      btn.textContent = checked === null ? 'Check' : i + 1 >= order.length ? 'See results' : 'Next'
      fill(shell.body,
        el('div', { class: 'st-q' }, el('p', { class: 'side' }, 'Type the answer'), el('p', { class: 'txt' }, c.term)),
        input,
        checked === false && el('p', { class: 'muted' }, 'Answer: ', el('span', { class: 'st-good' }, c.definition)),
        checked === true && el('p', { class: 'st-good' }, '✓ Correct'),
        btn)
      if (checked === null) setTimeout(() => input.focus(), 0)
      else setTimeout(() => btn.focus(), 0)
    }
    showMode(shell)
    draw()
  }

  // Adaptive: a card you miss goes to the back of the line until you get it.
  function startLearn(deck) {
    const shell = modeShell('Learn', backTo(deck))
    const all = shuffle(deck.cards)
    const byId = new Map(all.map(c => [c.id, c]))
    let queue = all.map(c => c.id)
    const missed = new Set()
    let picked = null
    let options = []
    const started = Date.now()
    const newOptions = () => {
      const c = byId.get(queue[0])
      options = c ? shuffle([c.definition, ...distractors(c, all)]) : []
    }
    const choose = opt => {
      if (picked !== null) return
      picked = opt
      const c = byId.get(queue[0])
      if (opt !== c.definition) missed.add(c.id)
      draw()
    }
    const advance = () => {
      const c = byId.get(queue[0])
      const right = picked === c.definition
      picked = null
      const rest = queue.slice(1)
      queue = right ? rest : [...rest, c.id]
      if (!queue.length) {
        const firstTry = all.length - missed.size
        const a = recordAttempt(deck.id, 'learn', firstTry, all.length, all.length * 12 + firstTry * 3, Date.now() - started)
        return resultView(shell, { correct: firstTry, total: all.length, attempt: a, label: 'first-try correct', again: () => startLearn(deck), exit: backTo(deck) })
      }
      newOptions()
      draw()
    }
    const draw = () => {
      const c = byId.get(queue[0])
      const remaining = new Set(queue).size
      const pct = Math.round(((all.length - remaining) / all.length) * 100)
      shell.setProg(`${all.length - remaining} / ${all.length} mastered`)
      fill(shell.body,
        el('div', { class: 'st-bar' }, el('div', { style: `width: ${pct}%` })),
        el('div', { class: 'st-q' }, el('p', { class: 'side' }, 'What matches'), el('p', { class: 'txt' }, c.term)),
        el('div', { class: 'st-opts' }, options.map((opt, k) => {
          const right = opt === c.definition
          const state = picked === null ? '' : right ? 'right' : picked === opt ? 'wrong' : 'dim'
          return el('button', { type: 'button', class: `st-opt ${state}`, disabled: picked !== null, onClick: () => choose(opt) }, `${state === 'right' ? '✓ ' : state === 'wrong' ? '✗ ' : `${k + 1}. `}${opt}`)
        })),
        picked !== null && el('button', { type: 'button', class: 'primary', onClick: advance }, 'Continue'))
    }
    showMode(shell, {
      key: e => {
        if (picked === null && /^[1-4]$/.test(e.key)) { const o = options[Number(e.key) - 1]; if (o !== undefined) choose(o); return true }
        if (picked !== null && e.key === 'Enter') { advance(); return true }
        return false
      },
    })
    newOptions()
    draw()
  }

  // Match the pairs against the clock (which only runs while you can see it).
  function startMatch(deck) {
    const shell = modeShell('Match', backTo(deck))
    const pairs = shuffle(deck.cards).slice(0, Math.min(6, deck.cards.length))
    const tiles = shuffle([
      ...pairs.map(c => ({ key: `t-${c.id}`, cardId: c.id, text: c.term })),
      ...pairs.map(c => ({ key: `d-${c.id}`, cardId: c.id, text: c.definition })),
    ])
    let sel = null
    let wrong = null
    const matched = new Set()
    let elapsed = 0
    let lastTick = Date.now()
    let done = false
    const secs = () => Math.floor(elapsed / 1000)
    const tap = t => {
      if (matched.has(t.key) || wrong || done) return
      if (sel === null) { sel = t.key; return draw() }
      if (sel === t.key) { sel = null; return draw() }
      const first = tiles.find(x => x.key === sel)
      if (first.cardId === t.cardId) {
        matched.add(sel)
        matched.add(t.key)
        sel = null
        if (matched.size === tiles.length) return finish()
        return draw()
      }
      wrong = t.key
      draw()
      setTimeout(() => { wrong = null; sel = null; if (!done && view.node === shell.node) draw() }, 500)
    }
    const finish = () => {
      done = true
      stopTimers()
      elapsed += visible ? Date.now() - lastTick : 0
      const s = secs()
      const a = recordAttempt(deck.id, 'match', pairs.length, pairs.length, pairs.length * 8 + Math.max(0, 60 - s), elapsed)
      resultView(shell, { correct: pairs.length, total: pairs.length, attempt: a, label: `matched in ${s}s`, again: () => startMatch(deck), exit: backTo(deck) })
    }
    const draw = () => {
      shell.setProg(`⏱ ${secs()}s`)
      fill(shell.body, el('div', { class: 'st-tiles' }, tiles.map(t => el('button', {
        type: 'button', class: `st-tile ${matched.has(t.key) ? 'gone' : ''} ${sel === t.key ? 'sel' : ''} ${wrong === t.key ? 'wrong' : ''}`,
        disabled: matched.has(t.key), onClick: () => tap(t),
      }, t.text))))
    }
    showMode(shell)
    draw()
    timers.push(setInterval(() => {
      const now = Date.now()
      if (visible) elapsed += now - lastTick
      lastTick = now
      shell.setProg(`⏱ ${secs()}s`)
    }, 250))
  }

  // Spaced-repetition review: the cards due in one set, or interleaved
  // across every set. Free: it never costs health.
  function startReview(deck) {
    const cards = shuffle(deck ? dueIn(deck) : allDue())
    if (!cards.length) { pop('🎉 All caught up'); return go(deck ? { name: 'deck', id: deck.id } : { name: 'home' }) }
    const shell = modeShell(deck ? 'Review' : 'Review all sets', backTo(deck))
    let i = 0
    let revealed = false
    let correct = 0
    const started = Date.now()
    const rate = got => {
      reviewCard(cards[i].id, got)
      if (got) correct++
      if (i + 1 >= cards.length) {
        const a = recordAttempt(deck ? deck.id : null, 'review', correct, cards.length, correct * (deck ? 5 : 6), Date.now() - started)
        return resultView(shell, { correct, total: cards.length, attempt: a, label: 'reviewed', extra: el('p', { class: 'muted' }, 'Cards you missed come back sooner.'), exit: backTo(deck) })
      }
      i++
      revealed = false
      draw()
    }
    const draw = () => {
      const c = cards[i]
      const p = D.progress[c.id]
      shell.setProg(`${i + 1} / ${cards.length}`)
      const deckName = !deck && (D.decks.find(d => d.cards.includes(c)) || {}).title
      fill(shell.body,
        el('div', { class: 'st-face' }, el('div', null,
          el('p', { class: 'side' }, deckName ? `term · ${deckName}` : 'term'),
          el('p', { class: 'txt' }, c.term),
          revealed && el('p', { class: 'ans' }, c.definition))),
        !revealed
          ? el('button', { type: 'button', onClick: () => { revealed = true; draw() } }, 'Show answer (Space)')
          : el('div', { class: 'st-two' },
            el('button', { type: 'button', class: 'st-miss', onClick: () => rate(false) }, '✗ Missed (1)'),
            el('button', { type: 'button', class: 'st-got', onClick: () => rate(true) }, `✓ Got it (2) · next in ${INTERVALS[Math.min((p ? p.box : 0) + 1, INTERVALS.length - 1)]}d`)))
    }
    showMode(shell, {
      key: e => {
        if (!revealed && (e.key === ' ' || e.key === 'Enter')) { revealed = true; draw(); return true }
        if (revealed && e.key === '1') { rate(false); return true }
        if (revealed && e.key === '2') { rate(true); return true }
        return false
      },
    })
    draw()
  }

  // ── Shop: spend coins on rewards for yourself ──
  function shopView() {
    const s = stats()
    const msg = shopMsg
    shopMsg = null
    const buy = (emoji, title, cost) => {
      const t = str(title, 120)
      const c = Math.max(0, Math.min(100000, Math.round(cost)))
      if (!t) { shopMsg = 'Give the reward a title.'; return render() }
      if (stats().coins < c) { shopMsg = 'Not enough coins yet.'; return render() }
      D.coupons.push({ id: newId(), title: t, emoji: str(emoji, 8) || '🎁', cost: c, at: new Date().toISOString(), redeemed: false, redeemedAt: null })
      save()
      pop(`${emoji || '🎁'} Bought · 🪙 −${c}`)
      render()
    }
    const owned = D.coupons.filter(c => !c.redeemed).sort((a, b) => b.at.localeCompare(a.at))
    const used = D.coupons.filter(c => c.redeemed).sort((a, b) => (b.redeemedAt || '').localeCompare(a.redeemedAt || '')).slice(0, 12)
    const emoji = el('input', { name: 'emoji', value: '🎁', maxlength: 8, 'aria-label': 'Emoji' })
    const title = el('input', { name: 'title', maxlength: 120, placeholder: 'A reward of your own…', 'aria-label': 'Reward' })
    const cost = el('input', { name: 'cost', type: 'number', min: 0, value: '50', 'aria-label': 'Cost in coins' })
    const page = el('div', { class: 'stack' },
      el('button', { type: 'button', class: 'link st-back', onClick: () => go({ name: 'home' }) }, '‹ Study'),
      el('div', { class: 'st-head' },
        el('div', null, el('p', { class: 'st-eyebrow' }, 'Treat yourself'), el('h1', { class: 'st-title' }, 'Reward shop')),
        el('span', { class: 'pill st-coin', style: 'font-size: 16px' }, `🪙 ${s.coins.toLocaleString()}`)),
      el('p', { class: 'muted small' }, `Earn coins with sets and turn-ins (up to ${DAILY_COIN_CAP} a day, a bit more from quizzes and Write), then cash them in.`),
      el('div', { class: 'st-shop' }, PRESETS.map(p => el('button', {
        type: 'button', class: 'st-coupon', disabled: s.coins < p.cost, onClick: () => buy(p.emoji, p.title, p.cost),
      }, el('span', { class: 'em' }, p.emoji), el('span', { class: 'ttl' }, p.title), el('span', { class: 'cost' }, `🪙 ${p.cost}`)))),
      el('form', { class: 'st-w', onSubmit: e => { e.preventDefault(); buy(emoji.value, title.value, parseInt(cost.value, 10) || 0) } },
        el('h2', null, '✏️ Make your own'),
        el('div', { class: 'st-custom' }, emoji, title, cost, el('button', { type: 'submit', class: 'primary' }, 'Buy'))),
      el('section', { class: 'st-w', 'data-section': 'rewards' },
        el('h2', null, '🎟️ Your rewards'),
        !owned.length && !used.length && el('p', { class: 'st-empty' }, 'Nothing bought yet.'),
        el('div', { class: 'st-list' },
          owned.map(c => el('div', { class: 'st-item' },
            el('span', { style: 'font-size: 20px' }, c.emoji),
            el('div', { class: 'main' }, el('p', null, c.title), el('p', { class: 'st-due st-coin' }, `🪙 ${c.cost} · bought ${ago(c.at)} ago`.replace('now ago', 'just now'))),
            el('button', { type: 'button', class: 'chip', onClick: () => {
              if (!confirm(`Use “${c.title}” now? Enjoy it!`)) return
              c.redeemed = true
              c.redeemedAt = new Date().toISOString()
              save()
              pop(`${c.emoji} Enjoy!`)
              render()
            } }, 'Use'),
            el('button', { type: 'button', class: 'st-icon', title: 'Refund', onClick: () => {
              if (!confirm(`Refund “${c.title}” for 🪙 ${c.cost}?`)) return
              D.coupons = D.coupons.filter(x => x !== c)
              save()
              render()
            } }, '↩'))),
          used.map(c => el('div', { class: 'st-item done' },
            el('span', { style: 'font-size: 20px' }, c.emoji),
            el('div', { class: 'main' }, el('p', null, c.title), el('p', { class: 'st-due' }, `used ${c.redeemedAt ? ago(c.redeemedAt) : ''} ago`.replace('now ago', 'just now'))),
            el('button', { type: 'button', class: 'link', onClick: () => { c.redeemed = false; c.redeemedAt = null; save(); render() } }, 'Undo'))))),
      msg && el('p', { class: 'error' }, msg))
    return page
  }

  // ── Backup ──
  function exportData() {
    const blob = new Blob([JSON.stringify(Object.assign({ app: 'debrod-study' }, D), null, 2)], { type: 'application/json' })
    const url = URL.createObjectURL(blob)
    // _self: Index's <base target="_top"> would turn the download into a
    // navigation of the top frame.
    const a = el('a', { href: url, download: `debrod-study-${dayKey()}.json`, target: '_self' })
    document.body.append(a)
    a.click()
    a.remove()
    setTimeout(() => URL.revokeObjectURL(url), 10000)
  }
  function importData() {
    const input = el('input', { type: 'file', accept: 'application/json,.json', style: 'display: none' })
    input.addEventListener('change', () => {
      const f = input.files && input.files[0]
      input.remove()
      if (!f) return
      const r = new FileReader()
      r.onload = () => {
        let raw
        try { raw = JSON.parse(String(r.result)) } catch (e) { return alert('That file isn’t a Study backup.') }
        const next = clean(raw)
        const n = next.decks.length + next.assignments.length + next.attempts.length + next.coupons.length
        if (!n && !confirm('That backup is empty. Replace your Study with it anyway?')) return
        if (n && !confirm(`Replace your Study with this backup? (${next.decks.length} sets, ${next.assignments.length} assignments)`)) return
        D = next
        save()
        go({ name: 'home' })
        pop('💾 Backup imported')
      }
      r.readAsText(f)
    })
    document.body.append(input)
    input.click()
  }

  // Keys for the open mode (Space flips, 1–4 answer…), never while typing.
  document.addEventListener('keydown', e => {
    if (!visible || view.name !== 'mode' || !view.key || e.ctrlKey || e.metaKey || e.altKey) return
    if (e.target.closest && e.target.closest('input, textarea, select')) return
    if (view.key(e)) e.preventDefault()
  })

  // Another tab (or the day turning over) may have changed things.
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return
    D = load()
    if (view.name !== 'mode') render()
  })

  render()

  // What the Home hub shows: cheap, plain data.
  function summary() {
    const s = stats()
    return {
      open: openAssignments().map(a => Object.assign({ id: a.id, title: a.title, due: a.due }, (({ text, tone }) => ({ label: text, tone }))(dueLabel(a.due)))),
      overdue: openAssignments().filter(a => a.due < dayKey()).length,
      dueToday: openAssignments().filter(a => a.due === dayKey()).length,
      cardsDue: allDue().length,
      decks: D.decks.length,
      coins: s.coins,
      streak: s.streak,
      goal: { text: `${s.weeklyXp.toLocaleString()} / ${D.goal.toLocaleString()} XP this week`, done: s.weeklyXp, target: D.goal },
    }
  }

  return {
    root,
    show() {
      visible = true
      // Dates move on; the home page recounts when you come back to it.
      if (view.name === 'home') render()
    },
    hide() { visible = false },
    summary,
    // 'assignments', 'calendar', 'decks', 'review', 'shop' or 'home'.
    open(section) {
      if (section === 'review') return allDue().length ? startReview(null) : go({ name: 'home' }, 'decks')
      if (section === 'shop') return go({ name: 'shop' })
      if (['assignments', 'calendar', 'decks'].includes(section)) return go({ name: 'home' }, section)
      if (section === 'home') return go({ name: 'home' })
    },
  }
})()
</script>
