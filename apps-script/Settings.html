<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <?!= include('Styles') ?>
  <style>
    body { min-height: 0; }
    main { padding: 16px; }
    .field small { display: block; margin-top: 4px; }
    .clear { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 4px; color: var(--muted); }
    .clear input { width: auto; }
    h2 { font: 700 13px/1.4 var(--display); letter-spacing: 0.14em; color: var(--cyan); margin: 8px 0 0; }
  </style>
</head>
<body data-web="<?= web ?>">
  <main>
    <form id="form" class="stack">
      <p class="muted small">Leave a key blank to keep the one already saved. Anyone who can edit this doc can use these keys.</p>

      <h2>Search</h2>
      <label class="field" data-key="TMDB_API_KEY">
        <span>TMDB API key (v3)</span>
        <input type="password" autocomplete="off">
        <small class="muted"><a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org/settings/api</a></small>
      </label>
      <label class="field" data-key="YOUTUBE_API_KEY">
        <span>YouTube Data API key (optional)</span>
        <input type="password" autocomplete="off">
        <small class="muted">Turns on the YouTube tab in Search. <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank">Enable YouTube Data API v3</a>, then make a key under Credentials.</small>
      </label>

      <h2>Debrid (one or both)</h2>
      <label class="field" data-key="REALDEBRID_API_KEY">
        <span>Real-Debrid API key</span>
        <input type="password" autocomplete="off">
        <small class="muted"><a href="https://real-debrid.com/apitoken" target="_blank">real-debrid.com/apitoken</a></small>
      </label>
      <label class="field" data-key="TORBOX_API_KEY">
        <span>TorBox API key</span>
        <input type="password" autocomplete="off">
        <small class="muted">TorBox → Settings → API key</small>
      </label>

      <h2>Watch together (optional)</h2>
      <label class="field" data-key="SUPABASE_URL">
        <span>Supabase project URL</span>
        <input type="url" placeholder="https://xxxx.supabase.co">
      </label>
      <label class="field" data-key="SUPABASE_ANON_KEY">
        <span>Supabase anon / publishable key</span>
        <input type="password" autocomplete="off">
      </label>

      <h2>Games library (optional)</h2>
      <label class="field" data-key="GAMES_LIBRARY_URL">
        <span>Games library URL</span>
        <input type="url" placeholder="https://xxxx.supabase.co/storage/v1/object/authenticated/roms/">
        <small class="muted">A folder of your own games with a games.json at its top, for the arcade's Retro consoles. See the README.</small>
      </label>
      <label class="field" data-key="GAMES_LIBRARY_KEY">
        <span>Games library key</span>
        <input type="password" autocomplete="off">
        <small class="muted">Sent to the library from the server as a Bearer token. Leave blank if the folder is public.</small>
      </label>

      <h2>Extras (optional)</h2>
      <label class="field" data-key="SITE_NAME">
        <span>Name in the wordmark</span>
        <input placeholder="DEBROD">
      </label>
      <label class="field" data-key="TORRENTIO_URL">
        <span>Torrentio URL</span>
        <input type="url" placeholder="https://torrentio.strem.fun">
      </label>

      <p id="msg" class="muted small"></p>
      <button type="submit" class="primary">Save</button>
      <a id="back" class="link" target="_top" hidden>‹ Back to search</a>
    </form>
  </main>

  <script>
    const form = document.getElementById('form')
    const msg = document.getElementById('msg')
    const fields = [...form.querySelectorAll('[data-key]')]

    function show(settings) {
      for (const f of fields) {
        const s = settings[f.dataset.key]
        const input = f.querySelector('input')
        const old = f.querySelector('.clear')
        if (old) old.remove()
        if ('value' in s) {
          input.value = s.value || ''
          if (s.builtIn) input.placeholder = 'Built in (leave blank to use it)'
        } else {
          input.value = ''
          input.placeholder = s.set ? '•••••••• saved' : s.builtIn ? 'Built in (leave blank to use it)' : 'Not set'
          if (s.set) {
            const box = document.createElement('label')
            box.className = 'clear'
            box.innerHTML = '<input type="checkbox"> Remove this key'
            f.append(box)
          }
        }
      }
    }

    function fail(e) {
      msg.className = 'error'
      msg.textContent = String((e && e.message) || e)
    }

    google.script.run.withSuccessHandler(show).withFailureHandler(fail).getSettings()
    // In the web app this is its own page, so give it a way back.
    google.script.run.withSuccessHandler(cfg => {
      const back = document.getElementById('back')
      if (cfg.appUrl && document.body.dataset.web) { back.href = cfg.appUrl; back.hidden = false }
    }).getConfig()

    form.addEventListener('submit', e => {
      e.preventDefault()
      const values = {}
      const clear = []
      for (const f of fields) {
        values[f.dataset.key] = f.querySelector('input').value
        const box = f.querySelector('.clear input')
        if (box && box.checked) clear.push(f.dataset.key)
      }
      msg.className = 'muted small'
      msg.textContent = 'Saving…'
      google.script.run
        .withSuccessHandler(s => {
          show(s)
          msg.textContent = 'Saved.'
        })
        .withFailureHandler(fail)
        .saveSettings(values, clear)
    })
//# sourceURL=debrod/Settings.js
</script>
</body>
</html>
