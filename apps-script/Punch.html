  // ── Cards ──
  // Cards come in packs: { id, name, prompts: [{ text, pick }], answers }.
  // A card is a short reference, pack:p12 for a prompt or pack:a7 for an
  // answer. The host picks which packs are in.
  const norm = list => list.map(t => (typeof t === 'string' ? { text: t, pick: Math.max(1, blanks(t)) } : t))
  const blanks = t => (String(t).match(/____/g) || []).length
  const BUILT_IN = [
    { id: 'pl', name: 'Punchline', note: 'the originals', prompts: norm(PL_PROMPTS), answers: PL_ANSWERS },
    { id: 'lunch', name: 'Lunchroom', note: 'school cafeteria', prompts: norm(PL_LUNCH_PROMPTS), answers: PL_LUNCH_ANSWERS },
    { id: 'spicy', name: 'Spicy', note: 'crude humour, blurred swearing', prompts: norm(PL_SPICY_PROMPTS), answers: PL_SPICY_ANSWERS },
  ]
  const cah = () => (typeof PUNCH_CAH !== 'undefined' && PUNCH_CAH && Array.isArray(PUNCH_CAH.prompts) ? PUNCH_CAH : null)
  const CAH_CREDIT = 'Cards Against Humanity pack: card text © Cards Against Humanity LLC, CC BY-NC-SA 2.0. Punchline isn\'t affiliated with them.'
  // Every pack this room could use, the custom one built from its text box.
  function packList(g) {
    const out = BUILT_IN.slice()
    const c = cah()
    if (c) out.push({ id: 'cah', name: c.name || 'Cards Against Humanity', note: '18+ · official deck', prompts: norm(c.prompts), answers: c.answers })
    const parsed = parseCustom(g.custom)
    out.push({ id: 'custom', name: 'Custom', note: 'your own', prompts: norm(parsed.cp), answers: parsed.ca })
    return out
  }
  // Packs are looked up once per game (the custom one changes with its box,
  // so a running game keeps the custom cards it started with: g.cp/g.ca).
  function pack(g, id) {
    if (id === 'custom') return { id, name: 'Custom', prompts: norm(g.cp || []), answers: g.ca || [] }
    if (id === 'cah') { const c = cah(); return c ? { id, name: c.name, prompts: norm(c.prompts), answers: c.answers } : null }
    return BUILT_IN.find(p => p.id === id) || null
  }
  function card(g, ref) {
    const [id, rest] = String(ref).split(':')
    const p = pack(g, id)
    if (!p || !rest) return null
    const i = Number(rest.slice(1))
    return rest[0] === 'p' ? (p.prompts[i] ? { text: p.prompts[i].text, pick: p.prompts[i].pick, pack: p.name } : null)
      : p.answers[i] !== undefined ? { text: p.answers[i], pack: p.name } : null
  }
  const text = (g, ref) => { const c = card(g, ref); return c ? c.text : '' }
  const packName = (g, ref) => { const c = card(g, ref); return c ? c.pack : '' }
  const pickOf = (g, ref) => { const c = card(g, ref); return c ? Math.max(1, Math.min(3, c.pick || blanks(c.text) || 1)) : 1 }
  const refs = (id, n, kind) => Array.from({ length: n }, (_, i) => `${id}:${kind}${i}`)

  function allPrompts(g) {
    return (g.packs || []).flatMap(id => { const p = pack(g, id); return p ? refs(id, p.prompts.length, 'p') : [] })
  }
  function allAnswers(g) {
    return (g.packs || []).flatMap(id => { const p = pack(g, id); return p ? refs(id, p.answers.length, 'a') : [] })
  }
  // Cards in someone's hand or on the table right now.
  function inPlay(g) {
    const out = new Set()
    for (const h of Object.values(g.hands || {})) for (const r of h) out.add(r)
    for (const s of Object.values(g.subs || {})) for (const r of s) out.add(r)
    return out
  }
  function drawAnswer(g) {
    if (!g.adeck.length) {
      const used = inPlay(g)
      g.adeck = shuffle(allAnswers(g).filter(r => !used.has(r)))
      if (!g.adeck.length) return null
    }
    return g.adeck.pop()
  }
  function drawPrompt(g) {
    if (!g.pdeck.length) g.pdeck = shuffle(allPrompts(g).filter(r => r !== g.prompt))
    return g.pdeck.pop() || g.prompt
  }
  function deal(g, k) {
    const h = g.hands[k] || (g.hands[k] = [])
    while (h.length < HAND) {
      const r = drawAnswer(g)
      if (!r) break
      h.push(r)
    }
  }

  // Custom cards: one per line. Lines with a blank (or a question mark at
  // the end) are prompts; the rest are answers.
  function parseCustom(raw) {
    const cp = []
    const ca = []
    const seen = new Set()
    for (let line of String(raw || '').split('\n')) {
      line = line.trim().replace(/_{2,}/g, '____').slice(0, 140)
      if (!line || seen.has(line.toLowerCase())) continue
      seen.add(line.toLowerCase())
      if (/____/.test(line) || /\?$/.test(line)) cp.push(line)
      else ca.push(line)
      if (cp.length + ca.length >= 400) break
    }
    return { cp, ca }
  }

  // An answer as it reads inside the prompt: no full stop mid-sentence, and
  // a small first letter after words.
  const PROPER = /^(I\b|Bigfoot|Thanksgiving|Wikipedia|Mercury|New Year|LinkedIn|Netflix|Strip Monopoly|Jello|Grandma|Grandpa|Dad\b|Dad's|Mom\b|Mom's|Florida|Vegas|Steve|Chad)/
  function inline(answer, before, after) {
    let t = answer.trim()
    if (after) t = t.replace(/[.]$/, '')
    if (before && !/[.!?:"“]\s*$/.test(before) && /^[A-Z][a-z]/.test(t) && !PROPER.test(t)) t = t[0].toLowerCase() + t.slice(1)
    return t
  }

  // Card text with [[bleeped]] words blurred until hovered or pressed.
  function rich(t) {
    const parts = String(t).split(/\[\[(.+?)\]\]/)
    return parts.map((p, i) => {
      if (!(i % 2)) return p
      const s = el('span', { class: 'pl-blur', 'aria-label': 'bleeped', title: 'Hover or press to peek' }, p)
      const on = () => s.classList.add('show')
      const off = () => s.classList.remove('show')
      s.addEventListener('pointerdown', on)
      s.addEventListener('click', e => { if (e.pointerType === 'touch' || matchMedia('(hover: none)').matches) e.stopPropagation() })
      s.addEventListener('pointerup', off)
      s.addEventListener('pointerleave', off)
      s.addEventListener('pointercancel', off)
      return s
    })
  }

  // The prompt with these answers filled in (or blank lines if none). Any
  // answers beyond the blanks (a "Make a haiku." pick 3) go after it.
  function sentence(g, promptRef, answers) {
    const t = text(g, promptRef)
    const parts = t.split('____')
    const out = []
    parts.forEach((part, i) => {
      out.push(rich(part))
      if (i === parts.length - 1) return
      const r = answers && answers[i]
      out.push(r ? el('span', { class: 'pl-fill' }, rich(inline(text(g, r), part, parts[i + 1]))) : el('span', { class: 'pl-blank' }, ' '))
    })
    const extra = (answers || []).slice(parts.length - 1)
    if (extra.length) out.push(el('span', { class: 'pl-extra' }, extra.map(r => el('span', { class: 'pl-fill' }, rich(text(g, r))))))
    return out
  }
  const corner = name => name && el('span', { class: 'pl-packtag' }, name)

  // ── The game ──
  function newGame(hostId, prev) {
    return {
      gid: randomId(), v: 0, hostId, phase: 'lobby',
      target: prev ? prev.target : 7, bots: prev ? prev.bots : 0,
      packs: prev ? prev.packs.slice() : ['pl'],
      custom: prev ? prev.custom : '', cp: [], ca: [],
      seats: prev ? prev.seats.filter(x => !x.bot && !x.gone).map(x => ({ id: x.id, name: x.name })) : [],
      round: 0, judge: -1, prompt: '', pdeck: [], adeck: [], hands: {}, subs: {}, need: [], order: [],
      win: -1, winner: -1, log: [], remain: 0,
    }
  }
  function say(g, line) {
    g.log = (g.log || []).concat(line).slice(-4)
  }
  const humans = g => g.seats.filter(x => !x.bot && !x.gone)

  // Who can start: three seats, at least two of them people, a prompt, and
  // enough answers for every hand.
  function startProblem(g) {
    if (g.seats.length < 3) return 'Punchline needs at least 3 seats (add a House bot if you\'re only two).'
    if (humans(g).length < 2) return 'Punchline needs at least two people.'
    if (!(g.packs || []).length) return 'Pick at least one pack.'
    const prompts = allPrompts(g).length
    const answers = allAnswers(g).length
    if (!prompts) return 'The packs you picked have no prompts. Add one (a line with ____ in it) or pick another pack.'
    const need = g.seats.length * HAND + 5
    if (answers < need) return `${g.seats.length} players need at least ${need} answers; the packs you picked have ${answers}.`
    return null
  }

  function startGame(g) {
    const parsed = parseCustom(g.custom)
    g.cp = parsed.cp
    g.ca = parsed.ca
    g.packs = (g.packs || []).filter(id => pack(g, id))
    const err = startProblem(g)
    if (err) return err
    g.seats.forEach(x => { x.score = 0; x.swapped = false })
    g.hands = {}
    g.subs = {}
    g.pdeck = shuffle(allPrompts(g))
    g.adeck = shuffle(allAnswers(g))
    g.prompt = ''
    g.round = 0
    g.winner = -1
    g.judge = -1
    g.log = []
    g.seats.forEach((x, k) => deal(g, k))
    nextJudge(g)
    startRound(g)
    return null
  }

  function nextJudge(g) {
    const n = g.seats.length
    for (let step = 1; step <= n; step++) {
      const k = (g.judge + step + n) % n
      if (!g.seats[k].bot && !g.seats[k].gone) { g.judge = k; return }
    }
  }

  function startRound(g) {
    g.round++
    g.phase = 'submit'
    g.prompt = drawPrompt(g)
    g.subs = {}
    g.order = []
    g.win = -1
    g.seats.forEach((x, k) => deal(g, k))
    g.need = g.seats.map((x, k) => k).filter(k => k !== g.judge && !g.seats[k].gone)
    say(g, `Round ${g.round}: ${seatName(g, g.judge)} is judging.`)
  }

  function allIn(g) {
    return g.need.filter(k => !g.seats[k].gone).every(k => g.subs[k])
  }

  function toJudging(g) {
    const ks = Object.keys(g.subs).map(Number)
    if (!ks.length) {
      say(g, 'Nobody played a card, so on to the next round.')
      nextJudge(g)
      startRound(g)
      return
    }
    g.order = shuffle(ks)
    g.phase = 'judge'
  }

  function award(g, k) {
    g.win = k
    g.seats[k].score = (g.seats[k].score || 0) + 1
    say(g, `${seatName(g, k)} wins the round.`)
    g.seats.forEach((x, j) => deal(g, j))
    if (g.seats[k].score >= g.target) {
      g.phase = 'over'
      g.winner = k
      say(g, `${seatName(g, k)} wins the game!`)
    } else g.phase = 'reveal'
  }

  // The Spicy pack can be switched mid-game: hands keep what they have, and
  // only new draws change.
  function setPack(g, id, on) {
    const has = g.packs.includes(id)
    if (on === has) return
    g.packs = on ? g.packs.concat(id) : g.packs.filter(x => x !== id)
    if (g.phase === 'lobby') return
    const mine = r => r.startsWith(`${id}:`)
    const p = pack(g, id)
    if (on && p) {
      const used = inPlay(g)
      g.adeck = shuffle(g.adeck.concat(refs(id, p.answers.length, 'a').filter(r => !used.has(r))))
      g.pdeck = shuffle(g.pdeck.concat(refs(id, p.prompts.length, 'p').filter(r => r !== g.prompt)))
    } else {
      g.adeck = g.adeck.filter(r => !mine(r))
      g.pdeck = g.pdeck.filter(r => !mine(r))
    }
    say(g, `The ${p ? p.name : id} pack is ${on ? 'in' : 'out'}.`)
  }

  // One move from seat k. Returns an error to show, or nothing.
  function act(g, k, a) {
    const seat = g.seats[k]
    if (!seat || !a) return 'Not your seat.'
    if (a.type === 'submit') {
      if (g.phase !== 'submit') return 'Too late for this round.'
      if (k === g.judge) return 'You\'re judging this round.'
      if (!g.need.includes(k)) return 'You\'re in from the next round.'
      if (g.subs[k]) return 'You\'ve already played.'
      const pick = pickOf(g, g.prompt)
      const idx = Array.isArray(a.cards) ? a.cards.map(Number) : []
      const hand = g.hands[k] || []
      if (idx.length !== pick || new Set(idx).size !== pick || idx.some(i => !(i >= 0 && i < hand.length))) return `Pick ${pick} card${pick > 1 ? 's' : ''}.`
      g.subs[k] = idx.map(i => hand[i])
      g.hands[k] = hand.filter((r, i) => !idx.includes(i))
      if (allIn(g)) toJudging(g)
      return null
    }
    if (a.type === 'pick') {
      if (g.phase !== 'judge') return 'Not time to judge.'
      if (k !== g.judge) return 'Only the judge picks.'
      const w = g.order[Number(a.index)]
      if (w === undefined) return 'Pick one of the answers.'
      award(g, w)
      return null
    }
    if (a.type === 'next') {
      if (g.phase !== 'reveal') return null
      if (k !== g.judge && seat.id !== g.hostId) return 'The judge moves on.'
      nextJudge(g)
      startRound(g)
      return null
    }
    if (a.type === 'swap') {
      if (seat.swapped) return 'You\'ve already swapped this game.'
      if (g.phase === 'submit' && g.subs[k]) return 'You\'ve already played this round.'
      if (g.phase === 'lobby' || g.phase === 'over') return null
      const old = g.hands[k] || []
      g.hands[k] = []
      deal(g, k)
      g.adeck = shuffle(g.adeck.concat(old))
      seat.swapped = true
      say(g, `${seat.name} swapped their whole hand.`)
      return null
    }
    return 'Unknown move.'
  }

  // ── Host: seats, timers, bots ──
  function hostSeats() {
    if (!isHost()) return
    let changed = false
    if (G.phase === 'lobby') {
      const seats = []
      const used = new Set()
      for (const p of players) {
        if (seats.length >= MAX_SEATS - G.bots) break
        let nm = String(p.name || 'Player').slice(0, 18)
        for (let n = 2; used.has(nm); n++) nm = `${String(p.name || 'Player').slice(0, 15)} ${n}`
        used.add(nm)
        seats.push({ id: p.id, name: nm })
      }
      for (let b = 0; b < G.bots; b++) seats.push({ id: `bot-${b}`, name: BOT_NAMES[b], bot: true })
      if (JSON.stringify(seats) !== JSON.stringify(G.seats)) { G.seats = seats; changed = true }
    } else {
      const here = new Set(players.map(p => p.id))
      G.seats.forEach((seat, k) => {
        if (seat.bot || seat.gone || here.has(seat.id)) return
        seat.gone = true
        say(G, `${seat.name} left. Their score is kept for when they're back.`)
        if (G.phase === 'submit' && allIn(G)) toJudging(G)
        changed = true
      })
      for (const p of players) {
        if (G.seats.some(x => x.id === p.id)) continue
        const back = G.seats.find(x => x.gone && !x.bot && x.name === p.name)
        if (back) {
          back.id = p.id
          back.gone = false
          say(G, `${back.name} is back.`)
          changed = true
          continue
        }
        if (G.seats.length >= MAX_SEATS || G.phase === 'over') continue
        // Late arrivals get a hand and play from the next round.
        const used = new Set(G.seats.map(x => x.name))
        let nm = String(p.name || 'Player').slice(0, 18)
        for (let n = 2; used.has(nm); n++) nm = `${String(p.name || 'Player').slice(0, 15)} ${n}`
        G.seats.push({ id: p.id, name: nm, score: 0, swapped: false })
        deal(G, G.seats.length - 1)
        say(G, `${nm} joined and plays from the next round.`)
        changed = true
      }
    }
    if (changed) change()
  }

  function change() {
    if (!G) return
    G.v++
    record(G)
    schedule()
    if (isHost()) publish()
    render()
  }

  function publish() {
    if (!room || !isHost()) return
    G.remain = deadline ? Math.max(0, deadline - Date.now()) : 0
    lastPublish = Date.now()
    room.send('state', { g: G })
  }

  // New phase: start its clock, and line up the bots' plays.
  function schedule() {
    if (!isHost() || !G) { deadline = 0; return }
    const key = `${G.gid}|${G.round}|${G.phase}`
    if (key === phaseKey) return
    phaseKey = key
    botAt = {}
    if (G.phase === 'submit') {
      deadline = Date.now() + SUBMIT_MS
      for (const k of G.need) if (G.seats[k].bot) botAt[k] = Date.now() + 1500 + Math.random() * 3500
    } else if (G.phase === 'judge') deadline = Date.now() + JUDGE_MS
    else if (G.phase === 'reveal') deadline = Date.now() + REVEAL_MS
    else deadline = 0
  }

  function onTick() {
    if (dead || !G) return
    if (isHost() && G.phase !== 'lobby') {
      let moved = false
      if (G.phase === 'submit') {
        for (const [k, at] of Object.entries(botAt)) {
          if (Date.now() < at || G.subs[k]) continue
          const pick = pickOf(G, G.prompt)
          const hand = G.hands[k] || []
          const idx = shuffle(hand.map((r, i) => i)).slice(0, pick)
          delete botAt[k]
          if (!act(G, Number(k), { type: 'submit', cards: idx })) moved = true
        }
        if (!moved && G.phase === 'submit' && deadline && Date.now() > deadline) {
          const missing = G.need.filter(k => !G.subs[k] && !G.seats[k].gone)
          if (missing.length) say(G, `Time's up: ${missing.map(k => seatName(G, k)).join(', ')} sat this one out.`)
          toJudging(G)
          moved = true
        }
      } else if (G.phase === 'judge') {
        const judgeGone = !G.seats[G.judge] || G.seats[G.judge].gone
        if ((deadline && Date.now() > deadline) || (judgeGone && deadline && Date.now() > deadline - JUDGE_MS + 3000)) {
          say(G, judgeGone ? 'The judge left, so the winner is picked at random.' : 'The judge ran out of time: picked at random.')
          award(G, G.order[rand(G.order.length)])
          moved = true
        }
      } else if (G.phase === 'reveal' && deadline && Date.now() > deadline) {
        nextJudge(G)
        startRound(G)
        moved = true
      }
      if (moved) { change(); return }
      if (room && Date.now() - lastPublish > BEAT_MS) publish()
    }
    renderClock()
  }

  // ── Moves from this page ──
  function move(a) {
    if (!G) return
    const k = mySeat()
    if (k < 0) return
    if (isHost()) {
      const err = act(G, k, a)
      notice = err || ''
      if (err) { render(); return }
      change()
    } else {
      sentAt = Date.now()
      sentV = G.v
      room.send('act', { a })
      render()
    }
  }
  const holding = () => !isHost() && G && sentV === G.v && Date.now() - sentAt < 3000

  // ── Online ──
  function connect(code, creating) {
    leaveRoom()
    G = null
    players = []
    notice = ''
    loading(creating ? 'Making a room…' : `Joining room ${code}…`)
    const r = partyRoom('punch', code, me, { name }, {
      presence: list => { if (room === r) onPresence(list) },
      message: (t, p) => { if (room === r) onMessage(t, p) },
      ready: () => {
        if (room !== r) return
        activity({ game: 'punch', code, label: 'Punchline', joinable: true })
        if (creating) {
          G = newGame(me)
          hostSeats()
          change()
          return
        }
        r.send('hello', {})
        waitTimer = setTimeout(() => {
          if (room !== r || G) return
          if (!players.length || players[0].id === me) {
            G = newGame(me)
            hostSeats()
            change()
          } else menu(`Nobody is hosting room ${code} right now.`)
        }, 4500)
      },
      error: text => { if (room === r) { leaveRoom(); menu(text) } },
    })
    room = r
  }

  function leaveRoom() {
    clearTimeout(waitTimer)
    if (room) { room.close(); room = null; activity(null) }
  }

  function onPresence(list) {
    players = list
    if (!G) return
    const here = new Set(list.map(p => p.id))
    if (!here.has(G.hostId) && list.length && list[0].id === me) {
      // The host left: the longest-present player carries on.
      G.hostId = me
      phaseKey = ''
      say(G, `${name} is hosting now.`)
      hostSeats()
      change()
      return
    }
    if (isHost()) hostSeats()
    render()
  }

  function onMessage(t, p) {
    if (t === 'state') {
      const g = p.g
      if (!g || g.hostId !== p.from) return
      if (G && G.gid === g.gid && g.v < G.v && G.hostId === g.hostId) return
      if (isHost() && G && g.hostId !== me && g.v <= G.v) return
      G = g
      shownDeadline = g.remain ? Date.now() + g.remain : 0
      record(G)
      render()
      return
    }
    if (!isHost()) return
    if (t === 'hello') { publish(); return }
    if (t === 'act') {
      const k = G.seats.findIndex(x => x.id === p.from && !x.bot)
      if (k < 0) return
      const err = act(G, k, p.a)
      if (!err) change()
      else publish()
    }
  }

  // ── Record ──
  function record(g) {
    if (!g || g.phase !== 'over') return
    const k = mySeat()
    if (k < 0) return
    let rec = { games: 0, wins: 0, done: [] }
    try { rec = Object.assign(rec, JSON.parse(localStorage.getItem(RECORD_KEY)) || {}) } catch (e) { /* private mode */ }
    if (rec.done.includes(g.gid)) return
    rec.done = rec.done.concat(g.gid).slice(-30)
    rec.games++
    if (g.winner === k) rec.wins++
    try { localStorage.setItem(RECORD_KEY, JSON.stringify(rec)) } catch (e) { /* private mode */ }
  }
  function readRecord() {
    try { return JSON.parse(localStorage.getItem(RECORD_KEY)) || null } catch (e) { return null }
  }

  // ── Screens ──
  function loading(t) {
    fill(wrap, el('div', { class: 'card stack pl-menu' }, el('p', { class: 'muted' }, t),
      el('button', { type: 'button', class: 'link', onClick: () => menu() }, '‹ Cancel')))
  }

  function menu(err) {
    leaveRoom()
    G = null
    customEl = null
    let draftName = name
    let draftCode = (opts && opts.code) || ''
    const nameInput = el('input', { value: draftName, maxlength: 18, placeholder: 'Your name', onInput: e => { draftName = e.target.value } })
    const okName = () => {
      const n = draftName.trim().slice(0, 18)
      if (!n) { nameInput.focus(); return false }
      name = n
      storeName(n)
      return true
    }
    const rec = readRecord()
    const online = partyCanOnline()
    fill(wrap, el('div', { class: 'card stack pl-menu' },
      el('div', null, el('p', { class: 'wordmark' }, 'Punchline'), el('p', { class: 'tagline' }, 'Fill in the blank, win the room')),
      err && el('p', { class: 'error' }, err),
      el('label', { class: 'field' }, el('span', null, 'Your name'), nameInput),
      online
        ? [
          el('button', { type: 'button', class: 'primary', onClick: () => { if (okName()) connect(partyCode(), true) } }, 'Make a room'),
          el('form', { class: 'row', onSubmit: e => {
            e.preventDefault()
            const c = partyCleanCode(draftCode)
            if (c && okName()) connect(c, false)
          } },
            el('input', { class: 'grow', value: draftCode, maxlength: 8, placeholder: 'Room code', onInput: e => { draftCode = e.target.value } }),
            el('button', { type: 'submit' }, 'Join')),
        ]
        : el('p', { class: 'muted small' }, 'Punchline plays over Supabase, like watch together (DEBROD → Settings).'),
      rec && rec.games > 0 && el('p', { class: 'muted small' }, `Your record: ${rec.wins} won of ${rec.games} game${rec.games === 1 ? '' : 's'}.`),
      el('p', { class: 'muted small' }, 'Each round one player judges. Everyone else plays the funniest answer from their hand for the prompt; the judge picks a favourite without knowing whose it is. 3 to 10 players, and House bots can fill in.')))
    if (opts && opts.code && name && online && !err) {
      const c = partyCleanCode(opts.code)
      opts = Object.assign({}, opts, { code: '' })
      if (c) return connect(c, false)
    }
    if (!draftName) nameInput.focus()
  }

  // The packs, as chips: tap to put one in or take it out.
  function packChips(g, editable) {
    const list = packList(g)
    return el('div', { class: 'pl-packs' }, list.map(p => {
      const on = (g.packs || []).includes(p.id)
      return el(editable ? 'button' : 'span', Object.assign({
        class: `pl-packchip ${on ? 'on' : ''} ${p.id}`,
        title: `${p.name}: ${p.note}`,
      }, editable ? { type: 'button', 'aria-pressed': on ? 'true' : 'false', onClick: () => { if (p.id === 'custom') G.custom = customEl.value; setPack(G, p.id, !on); change() } } : {}),
        el('strong', null, `${on ? '✓ ' : ''}${p.name}`),
        el('span', { class: 'small' }, `${p.note} · ${p.prompts.length} prompts · ${p.answers.length} answers`))
    }))
  }

  function lobby() {
    const hostHere = isHost()
    const k = mySeat()
    const watchers = players.filter(p => !G.seats.some(x => x.id === p.id))
    const hostName = (players.find(p => p.id === G.hostId) || {}).name || 'the host'
    if (!customEl || customRoom !== G.gid) {
      customRoom = G.gid
      customEl = el('textarea', { placeholder: 'One card per line. Lines with ____ (or ending in ?) are prompts:\nThe thing I miss most about summer is ____.\nAn answer about your friend group\'s inside joke.', maxlength: 20000 })
      customEl.value = G.custom || ''
      customEl.addEventListener('change', () => { if (isHost()) { G.custom = customEl.value; change() } })
    }
    if (document.activeElement !== customEl) customEl.value = G.custom || ''
    customEl.disabled = !hostHere
    const parsed = parseCustom(G.custom)
    const problem = startProblem(Object.assign({}, G, parsed))
    const hasCah = (G.packs || []).includes('cah')
    fill(wrap, el('div', { class: 'card stack pl-menu pl-lobby' },
      el('div', null, el('p', { class: 'wordmark' }, 'Punchline'), el('p', { class: 'tagline' }, 'Room')),
      el('p', { class: 'pl-code' }, room ? room.code : ''),
      el('button', { type: 'button', onClick: async () => { ctx.toast(await partyInvite('punch', room.code, 'Punchline')) } }, 'Invite friends'),
      el('div', { class: 'pl-seats' }, G.seats.map(seat => el('div', { class: 'pl-seat' },
        el('span', { class: 'grow truncate' }, seat.bot ? '🤖 ' : '', seat.name, seat.id === me ? ' (you)' : '', seat.id === G.hostId ? ' 👑' : ''),
        hostHere && seat.bot && el('button', { type: 'button', class: 'chip', title: 'Remove this bot', onClick: () => { G.bots = Math.max(0, G.bots - 1); hostSeats(); render() } }, '✕')))),
      watchers.length > 0 && el('p', { class: 'muted small' }, `Watching: ${watchers.map(p => p.name).join(', ')}`),
      k < 0 && el('p', { class: 'muted small' }, 'The table is full, so you\'re watching.'),
      el('div', { class: 'field' }, el('span', null, hostHere ? 'Packs (tap to pick)' : 'Packs'), packChips(G, hostHere)),
      hasCah && el('p', { class: 'muted small pl-credit' }, CAH_CREDIT),
      hostHere
        ? [
          el('label', { class: 'field' }, el('span', null, 'Custom cards (pick the Custom pack to use them)'), customEl),
          el('div', { class: 'row' },
            el('button', { type: 'button', disabled: G.bots >= MAX_BOTS || G.seats.length >= MAX_SEATS, onClick: () => { G.bots++; hostSeats(); render() } }, '+ Add a House bot'),
            (() => {
              const sel = el('select', { 'aria-label': 'Points to win', onChange: e => { G.target = Number(e.target.value); change() } }, [5, 7, 10].map(n => el('option', { value: n }, `First to ${n}`)))
              sel.value = String(G.target)
              return sel
            })()),
          problem && el('p', { class: 'muted small' }, problem),
          notice && el('p', { class: 'error' }, notice),
          el('button', { type: 'button', class: 'primary', disabled: !!problem, onClick: () => {
            G.custom = customEl.value
            const err = startGame(G)
            notice = err || ''
            if (err) render()
            else change()
          } }, problem ? 'Not ready yet' : `Start with ${G.seats.length}`),
        ]
        : [
          el('p', { class: 'muted small' }, `First to ${G.target}`),
          el('p', { class: 'muted' }, `Waiting for ${hostName} to start…`),
        ],
      el('button', { type: 'button', class: 'link', onClick: () => menu() }, '‹ Leave')))
  }

  let clockEl = null
  function renderClock() {
    if (!clockEl || !G) return
    const end = isHost() ? deadline : shownDeadline
    if (!end || !['submit', 'judge'].includes(G.phase)) { clockEl.textContent = ''; return }
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000))
    clockEl.textContent = `⏱ ${left}s`
    clockEl.classList.toggle('hurry', left <= 10)
  }

  // Scores are milk cartons; the judge wears the hairnet.
  function scores() {
    return el('div', { class: 'pl-scores' }, G.seats.map((x, k) => {
      const judge = k === G.judge && G.phase !== 'over'
      return el('div', {
        class: `pl-carton ${judge ? 'judge' : ''} ${x.id === me ? 'me' : ''} ${x.gone ? 'gone' : ''}`,
        title: `${x.name}: ${x.score || 0} point${x.score === 1 ? '' : 's'}${judge ? ' (judging)' : ''}${x.gone ? ' (away)' : ''}`,
      },
        el('span', { class: 'pl-carton-n' }, String(x.score || 0)),
        el('span', { class: 'pl-carton-name truncate' }, x.bot ? '🤖 ' : '', x.name),
        judge && el('span', { class: 'pl-hairnet' }, '👩‍🍳 judge'),
        G.phase === 'submit' && G.subs[k] && el('span', { class: 'pl-tick', title: 'Played' }, '✓'))
    }))
  }

  // The prompt, chalked on the menu board.
  function promptCard(answers) {
    const pick = pickOf(G, G.prompt)
    return el('div', { class: 'pl-board' },
      el('p', { class: 'pl-board-head' }, '★ Today\'s special ★'),
      el('div', { class: 'pl-black big' }, sentence(G, G.prompt, answers)),
      el('div', { class: 'pl-board-foot' }, corner(packName(G, G.prompt)), pick > 1 && el('span', { class: 'pl-pick' }, `Pick ${pick}`)))
  }
  // A filled-in prompt, as a little chalkboard (judging and the reveal).
  function slate(j, opts = {}) {
    return el(opts.button ? 'button' : 'div', Object.assign({ class: `pl-black pl-sub ${opts.win ? 'win' : ''}` }, opts.button || {}),
      sentence(G, G.prompt, G.subs[j]),
      opts.who && el('span', { class: 'pl-who' }, opts.who))
  }

  function table() {
    const k = mySeat()
    const judging = k === G.judge
    const hold = holding()
    const pick = pickOf(G, G.prompt)
    const hand = k >= 0 ? G.hands[k] || [] : []
    const key = `${G.gid}|${G.round}|${G.phase}|${hand.join(',')}`
    if (key !== chosenKey) { chosenKey = key; chosen = [] }
    clockEl = el('span', { class: 'pl-timer' })
    const judgeName = seatName(G, G.judge)
    const parts = []
    if (G.phase === 'submit') {
      const played = G.need.filter(j => G.subs[j]).length
      const total = G.need.filter(j => !G.seats[j].gone).length
      const mine = k >= 0 && G.subs[k]
      const canPlay = k >= 0 && !judging && G.need.includes(k) && !mine
      parts.push(el('p', { class: `pl-status ${canPlay ? 'mine' : ''}` },
        judging ? `You're judging · ${played}/${total} played` : mine ? `Played · waiting for the others (${played}/${total})` : canPlay ? `Pick ${pick} card${pick > 1 ? 's' : ''}${pick > 1 ? ', in order' : ''}` : k >= 0 && !G.need.includes(k) ? 'You\'re in from the next round' : `${played}/${total} played · ${judgeName} judges`,
        clockEl))
      parts.push(promptCard(mine ? G.subs[k] : canPlay ? chosen.map(i => hand[i]) : null))
      if (k >= 0 && !judging) {
        parts.push(el('div', { class: 'pl-tray' }, el('div', { class: 'pl-hand' }, hand.map((r, i) => {
          const at = chosen.indexOf(i)
          return el('button', {
            type: 'button', class: `pl-white ${at >= 0 ? 'picked' : ''}`, disabled: !canPlay || hold,
            onClick: () => {
              if (at >= 0) chosen.splice(at, 1)
              else if (chosen.length < pick) chosen.push(i)
              else if (pick === 1) chosen = [i]
              render()
            },
          }, el('span', { class: 'pl-white-text' }, rich(text(G, r))), corner(packName(G, r)), at >= 0 && pick > 1 && el('span', { class: 'pl-order' }, String(at + 1)))
        }))))
        parts.push(el('div', { class: 'pl-bar' },
          canPlay && el('button', { type: 'button', class: 'primary', disabled: chosen.length !== pick || hold, onClick: () => { move({ type: 'submit', cards: chosen.slice() }) } }, chosen.length === pick ? 'Play it' : `Pick ${pick - chosen.length} more`),
          k >= 0 && !G.seats[k].swapped && !mine && el('button', { type: 'button', disabled: hold, title: 'Once per game: throw your whole hand back for ten new cards', onClick: () => { if (confirm('Swap your whole hand for ten new cards? You can do this once per game.')) move({ type: 'swap' }) } }, '↻ Swap hand (once)')))
      } else if (judging) {
        parts.push(el('p', { class: 'pl-note' }, 'You\'re on lunch duty. The answers show up here once everyone has played.'))
      }
    } else if (G.phase === 'judge') {
      parts.push(el('p', { class: `pl-status ${judging ? 'mine' : ''}` }, judging ? 'Pick the funniest' : `${judgeName} is picking a favourite`, clockEl))
      parts.push(promptCard(null))
      parts.push(el('div', { class: 'pl-subs' }, G.order.map((j, i) => slate(j, { button: { type: 'button', disabled: !judging || hold, onClick: () => move({ type: 'pick', index: i }) } }))))
    } else if (G.phase === 'reveal' || G.phase === 'over') {
      const over = G.phase === 'over'
      const who = over ? G.winner : G.win
      parts.push(el('div', { class: 'pl-ribbon' },
        el('span', { class: 'pl-ribbon-rosette', 'aria-hidden': 'true' }, '🏅'),
        el('div', null,
          el('p', { class: 'pl-ribbon-title' }, over ? 'Student of the Week' : 'Round winner'),
          el('p', { class: 'pl-ribbon-name' }, `${seatName(G, who)}${over ? ' wins the game!' : ''}`),
          over && el('p', { class: 'small' }, `First to ${G.target}. GG.`))))
      if (G.subs[G.win]) parts.push(slate(G.win, { win: true, who: seatName(G, G.win) }))
      parts.push(el('div', { class: 'pl-subs' }, G.order.filter(j => j !== G.win).map(j => slate(j, { who: seatName(G, j) }))))
      parts.push(el('div', { class: 'pl-bar' },
        !over && (judging || isHost()) && el('button', { type: 'button', class: 'primary', disabled: hold, onClick: () => move({ type: 'next' }) }, 'Next round'),
        !over && !(judging || isHost()) && el('p', { class: 'pl-note' }, 'Next round in a few seconds…'),
        over && isHost() && el('button', { type: 'button', class: 'primary', onClick: () => { G = newGame(me, G); hostSeats(); change() } }, 'Play again'),
        over && !isHost() && el('p', { class: 'pl-note' }, 'The host can start another game.')))
    }
    const spicyOn = (G.packs || []).includes('spicy')
    fill(wrap,
      el('div', { class: 'pl-top' },
        el('span', { class: 'pill' }, `Round ${G.round}`),
        el('span', { class: 'pill' }, `First to ${G.target}`),
        isHost()
          ? el('button', { type: 'button', class: `chip ${spicyOn ? 'on' : ''}`, title: 'Spicy pack (crude humour, blurred swearing): new draws only', onClick: () => { setPack(G, 'spicy', !spicyOn); change() } }, spicyOn ? '🌶️ Spicy on' : '🌶️ Spicy off')
          : spicyOn && el('span', { class: 'pill' }, '🌶️ Spicy'),
        el('span', { class: 'grow' }),
        room && el('button', { type: 'button', class: 'chip', onClick: async () => { ctx.toast(await partyInvite('punch', room.code, 'Punchline')) } }, `Room ${room.code} · Invite`),
        el('button', { type: 'button', class: 'link', onClick: () => menu() }, 'Leave')),
      el('div', { class: 'pl-table' },
        el('div', { class: 'pl-formica' },
          scores(),
          parts,
          notice && el('p', { class: 'error', style: 'text-align:center' }, notice),
          el('p', { class: 'pl-log' }, (G.log || []).slice(-2).join('  ·  ')),
          (G.packs || []).includes('cah') && el('p', { class: 'pl-credit' }, CAH_CREDIT))))
    renderClock()
  }

  function render() {
    if (dead) return
    if (!G) return
    if (G.phase === 'lobby') return lobby()
    table()
  }

  menu()
  return {
    stop() {
      dead = true
      clearInterval(tick)
      leaveRoom()
    },
  }
}

</script>
