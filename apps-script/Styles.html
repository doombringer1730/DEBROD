<style>
:root { --font-display: 'Orbitron'; --font-body: 'Chakra Petch'; --font-mono: 'Share Tech Mono'; }
/* Retro-futurism: an 80s vision of the future. Night-sky indigo, a striped
   sunset sun over a neon grid, chrome type, CRT scanlines. */
:root {
  --bg: #0d0221;
  --bg-2: #1a0b3d;
  --panel: rgba(22, 9, 52, 0.78);
  --panel-solid: #160934;
  --line: rgba(0, 240, 255, 0.28);
  --line-strong: #00f0ff;
  --text: #f6edff;
  --muted: #a99bd1;
  --cyan: #00f0ff;
  --magenta: #ff2bd6;
  --orange: #ff7a1a;
  --yellow: #ffd319;
  --good: #3dffa8;
  --bad: #ff4d6d;
  --sunset: linear-gradient(180deg, var(--yellow) 0%, var(--orange) 45%, var(--magenta) 100%);
  --button: linear-gradient(90deg, var(--magenta), var(--orange));
  --glow-cyan: 0 0 12px rgba(0, 240, 255, 0.45);
  --glow-magenta: 0 0 18px rgba(255, 43, 214, 0.5);
  --radius: 4px;
  --display: var(--font-display), 'Orbitron', system-ui, sans-serif;
  --body: var(--font-body), system-ui, sans-serif;
  --mono-font: var(--font-mono), ui-monospace, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* The sky lives on <html> so the fixed backdrop (z-index -1) sits above it. */
html { background: radial-gradient(120% 70% at 50% 0%, var(--bg-2) 0%, var(--bg) 60%) fixed, var(--bg); }
body {
  margin: 0;
  color: var(--text);
  font: 15px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}
/* CRT scanlines over everything */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
h1 { margin: 0; }
p { margin: 0; }
img { display: block; }
::selection { background: var(--magenta); color: #fff; }

/* ── Backdrop: sun + horizon + grid ───────────────────────────────────── */
.backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.sky { position: absolute; left: 0; right: 0; top: 0; bottom: 34%; overflow: hidden; }
.sun {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: min(62vw, 440px);
  aspect-ratio: 1;
  transform: translate(-50%, 28%); /* sinking: the horizon cuts its lower part */
  border-radius: 50%;
  background: var(--sunset);
  box-shadow: 0 0 80px rgba(255, 43, 214, 0.45), 0 0 160px rgba(255, 122, 26, 0.25);
  /* the classic slats, widening as it sets */
  -webkit-mask: linear-gradient(180deg,
    #000 0 46%, transparent 46% 48%, #000 48% 54%, transparent 54% 57%,
    #000 57% 62%, transparent 62% 66%, #000 66% 70%, transparent 70% 75%, #000 75%);
  mask: linear-gradient(180deg,
    #000 0 46%, transparent 46% 48%, #000 48% 54%, transparent 54% 57%,
    #000 57% 62%, transparent 62% 66%, #000 66% 70%, transparent 70% 75%, #000 75%);
  opacity: 0.9;
}
.horizon {
  position: absolute;
  left: 0; right: 0; bottom: 34%;
  height: 2px;
  background: var(--magenta);
  box-shadow: 0 0 14px 2px var(--magenta);
}
.floor {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 34%;
  overflow: hidden;
  perspective: 220px;
  perspective-origin: 50% 0%;
  background: linear-gradient(180deg, rgba(255, 43, 214, 0.18), rgba(13, 2, 33, 0.6) 60%);
}
.grid-lines {
  position: absolute;
  left: -100%; right: -100%; top: 0;
  height: 300%;
  transform-origin: 50% 0%;
  transform: rotateX(72deg);
  background-image:
    linear-gradient(90deg, rgba(255, 43, 214, 0.7) 2px, transparent 2px),
    linear-gradient(0deg, rgba(255, 43, 214, 0.7) 2px, transparent 2px);
  background-size: 64px 64px;
  animation: grid-scroll 2.4s linear infinite;
}
@keyframes grid-scroll { to { background-position: 0 64px; } }

/* ── Type ─────────────────────────────────────────────────────────────── */
.wordmark {
  font: 900 26px/1 var(--display);
  letter-spacing: 0.14em;
  background: linear-gradient(180deg, #fff 0%, #cfe9ff 38%, #6d5bd0 50%, #ffe5ff 62%, #ff9be9 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 8px rgba(255, 43, 214, 0.55));
}
.wordmark.big { font-size: 38px; text-align: center; }
.tagline {
  font: 400 11px/1.4 var(--mono-font);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
  margin-top: 6px;
}
.card .tagline { text-align: center; }
.name { font-weight: 600; letter-spacing: 0.02em; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono-font); font-size: 13px; margin-right: 8px; color: var(--cyan); }
.error { color: var(--bad); font: 14px var(--mono-font); text-shadow: 0 0 8px rgba(255, 77, 109, 0.5); }
.error::before { content: '⚠ '; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Controls ─────────────────────────────────────────────────────────── */
button, input, .actions a {
  font: inherit;
  color: inherit;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: rgba(13, 2, 33, 0.7);
  padding: 8px 12px;
  text-decoration: none;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s, color 0.15s;
}
button:disabled { opacity: 0.45; cursor: default; }
button:hover:not(:disabled), .actions a:hover { border-color: var(--cyan); box-shadow: var(--glow-cyan); color: #fff; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
input {
  width: 100%;
  padding: 12px 14px;
  font-family: var(--mono-font);
  font-size: 16px;
  caret-color: var(--magenta);
  cursor: text;
}
input::placeholder { color: rgba(169, 155, 209, 0.6); }
input:focus { outline: none; border-color: var(--magenta); box-shadow: var(--glow-magenta); }
.primary {
  background: var(--button);
  border: none;
  color: #1a0420;
  font: 700 13px/1 var(--display);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 12px 18px;
  box-shadow: var(--glow-magenta);
}
.primary:hover:not(:disabled) { color: #1a0420; transform: translateY(-1px); box-shadow: 0 0 26px rgba(255, 43, 214, 0.75); }
.link { background: none; border: none; padding: 0; color: var(--muted); font: 12px var(--mono-font); letter-spacing: 0.2em; text-transform: uppercase; }
.link:hover:not(:disabled) { color: var(--cyan); box-shadow: none; text-shadow: var(--glow-cyan); }
a { color: var(--cyan); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font: 11px var(--mono-font); letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }

/* ── Layout ───────────────────────────────────────────────────────────── */
.page { max-width: 920px; margin: 0 auto; padding: 22px 16px 120px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.login { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
.card {
  position: relative;
  background: var(--panel);
  backdrop-filter: blur(6px);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 28px 24px;
  width: min(360px, 100%);
  box-shadow: 0 0 0 1px rgba(255, 43, 214, 0.15), 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
.card::before {
  content: '';
  position: absolute;
  left: 18px; right: 18px; top: -1px;
  height: 2px;
  background: var(--button);
  box-shadow: var(--glow-magenta);
}
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack.tight { gap: 8px; }
.row { display: flex; gap: 8px; }
.back { align-self: flex-start; }

/* Movies / TV switch */
.toggle { display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.toggle button {
  flex: 1;
  border: none;
  background: none;
  color: var(--muted);
  font: 700 12px/1 var(--display);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 11px 8px;
}
.toggle button.on { background: var(--button); color: #1a0420; box-shadow: var(--glow-magenta); }
.toggle button:hover:not(.on) { box-shadow: none; color: var(--cyan); }

/* Poster grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 16px; }
.poster { display: flex; flex-direction: column; gap: 5px; padding: 0; border: none; background: none; text-align: left; }
.poster:hover:not(:disabled) { box-shadow: none; transform: translateY(-3px); }
.poster img, .noposter {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  border-radius: 6px;
  background: var(--panel-solid);
  border: 1px solid var(--line);
  transition: box-shadow 0.15s, border-color 0.15s;
}
.poster:hover img, .poster:hover .noposter { border-color: var(--magenta); box-shadow: var(--glow-magenta); }
.noposter { display: grid; place-items: center; padding: 10px; text-align: center; color: var(--muted); font: 13px var(--mono-font); }
.poster .name { font-size: 13px; line-height: 1.25; text-shadow: 0 1px 3px #000, 0 0 8px rgba(13, 2, 33, 0.9); }
.poster .muted { font: 12px var(--mono-font); color: var(--cyan); }

.heading { display: flex; gap: 14px; align-items: center; }
.heading img { width: 48px; height: 72px; object-fit: cover; border-radius: 4px; border: 1px solid var(--magenta); box-shadow: var(--glow-magenta); }
.heading .name { font: 700 16px/1.3 var(--display); letter-spacing: 0.06em; }
.heading .muted { font-family: var(--mono-font); color: var(--cyan); }

.item { text-align: left; padding: 12px 14px; background: var(--panel); }
.spread { display: flex; justify-content: space-between; gap: 10px; }
.spread .muted { font-family: var(--mono-font); }

.chip { align-self: flex-start; font: 12px var(--mono-font); letter-spacing: 0.08em; padding: 6px 12px; color: var(--muted); }
.chip.on { border-color: var(--good); color: var(--good); box-shadow: 0 0 10px rgba(61, 255, 168, 0.35); }

/* Stream rows */
.stream {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--magenta);
  border-radius: 6px;
  padding: 11px 12px;
}
.stream .info { min-width: 0; flex: 1; }
.stream .info p:first-child { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stream strong { font: 700 13px var(--display); letter-spacing: 0.08em; }
.stream .muted { font-family: var(--mono-font); }
.tag { font: 11px var(--mono-font); padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--cyan); text-transform: uppercase; letter-spacing: 0.06em; }
.tag.good { color: var(--good); border-color: rgba(61, 255, 168, 0.5); }
.tag.bad { color: var(--bad); border-color: rgba(255, 77, 109, 0.5); }
.actions { display: flex; gap: 6px; flex-shrink: 0; }
.actions button, .actions a { font: 12px var(--mono-font); letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 10px; }
.actions .together { background: var(--button); border: none; color: #1a0420; font-weight: 700; box-shadow: var(--glow-magenta); }
.actions .together:hover:not(:disabled) { color: #1a0420; }

.player video { width: 100%; max-height: 70dvh; background: #000; border-radius: 6px; border: 1px solid var(--magenta); box-shadow: var(--glow-magenta); }
.player p { margin-top: 6px; }

@media (max-width: 560px) {
  .stream { flex-direction: column; align-items: stretch; }
  .actions { flex-wrap: wrap; }
  .actions > * { flex: 1; text-align: center; }
  .actions .together { flex-basis: 100%; }
  .wordmark { font-size: 22px; }
}

/* ── Watch together ───────────────────────────────────────────────────── */
.room { height: 100dvh; display: flex; flex-direction: column; background: #000; }
.room-top, .room-bottom { background: rgba(13, 2, 33, 0.96); border-color: var(--line); border-style: solid; border-width: 0; }
.room-top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom-width: 1px; box-shadow: 0 1px 0 rgba(255, 43, 214, 0.35); }
.room-top .link { font-size: 22px; line-height: 1; letter-spacing: 0; }
.room-top .name { flex: 1; min-width: 0; font: 700 14px var(--display); letter-spacing: 0.08em; }
.viewers { display: flex; gap: 6px; overflow-x: auto; max-width: 45%; }
.viewer { display: inline-flex; align-items: center; gap: 5px; font: 12px var(--mono-font); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 6px var(--good); display: inline-block; }
.dot.wait { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
.invite { font: 700 11px var(--display); letter-spacing: 0.14em; text-transform: uppercase; padding: 8px 12px; flex-shrink: 0; border-color: var(--magenta); color: var(--magenta); }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; background: rgba(13, 2, 33, 0.9); text-align: center; padding: 16px; border: none; border-radius: 0; z-index: 3; font-family: var(--mono-font); }
.overlay.tap { background: rgba(0, 0, 0, 0.55); }
.overlay.tap:hover { box-shadow: none; }
.overlay.tap .primary { padding: 16px 24px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono-font); color: var(--muted); background: rgba(13, 2, 33, 0.7); border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px; }
.pill .mono { color: var(--cyan); margin: 0; }
.sync-status { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; z-index: 2; }
.fallback { position: absolute; top: 10px; left: 10px; max-width: calc(100% - 180px); color: var(--yellow); z-index: 2; }

.chat-overlay { position: absolute; left: 12px; right: 12px; bottom: 64px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; z-index: 2; }
.chat-line { background: rgba(13, 2, 33, 0.75); backdrop-filter: blur(4px); border-left: 2px solid var(--magenta); border-radius: 3px; padding: 5px 10px; max-width: min(320px, 85%); font-size: 14px; animation: chat-in 0.2s ease-out; }
.chat-line strong { color: var(--cyan); font: 12px var(--mono-font); margin-right: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
.emote-float { position: absolute; bottom: 70px; font-size: 36px; pointer-events: none; user-select: none; animation: float-up 3.2s ease-out forwards; z-index: 2; filter: drop-shadow(0 0 8px rgba(255, 43, 214, 0.7)); }
@keyframes float-up { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-260px); opacity: 0; } }
@keyframes chat-in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

.room-bottom { border-top-width: 1px; padding: 6px 16px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.emotes { display: flex; justify-content: center; gap: 2px; margin-bottom: 6px; }
.emotes button { border: none; background: none; font-size: 20px; padding: 4px 6px; }
.emotes button:hover:not(:disabled) { transform: scale(1.2); box-shadow: none; }

@media (prefers-reduced-motion: reduce) {
  .grid-lines, .emote-float, .chat-line { animation: none; }
  * { transition: none !important; }
}

/* Your own chip in the room header doubles as the rename button. */
.viewer.me { border-color: var(--magenta); color: var(--text); cursor: pointer; font: 12px var(--mono-font); background: none; }
.viewer.me:hover:not(:disabled) { box-shadow: var(--glow-magenta); }
.rename { z-index: 4; }
.rename .card { text-align: left; }
.grow { flex: 1; }

/* ── Arcade ───────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.tabs .on { color: var(--cyan); text-shadow: var(--glow-cyan); }
.arcade-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.arcade-top .row { align-items: center; flex-wrap: wrap; }
.arcade-top .back { align-self: center; }
.arcade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.game-card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 18px 16px; background: var(--panel); border-left: 3px solid var(--magenta); }
.game-card:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--magenta); box-shadow: var(--glow-magenta); }
.game-icon { font-size: 34px; line-height: 1; filter: drop-shadow(0 0 8px rgba(255, 43, 214, 0.6)); }
.game-card .mono { margin: 0; }
.game-stage { position: relative; align-self: center; width: min(100%, 440px); touch-action: none; user-select: none; -webkit-user-select: none; }
.game-canvas { display: block; width: 100%; height: auto; border: 1px solid var(--magenta); border-radius: 6px; box-shadow: var(--glow-magenta); background: var(--bg); }
.game-end { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(13, 2, 33, 0.6); border-radius: 6px; z-index: 2; }
.game-end[hidden] { display: none; }
.game-end .card { text-align: center; }
.game-end .wordmark { font-size: 22px; }
.game-toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: var(--yellow); z-index: 1; white-space: nowrap; }
.game-toast[hidden] { display: none; }
.game-hint { text-align: center; text-shadow: 0 1px 3px #000, 0 0 8px var(--bg); }

.g2048 { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 8px; aspect-ratio: 1; background: var(--panel-solid); border: 1px solid var(--magenta); border-radius: 6px; box-shadow: var(--glow-magenta); }
.g2048 .tile { display: grid; place-items: center; border-radius: 4px; background: rgba(0, 240, 255, 0.06); color: #1a0420; font: 700 clamp(16px, 6vw, 28px) var(--display); transition: background 0.1s; }
.tile[data-v="2"] { background: #2b1a5e; color: var(--text); }
.tile[data-v="4"] { background: #3d2580; color: var(--text); }
.tile[data-v="8"] { background: var(--cyan); }
.tile[data-v="16"] { background: var(--good); }
.tile[data-v="32"] { background: var(--yellow); }
.tile[data-v="64"] { background: var(--orange); }
.tile[data-v="128"] { background: var(--magenta); box-shadow: var(--glow-magenta); }
.tile[data-v="256"] { background: #c21fff; box-shadow: 0 0 14px rgba(194, 31, 255, 0.6); }
.tile[data-v="512"] { background: #7b5cff; box-shadow: 0 0 14px rgba(123, 92, 255, 0.6); }
.tile[data-v="1024"] { background: linear-gradient(180deg, var(--yellow), var(--orange)); box-shadow: 0 0 18px rgba(255, 122, 26, 0.6); }
.tile[data-v="2048"] { background: var(--sunset); box-shadow: 0 0 22px rgba(255, 43, 214, 0.8); }
.tile[data-v="4096"] { background: #fff; box-shadow: 0 0 22px rgba(255, 255, 255, 0.7); }
.tile[data-v="1024"], .tile[data-v="2048"], .tile[data-v="4096"] { font-size: clamp(13px, 4.5vw, 22px); }

.game-mines { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.game-mines .chip { align-self: center; }
.mines { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; width: 100%; padding: 6px; background: var(--panel-solid); border: 1px solid var(--magenta); border-radius: 6px; box-shadow: var(--glow-magenta); }
.mines .cell { aspect-ratio: 1; padding: 0; display: grid; place-items: center; background: linear-gradient(180deg, rgba(0, 240, 255, 0.32), rgba(0, 240, 255, 0.14)); border-color: rgba(0, 240, 255, 0.5); font: 700 clamp(12px, 3.6vw, 18px) var(--display); }
.mines .cell.open { background: rgba(13, 2, 33, 0.9); border-color: rgba(0, 240, 255, 0.1); cursor: default; }
.mines .cell.open:hover { box-shadow: none; border-color: rgba(0, 240, 255, 0.1); }
.mines .cell.blown { background: var(--bad); }

.memory { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; aspect-ratio: 1; padding: 8px; background: var(--panel-solid); border: 1px solid var(--magenta); border-radius: 6px; box-shadow: var(--glow-magenta); }
.memory .flip { padding: 0; display: grid; place-items: center; font-size: clamp(22px, 7vw, 38px); background: var(--button); border: none; box-shadow: var(--glow-magenta); }
.memory .flip.up { background: var(--bg); border: 1px solid var(--cyan); box-shadow: var(--glow-cyan); cursor: default; }
.memory .flip.done { opacity: 0.45; box-shadow: none; }
.memory .flip:hover:not(:disabled) { transform: translateY(-2px); }

.game-tictactoe { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.ttt { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; width: 100%; aspect-ratio: 1; padding: 8px; background: var(--panel-solid); border: 1px solid var(--magenta); border-radius: 6px; box-shadow: var(--glow-magenta); }
.ttt button { padding: 0; display: grid; place-items: center; font: 900 clamp(36px, 12vw, 64px) var(--display); background: var(--bg); }
.ttt .x { color: var(--cyan); text-shadow: var(--glow-cyan); }
.ttt .o { color: var(--magenta); text-shadow: var(--glow-magenta); }

.game-stage:has(.game-doom), .game-stage:has(.game-sling) { width: min(100%, 820px); }
.game-stage:has(.game-scribble) { width: 100%; touch-action: auto; user-select: auto; -webkit-user-select: auto; }
.page:has(.game-scribble .sc-board) { max-width: 1480px; }
.game-stage:has(.game-showdown) { width: 100%; touch-action: auto; user-select: auto; -webkit-user-select: auto; }
.page:has(.game-showdown .pk-main), .page:has(.game-showdown .pk-builder), .page:has(.game-showdown .pk-draft) { max-width: 1280px; }

/* ── Pokémon Showdown ─────────────────────────────────────────────────── */
.pk { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
.pk-menu { margin: 0 auto; grid-column: 1 / -1; text-align: left; width: min(440px, 100%); }
.pk-menu .wordmark, .pk-menu .tagline { text-align: center; }
.pk-menu select, .pk-team-meta select, .pk-slot select, .pk-speed { font: inherit; color: inherit; background: rgba(13, 2, 33, 0.7); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; width: 100%; }
.pk-menu .row select { flex: 1; }
.pk-menu-buttons { flex-wrap: wrap; }
.pk-menu-links { justify-content: space-between; align-items: center; flex-wrap: wrap; }
.pk-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.pk-check input { width: auto; }
.pk-code { font: 900 34px var(--display); letter-spacing: 0.2em; color: var(--yellow); text-shadow: 0 0 12px rgba(255, 211, 25, 0.5); text-align: center; }
.pk-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pk-side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pk-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pk-bar .chip { align-self: center; }
.pk-bar .pk-speed { width: auto; padding: 5px 8px; font-size: 12px; }
.pk-format { font: 700 12px var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan); }
.pk-hurry { color: var(--bad); border-color: var(--bad); }
.pk-forfeit { color: var(--bad); }
.pk-field { position: relative; aspect-ratio: 16 / 9; border: 1px solid var(--magenta); border-radius: 8px; box-shadow: var(--glow-magenta); overflow: hidden;
  background:
    radial-gradient(ellipse 22% 9% at 74% 50%, rgba(0, 240, 255, 0.35), transparent 70%),
    radial-gradient(ellipse 26% 10% at 27% 88%, rgba(255, 43, 214, 0.4), transparent 70%),
    linear-gradient(180deg, #1a0b3d 0%, #2b0f57 52%, #3a1162 52.3%, #160934 100%); }
.pk-sprite { position: absolute; image-rendering: pixelated; transition: opacity 0.4s, filter 0.4s; pointer-events: none; }
.pk-sprite[hidden] { display: none; }
.pk-sprite.foe { right: 16%; top: 14%; height: 40%; }
.pk-sprite.me { left: 12%; bottom: 4%; height: 50%; }
.pk-field.doubles .pk-sprite.foe.slot0 { right: 30%; top: 13%; height: 34%; }
.pk-field.doubles .pk-sprite.foe.slot1 { right: 7%; top: 19%; height: 34%; }
.pk-field.doubles .pk-sprite.me.slot0 { left: 5%; bottom: 3%; height: 44%; }
.pk-field.doubles .pk-sprite.me.slot1 { left: 30%; bottom: 6%; height: 44%; }
.pk-sprite.fainted { opacity: 0.15; filter: grayscale(1); }
.pk-sprite.hit { animation: pk-hit 0.45s; }
.pk-sprite.enter { animation: pk-enter 0.45s ease-out; }
@keyframes pk-hit { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); filter: brightness(2.2); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); filter: brightness(1.6); } 80% { transform: translateX(3px); } }
@keyframes pk-enter { from { transform: scale(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
.pk-box { position: absolute; width: min(46%, 300px); padding: 7px 10px; background: rgba(13, 2, 33, 0.82); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; backdrop-filter: blur(3px); cursor: help; }
.pk-box[hidden] { display: none; }
.pk-box.foe { left: 3%; top: 11%; }
.pk-box.me { right: 3%; bottom: 7%; border-color: var(--magenta); }
.pk-field.doubles .pk-box { width: min(36%, 240px); font-size: 12px; padding: 5px 8px; }
.pk-field.doubles .pk-box.foe.slot0 { left: 2%; top: 9%; }
.pk-field.doubles .pk-box.foe.slot1 { left: 2%; top: 31%; }
.pk-field.doubles .pk-box.me.slot0 { right: 2%; bottom: 29%; }
.pk-field.doubles .pk-box.me.slot1 { right: 2%; bottom: 6%; }
.pk-name { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pk-hp { height: 8px; margin: 5px 0 4px; background: rgba(255, 255, 255, 0.12); border-radius: 4px; overflow: hidden; }
.pk-hp-fill { height: 100%; transition: width 0.6s ease-out; }
.pk-hp-fill.good { background: var(--good); box-shadow: 0 0 8px var(--good); }
.pk-hp-fill.warn { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.pk-hp-fill.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
.pk-hp-text { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font: 12px var(--mono-font); color: var(--muted); }
.pk-type, .pk-status, .pk-boost, .pk-vol { font: 700 10px var(--mono-font); padding: 1px 5px; border-radius: 3px; color: #10061f; text-transform: uppercase; }
.pk-types { display: inline-flex; gap: 4px; }
.pk-vol { background: var(--cyan); }
.pk-status { background: var(--orange); }
.pk-status.par { background: #f7d02c; } .pk-status.brn { background: #ee8130; } .pk-status.psn, .pk-status.tox { background: #a33ea1; color: #fff; }
.pk-status.slp { background: #a99bd1; } .pk-status.frz { background: #96d9d6; } .pk-status.fnt { background: var(--bad); color: #fff; }
.pk-boost.up { background: var(--good); } .pk-boost.down { background: var(--bad); color: #fff; }
.pk-balls { position: absolute; display: flex; gap: 4px; }
.pk-balls.foe { right: 3%; top: 4%; }
.pk-balls.me { left: 3%; top: 55%; }
.pk-ball { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(180deg, var(--bad) 50%, #fff 50%); box-shadow: 0 0 0 1px #000, 0 0 6px rgba(255, 77, 109, 0.6); cursor: help; }
.pk-ball.out { background: #333; box-shadow: 0 0 0 1px #000; }
.pk-ball.unknown { background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3); cursor: default; }
.pk-conditions { position: absolute; left: 50%; top: 3%; transform: translateX(-50%); display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 50%; }
/* Four players: a row of balls per trainer, and whose Pokémon is whose. */
.pk-ballrow { display: flex; align-items: center; gap: 4px; }
.pk-ballname { font-size: 10px; color: var(--muted); max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-balls:has(.pk-ballrow) { flex-direction: column; gap: 3px; }
.pk-balls.foe:has(.pk-ballrow) { align-items: flex-end; }
.pk-owner { font-size: 10px; padding: 0 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); color: var(--muted); }
.pk-owner.you { background: var(--magenta); color: #fff; }
.pk-owner.ally { background: rgba(0, 240, 255, 0.25); color: var(--text); }
.pk-seats p { margin: 2px 0; }
.pk-field.four .pk-side-conds.foe { top: 13%; }
.pk-field.four .pk-side-conds.me { top: 63%; }
.pk-side-conds { position: absolute; display: flex; gap: 4px; flex-wrap: wrap; max-width: 45%; }
.pk-side-conds.foe { right: 3%; top: 9%; justify-content: flex-end; }
.pk-side-conds.me { left: 3%; top: 60%; }
.pk-chip { font: 700 10px var(--mono-font); text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 3px; color: var(--yellow); background: rgba(13, 2, 33, 0.8); border: 1px solid rgba(255, 211, 25, 0.5); }
.pk-chip.small { color: var(--cyan); border-color: var(--line); }
.pk-banner { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; background: rgba(13, 2, 33, 0.7); }
.pk-banner[hidden] { display: none; }
.pk-controls { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.pk-prompt { font-weight: 600; }
.pk-moves { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pk-move { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; text-align: left; border: 1px solid var(--type); border-left: 6px solid var(--type); background: color-mix(in srgb, var(--type) 18%, rgba(13, 2, 33, 0.85)); }
.pk-move:hover:not(:disabled) { border-color: var(--type); box-shadow: 0 0 12px color-mix(in srgb, var(--type) 70%, transparent); }
.pk-move-name { font: 700 14px var(--body); }
.pk-move-meta { font: 11px var(--mono-font); color: var(--muted); }
.pk-mechs { flex-wrap: wrap; }
.pk-tera { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 6px 10px; border: 1px solid var(--type); border-radius: 4px; font-size: 13px; cursor: pointer; }
.pk-tera input { width: auto; }
.pk-targets { display: flex; gap: 8px; flex-wrap: wrap; }
.pk-team { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.pk-mon { position: relative; display: grid; grid-template-columns: 32px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; padding: 4px 8px; text-align: left; font-size: 12px; }
.pk-mon img { grid-row: 1 / 3; width: 32px; height: 32px; object-fit: contain; image-rendering: pixelated; }
.pk-mon-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-mon-hp { font: 11px var(--mono-font); }
.pk-mon-hp.good { color: var(--good); } .pk-mon-hp.warn { color: var(--yellow); } .pk-mon-hp.bad { color: var(--bad); }
.pk-mon.active { border-color: var(--magenta); }
.pk-mon.out { opacity: 0.45; }
.pk-mon.picked { border-color: var(--yellow); box-shadow: 0 0 10px rgba(255, 211, 25, 0.5); }
.pk-mon.picked::after { content: attr(data-order); position: absolute; top: 2px; right: 6px; font: 700 12px var(--display); color: var(--yellow); }
.pk-foe-preview { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.pk-foe-preview img { width: 40px; height: 40px; object-fit: contain; image-rendering: pixelated; cursor: help; }
.pk-wait, .pk-end { align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pk-log { height: min(66dvh, 600px); overflow-y: auto; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; line-height: 1.4; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.pk-log .minor { color: var(--muted); padding-left: 10px; }
.pk-log strong { color: var(--cyan); }
.pk-log .pk-error { color: var(--bad); padding-left: 10px; }
.pk-log .pk-note { color: var(--yellow); padding-left: 10px; font-style: italic; }
.pk-log .pk-chatline { color: var(--text); background: rgba(255, 43, 214, 0.08); border-left: 2px solid var(--magenta); padding: 1px 6px; }
.pk-turn { margin-top: 8px; padding: 2px 8px; font: 700 12px var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--yellow); border-left: 2px solid var(--yellow); }
.pk-chat input { padding: 8px 10px; font-size: 14px; }
.pk-tip { position: absolute; z-index: 20; width: 280px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; background: rgba(13, 2, 33, 0.97); border: 1px solid var(--cyan); border-radius: 6px; box-shadow: var(--glow-cyan); pointer-events: none; }
.pk-tip[hidden] { display: none; }
.pk-tip .muted.small { line-height: 1.35; }

/* Effects, coach and the DEBROD extras */
.pk-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.pk-burst { position: absolute; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, var(--c) 30%, color-mix(in srgb, var(--c) 40%, transparent) 55%, transparent 70%);
  mix-blend-mode: screen; animation: pk-burst 0.65s ease-out forwards; }
@keyframes pk-burst { from { transform: scale(0.2); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.pk-beam { position: absolute; height: 10px; margin-top: -5px; transform-origin: 0 50%; border-radius: 5px;
  background: linear-gradient(90deg, transparent, var(--c) 30%, #fff 60%, var(--c)); box-shadow: 0 0 18px var(--c); mix-blend-mode: screen; animation: pk-beam 0.5s ease-out forwards; }
@keyframes pk-beam { 0% { clip-path: inset(0 100% 0 0); opacity: 1; } 55% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 100%); opacity: 0; } }
.pk-float { position: absolute; transform: translate(-50%, 0); font: 900 20px var(--display); letter-spacing: 0.04em; color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px #000; animation: pk-float 1.2s ease-out forwards; white-space: nowrap; }
.pk-float.dmg { color: var(--bad); }
.pk-float.heal { color: var(--good); }
.pk-float.imm { color: var(--muted); font-size: 15px; }
@keyframes pk-float { from { transform: translate(-50%, 0) scale(0.6); opacity: 0; } 15% { transform: translate(-50%, -8px) scale(1.15); opacity: 1; } to { transform: translate(-50%, -60px) scale(1); opacity: 0; } }
.pk-big { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font: 900 clamp(22px, 4.2vw, 40px) var(--display); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
  color: var(--yellow); text-shadow: 0 0 12px var(--orange), 0 3px 0 #000; animation: pk-big 1.25s ease-out forwards; }
.pk-big.se { color: var(--good); text-shadow: 0 0 14px var(--good), 0 3px 0 #000; }
.pk-big.crit { color: var(--bad); text-shadow: 0 0 14px var(--bad), 0 3px 0 #000; }
.pk-big.tera { background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--yellow)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 10px rgba(255, 43, 214, 0.8)); }
@keyframes pk-big { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 70% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1); opacity: 0; } }
.pk-field.shake { animation: pk-shake 0.4s; }
@keyframes pk-shake { 0%, 100% { transform: none; } 20% { transform: translate(-7px, 3px); } 40% { transform: translate(6px, -4px); } 60% { transform: translate(-5px, 2px); } 80% { transform: translate(3px, -2px); } }
.pk-sprite.faint { animation: pk-faint 0.6s ease-in forwards; }
@keyframes pk-faint { to { transform: translateY(30%); } }
.pk-emote { position: absolute; bottom: 4%; font-size: 34px; animation: pk-emote 2.5s ease-out forwards; filter: drop-shadow(0 0 8px rgba(255, 43, 214, 0.7)); z-index: 4; }
@keyframes pk-emote { from { transform: translateY(0) scale(0.6); opacity: 0; } 12% { transform: translateY(-10px) scale(1.1); opacity: 1; } to { transform: translateY(-220px) scale(1); opacity: 0; } }
.pk-emotes { display: flex; justify-content: space-between; gap: 2px; }
.pk-emotes button { border: none; background: none; font-size: 20px; padding: 2px 4px; }
.pk-emotes button:hover:not(:disabled) { transform: scale(1.25); box-shadow: none; }
.pk-field::before, .pk-field::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.8s; }
.pk-field[data-weather="raindance"]::before, .pk-field[data-weather="primordialsea"]::before { opacity: 1; background: repeating-linear-gradient(105deg, rgba(120, 180, 255, 0.35) 0 2px, transparent 2px 22px); background-size: 200% 200%; animation: pk-rain 0.5s linear infinite; }
.pk-field[data-weather="sunnyday"]::before, .pk-field[data-weather="desolateland"]::before { opacity: 1; background: radial-gradient(circle at 85% 0%, rgba(255, 211, 25, 0.45), transparent 55%); animation: pk-sun 3s ease-in-out infinite alternate; }
.pk-field[data-weather="sandstorm"]::before { opacity: 1; background: repeating-linear-gradient(80deg, rgba(226, 191, 101, 0.28) 0 3px, transparent 3px 14px); background-size: 200% 100%; animation: pk-sand 0.9s linear infinite; }
.pk-field[data-weather="snow"]::before, .pk-field[data-weather="hail"]::before, .pk-field[data-weather="snowscape"]::before { opacity: 1; background-image: radial-gradient(#fff 1.5px, transparent 2px), radial-gradient(rgba(255, 255, 255, 0.7) 1px, transparent 1.5px); background-size: 40px 40px, 25px 25px; animation: pk-snow 3s linear infinite; }
.pk-field[data-terrain="electricterrain"]::after { opacity: 1; background: linear-gradient(0deg, rgba(247, 208, 44, 0.35), transparent 45%); }
.pk-field[data-terrain="grassyterrain"]::after { opacity: 1; background: linear-gradient(0deg, rgba(122, 199, 76, 0.35), transparent 45%); }
.pk-field[data-terrain="mistyterrain"]::after { opacity: 1; background: linear-gradient(0deg, rgba(214, 133, 173, 0.4), transparent 45%); }
.pk-field[data-terrain="psychicterrain"]::after { opacity: 1; background: linear-gradient(0deg, rgba(249, 85, 135, 0.35), transparent 45%); }
@keyframes pk-rain { to { background-position: -40px 60px; } }
@keyframes pk-sand { to { background-position: -60px 0; } }
@keyframes pk-snow { to { background-position: 20px 80px, -10px 50px; } }
@keyframes pk-sun { from { opacity: 0.6; } to { opacity: 1; } }
.pk-eff { display: flex; gap: 4px; margin-top: 2px; }
.pk-eff span { font: 700 10px var(--mono-font); padding: 0 5px; border-radius: 3px; }
.pk-eff .se { background: var(--good); color: #10061f; }
.pk-eff .nve { background: rgba(255, 255, 255, 0.15); color: var(--muted); }
.pk-eff .imm { background: #333; color: var(--muted); }
.pk-eff .neu { background: rgba(0, 240, 255, 0.15); color: var(--cyan); }
.pk-move.best { box-shadow: 0 0 0 2px var(--yellow), 0 0 16px rgba(255, 211, 25, 0.45); }
.pk-best { font-size: 13px; }
.chip.on { border-color: var(--yellow); color: var(--yellow); }
.pk-tower-pill { color: var(--yellow); border-color: rgba(255, 211, 25, 0.5); }
.pk-summary { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 6px; }
.pk-mvp { font: 700 15px var(--display); letter-spacing: 0.06em; color: var(--yellow); }
.pk-summary-rows { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; max-width: 520px; }

/* Draft */
.pk-draft { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; }
.pk-draft-top { align-items: center; flex-wrap: wrap; }
.pk-draft-turn { font: 700 14px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pk-draft-turn.mine { color: var(--yellow); text-shadow: 0 0 10px rgba(255, 211, 25, 0.6); animation: pk-pulse 1.2s ease-in-out infinite alternate; }
@keyframes pk-pulse { from { opacity: 0.6; } to { opacity: 1; } }
.pk-draft-teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pk-draft-teams.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pk-draft-col { padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.pk-draft-col.mine { border-color: var(--magenta); }
.pk-draft-col.turn { box-shadow: 0 0 14px rgba(255, 211, 25, 0.35); border-color: var(--yellow); }
.pk-draft-picks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
.pk-draft-picked { display: flex; flex-direction: column; align-items: center; font-size: 11px; text-align: center; overflow: hidden; }
.pk-draft-picked img { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; }
.pk-draft-picked span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.pk-draft-picked.empty { height: 62px; justify-content: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; font: 700 18px var(--display); }
.pk-draft-pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.pk-draft-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px; text-align: center; background: var(--panel); }
.pk-draft-card img { height: 72px; max-width: 100%; object-fit: contain; image-rendering: pixelated; }
.pk-draft-card:disabled { opacity: 1; cursor: default; }
.pk-draft-card:not(:disabled):hover { border-color: var(--yellow); box-shadow: 0 0 14px rgba(255, 211, 25, 0.5); transform: translateY(-2px); }
.pk-draft-card.taken { opacity: 0.4; filter: grayscale(0.6); }
.pk-draft-card.taken.mine { opacity: 0.7; border-color: var(--magenta); filter: none; }
.pk-draft-name { font-weight: 700; }
.pk-draft-moves { line-height: 1.3; }
.pk-draft-owner { position: absolute; top: 6px; right: 6px; font: 700 10px var(--mono-font); text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: var(--magenta); color: #fff; }
