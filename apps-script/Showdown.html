    n.chunks.forEach((data, seq) => n.send('chunk', { battle: n.battle, seq, data }))
    hostTimer()
  }

  function hostEvent(ev, p) {
    const n = net
    if (!n) return
    if (ev === 'hello' && n.four) {
      const x = seatOf(n, p.from)
      if (n.battle && x) fourReplay(x)
      else { fourRoom(); if (n.draft && !n.battle) n.send('draft', draftPayload(n.draft)) }
      return
    }
    if (ev === 'hello') { hostRoom(); if (n.battle && p.from === n.guestId) hostReplay(); else if (n.draft && !n.battle) hostDraftSync(); return }
    if (ev === 'emote') { if (match) match.view.emote(String(p.e || '').slice(0, 4)); return }
    if (ev === 'chat') { if (match) match.view.chat(String(p.name || '?').slice(0, 18), String(p.text || '').slice(0, 200)); return }
    if (ev === 'resend' && n.four) {
      if (p.battle !== n.battle) return
      const x = p.spectator ? null : seatOf(n, p.from)
      if (!p.spectator && !x) return
      const list = x ? n.chunks[x] : n.spec
      for (let seq = Math.max(0, p.from_seq | 0); seq < list.length; seq++) n.send(x ? 'chunk' : 'schunk', Object.assign({ battle: n.battle, seq, data: list[seq] }, x ? { side: x } : {}))
      return
    }
    if (n.four) {
      const x = seatOf(n, p.from)
      if (!x) return
      if (ev === 'draftpick' && n.draft && !n.battle && p.id === n.draft.id) {
        if (draftPick(n.draft, x, p.idx | 0)) fourDraftNext()
        return
      }
      if (!match || p.battle !== n.battle) return
      if (ev === 'choice') hostChoice(x, String(p.data || '').slice(0, 120))
      if (ev === 'forfeit') { match.view.notice(`${n.seats[x].name} forfeited.`); match.sim.forfeit(x) }
      return
    }
    if (ev === 'resend') {
      if (p.battle !== n.battle) return
      const list = p.spectator ? n.spec : n.chunks
      if (!p.spectator && p.from !== n.guestId) return
      for (let seq = Math.max(0, p.from_seq | 0); seq < list.length; seq++) n.send(p.spectator ? 'schunk' : 'chunk', { battle: n.battle, seq, data: list[seq] })
      return
    }
    if (p.from !== n.guestId) return
    if (ev === 'team' && !n.battle) {
      const problems = validate(n.format, String(p.packed || ''))
      if (problems && problems.length) return n.send('teamerror', { to: p.from, problems })
      n.guestTeam = String(p.packed)
      hostStart()
      return
    }
    if (ev === 'draftpick' && n.draft && !n.battle && p.id === n.draft.id) {
      if (draftPick(n.draft, 'p2', p.idx | 0)) hostDraftNext()
      return
    }
    if (!match || p.battle !== n.battle) return
    if (ev === 'choice') hostChoice('p2', String(p.data || '').slice(0, 120))
    if (ev === 'forfeit') { match.view.notice(`${n.guestName} forfeited.`); match.sim.forfeit('p2') }
  }

  // Guest and spectator side
  function followerPresence() {
    const n = net
    const hostP = n.players.find(p => p.role === 'host')
    if (hostP) n.hostId = hostP.id
    if (n.mode && !hostP && match) {
      match.view.notice('The host left, so the battle is over.')
      n.mode = null
    }
  }

  async function followerEvent(ev, p) {
    const n = net
    if (!n) return
    if (ev === 'room' && p.four) {
      n.hostId = p.from
      n.hostName = p.hostName
      n.format = p.format
      n.four = true
      const seat = SEATS.find(x => p.seats && p.seats[x] && p.seats[x].id === me) || null
      if (!p.battle) {
        n.battle = null
        n.seat = seat
        if (match || p.draft) return
        const who = x => (x === 'p1' ? p.hostName : p.seats[x] ? `${p.seats[x].name}${x === seat ? ' (you)' : ''}` : 'CPU')
        pkFill(wrap, el('div', { class: 'card stack pk-menu' },
          el('p', { class: 'wordmark' }, 'Showdown'),
          el('p', { class: 'tagline' }, showdownFormatName(p.format)),
          isMulti(p.format)
            ? el('div', { class: 'pk-seats' },
              el('p', null, el('strong', null, 'Team 1: '), `${who('p1')} & ${who('p3')}`),
              el('p', null, el('strong', null, 'Team 2: '), `${who('p2')} & ${who('p4')}`))
            : el('div', { class: 'pk-seats' }, seatsOf(p.format).map(x => el('p', null, `${x.toUpperCase()} · ${who(x)}`))),
          el('p', { class: 'muted' }, seat ? `Waiting for ${p.hostName} to start…` : 'The seats are full, so you\'ll watch.'),
          el('button', { type: 'button', class: 'link', onClick: () => { leaveNet(); menu() } }, '‹ Leave')))
        return
      }
      const mode = seat ? 'guest' : 'spectator'
      if (n.battle === p.battle && n.mode === mode && n.seat === seat && match) return
      n.battle = p.battle
      n.mode = mode
      n.seat = seat
      n.names = p.names || {}
      n.expect = 0
      n.buffer = {}
      try { await engine() } catch (e) { return menu(e.message) }
      if (dead || net !== n || n.battle !== p.battle) return
      followerView()
      n.send('resend', { battle: n.battle, from_seq: n.expect, spectator: mode === 'spectator' })
      return
    }
    if (ev === 'room') {
      n.hostId = p.from
      n.hostName = p.hostName
      n.format = p.format
      const mine = p.guestId === me
      n.amGuest = mine
      if (!p.battle && p.draft) return
      if (!p.battle) {
        if (mine && p.needsTeam && !n.teamSent) return guestPickTeam()
        if (!match) loading(mine ? `Waiting for ${p.hostName} to start…` : p.guestId ? `${p.guestName} is getting ready. You'll watch.` : 'Waiting for the host…')
        return
      }
      const mode = mine ? 'guest' : 'spectator'
      if (n.battle === p.battle && n.mode === mode && match) return
      // A new battle (or our first): keep what arrives while the engine
      // loads, then ask for anything we missed.
      n.battle = p.battle
      n.mode = mode
      n.expect = 0
      n.buffer = {}
      n.guestName = p.guestName
      try { await engine() } catch (e) { return menu(e.message) }
      if (dead || net !== n || n.battle !== p.battle) return
      followerView()
      n.send('resend', { battle: n.battle, from_seq: n.expect, spectator: mode === 'spectator' })
      return
    }
    if (p.from !== n.hostId) return
    if (ev === 'teamerror' && p.to === me) {
      n.teamSent = false
      return guestPickTeam(`Your team isn't legal in ${showdownFormatName(n.format)}: ${(p.problems || []).join(' ')}`)
    }
    if (ev === 'chat') { if (match) match.view.chat(String(p.name || '?').slice(0, 18), String(p.text || '').slice(0, 200)); return }
    if (ev === 'emote') { if (match) match.view.emote(String(p.e || '').slice(0, 4)); return }
    if (ev === 'draft') {
      try { await engine() } catch (e) { return menu(e.message) }
      if (net !== n) return
      if (match) endMatch()
      n.battle = null
      const D = { id: p.id, fid: p.fid, pool: PS.Teams.unpack(p.pool) || [], picks: p.picks, order: p.order, at: p.at, names: p.names, sides: p.sides, each: p.each }
      const deadline = Date.now() + (p.left || 0)
      const mine = n.four ? n.seat : n.amGuest ? 'p2' : null
      // Once we've picked, the board stays locked until the host confirms.
      n.draftRender = () => draftScreen(D, mine || 'p1', i => {
        if (!mine || D.order[D.at] !== mine || D.sent) return
        D.sent = true
        n.send('draftpick', { id: D.id, idx: i })
        n.draftRender()
      }, { back: () => { leaveNet(); menu() }, spectator: !mine, deadline, locked: () => !!D.sent })
      n.draftRender()
      if (!n.draftRefresh) {
        n.draftRefresh = setInterval(() => { if (net === n && !match && !n.battle && n.draftRender) n.draftRender() }, 1000)
        n.timers.push(n.draftRefresh)
      }
      return
    }
    if (p.battle !== n.battle) return
    if (ev === 'timer' && match) {
      // The timer is the host's p1 / guest's p2; spectators see both. With
      // four players everyone sees every seat as it is.
      if (n.four) match.view.timer({ on: p.on, p1: p.p1, p2: p.p2, p3: p.p3, p4: p.p4 })
      else match.view.timer(n.mode === 'guest' ? { on: p.on, p1: p.p2, p2: p.p1 } : { on: p.on, p1: p.p1, p2: p.p2 })
      return
    }
    if (ev === 'reset' && n.mode === 'guest' && p.to === me) {
      n.expect = 0
      n.buffer = {}
      if (match) followerView()
      return
    }
    const wanted = n.mode === 'guest' ? 'chunk' : 'schunk'
    // Four players: only our own seat's view.
    if (ev === 'chunk' && n.four && p.side !== n.seat) return
    if (ev === wanted && Number.isInteger(p.seq) && p.seq >= n.expect) {
      n.buffer[p.seq] = String(p.data || '')
      followerFlush()
    }
  }

  async function guestPickTeam(err) {
    const n = net
    try { await engine() } catch (e) { return menu(e.message) }
    if (net !== n) return
    const teams = loadTeams()
    const sel = el('select', null, teams.map(t => el('option', { value: t.id }, t.name)))
    sel.value = teams.some(t => t.id === teamId) ? teamId : (teams[0] && teams[0].id) || ''
    pkFill(wrap, el('div', { class: 'card stack pk-menu' },
      el('p', { class: 'wordmark' }, 'Showdown'),
      el('p', null, `${n.hostName} wants to battle in ${showdownFormatName(n.format)}. Pick your team.`),
      err && el('p', { class: 'error' }, err),
      teams.length ? sel : el('p', { class: 'muted small' }, 'You don\'t have a team yet.'),
      el('div', { class: 'row' },
        teams.length && el('button', { type: 'button', class: 'primary', onClick: () => {
          const t = teamById(sel.value)
          if (!t) return
          const problems = validate(n.format, t.packed)
          if (problems && problems.length) return guestPickTeam(`That team isn't legal in ${showdownFormatName(n.format)}: ${problems.join(' ')}`)
          teamId = t.id
          pkStore.set('team', teamId)
          n.teamSent = true
          n.send('team', { packed: t.packed })
          loading(`Sent. Waiting for ${n.hostName}…`)
        } }, 'Use this team'),
        el('button', { type: 'button', onClick: () => { const code = n.code; leaveNet(); builderThen(code) } }, 'Team builder')),
      el('button', { type: 'button', class: 'link', onClick: () => { leaveNet(); menu() } }, '‹ Leave')))
  }

  // Build a team, then come back to the room.
  function builderThen(code) {
    opts = Object.assign({}, opts, { code })
    builder(teamId)
  }

  function followerFlush() {
    const n = net
    if (!n || !match) return
    while (n.buffer[n.expect] !== undefined) {
      match.view.feed(n.buffer[n.expect])
      delete n.buffer[n.expect]
      n.expect++
    }
    // Something got lost on the way: ask for it again.
    if (Object.keys(n.buffer).length && !n.asked) {
      n.asked = true
      n.timers.push(setTimeout(() => {
        n.asked = false
        if (net === n && Object.keys(n.buffer).length) n.send('resend', { battle: n.battle, from_seq: n.expect, spectator: n.mode === 'spectator' })
      }, 1500))
    }
  }

  function followerView() {
    const n = net
    if (match) match.view.destroy()
    const spectator = n.mode === 'spectator'
    const view = viewer(spectator ? 'p1' : n.four ? n.seat : 'p2', {
      format: n.format, me: spectator ? n.hostName : name, foe: n.four ? 'the others' : spectator ? n.guestName : n.hostName, online: true, spectator, names: n.names,
    }, {
      choose: choice => n.send('choice', { battle: n.battle, data: choice }),
      forfeit: () => n.send('forfeit', { battle: n.battle }),
      back: () => { endMatch(); leaveNet(); menu() },
      chat: text => { n.send('chat', { name, text }); view.chat(name, text) },
      emote: e => n.send('emote', { e }),
    })
    match = { view }
    followerFlush()
    if (!spectator) music(true)
  }

  // ── The battle screen ──
  // Follows one side's view of the battle (or a spectator's) and offers
  // that player's choices. Lines play out with a little pacing so a turn
  // reads like it does on Showdown.
  function viewer(player, info, io) {
    // Four-player battles are drawn as doubles: each half of the field holds
    // two trainers' Pokémon (p1 and p3, p2 and p4), and side is the half
    // nearest us. Otherwise side is simply who we're playing as.
    const four = isFour(info.format)
    const multi = four && isMulti(info.format)
    // A three-way's empty fourth seat is never drawn.
    const shown = s => !(isThree(info.format) && s === SHOWDOWN_GHOST)
    const halfOf = s => (s === 'p1' || s === 'p3' ? 'p1' : 'p2')
    const posOf = s => (s === 'p1' || s === 'p2' ? 0 : 1)
    const side = four ? halfOf(player) : player
    const battle = new PS.Battle(new PS.Generations(PS.Dex))
    const fmt = new PS.LogFormatter(player, battle)
    const foeSide = side === 'p1' ? 'p2' : 'p1'
    const spectator = !!info.spectator
    const doubles = isDoubles(info.format) || four
    const slots = doubles ? [0, 1] : [0]
    const decide = four ? [0] : slots   // the slots we choose for
    const names = info.names || {}
    const nameOf = s => (battle[s] && battle[s].name) || names[s] || s
    const onField = {}                  // four players: the ident each has out
    const fieldMon = s => (onField[s] && battle.getPokemon(onField[s])) || null
    const others = () => SHOWDOWN_FOUR.filter(s => s !== player)
    const allyOf = () => (multi ? others().find(s => halfOf(s) === halfOf(player)) : null)
    const opponents = () => others().filter(s => s !== allyOf())
    const targetLoc = s => (halfOf(s) === halfOf(player) ? -(posOf(s) + 1) : posOf(s) + 1)
    const myLive = slot => (four ? fieldMon(player) : battle[side].active[slot])
    // Where an ident like p3b: Name is drawn.
    function placeOf(ident) {
      const m = /^(p[1-4])([ab])?/.exec(ident || '')
      if (!m) return null
      if (four) return { s: halfOf(m[1]), i: posOf(m[1]) }
      return { s: m[1], i: m[2] === 'b' && doubles ? 1 : 0 }
    }
    let request = null
    let nextRequest = null
    let waiting = false
    let result = null
    let destroyed = false
    let turn = 0
    let pending = []            // this turn's choice per slot, in doubles
    let mech = ''               // '', 'terastallize', 'mega', 'zmove', 'dynamax', 'ultra'
    let targeting = null        // { slot, move, mech } while picking a target
    let preview = []            // team preview picks
    const rawLog = []
    const queue = []
    let pumping = false
    let speed = pkStore.get('speed', 'normal')
    let timer = null
    let timerTick = null
    let coach = pkStore.get('coach', true)
    let lastMover = null        // who used the last move, to credit damage and KOs
    const credits = {}          // per Pokémon: damage dealt (in % of HP) and KOs
    const lastShown = { p1: [null, null], p2: [null, null] }
    const teraUsed = {}         // per trainer: the type they Terastallized into
    const teraColor = t => TYPE_COLORS[t] || '#fff'
    // Which Pokémon have Terastallized, from the log: the battle model loses
    // it for our own side each time it reads a request.
    const teraMons = {}
    const monKey = ident => String(ident || '').replace(/^(p\d)[a-d]?: /, '$1: ')
    const teraOf = poke => (!poke ? '' : poke.isTerastallized ? poke.teraType : teraMons[monKey(poke.originalIdent || poke.ident)] || '')

    // Field: up to two Pokémon a side.
    const sprites = { p1: [], p2: [] }
    const boxes = { p1: [], p2: [] }
    for (const s of ['p1', 'p2']) {
      for (const i of slots) {
        const near = s === side
        sprites[s][i] = el('img', { class: `pk-sprite ${near ? 'me' : 'foe'} slot${i}`, alt: '', hidden: true })
        boxes[s][i] = el('div', { class: `pk-box ${near ? 'me' : 'foe'} slot${i}`, hidden: true })
      }
    }
    const conditions = el('div', { class: 'pk-conditions' })
    const balls = { p1: el('div', { class: `pk-balls ${side === 'p1' ? 'me' : 'foe'}` }), p2: el('div', { class: `pk-balls ${side === 'p2' ? 'me' : 'foe'}` }) }
    const sideConds = { p1: el('div', { class: `pk-side-conds ${side === 'p1' ? 'me' : 'foe'}` }), p2: el('div', { class: `pk-side-conds ${side === 'p2' ? 'me' : 'foe'}` }) }
    const banner = el('div', { class: 'pk-banner', hidden: true })
    const fx = el('div', { class: 'pk-fx', 'aria-hidden': 'true' })
    const field = el('div', { class: `pk-field ${doubles ? 'doubles' : ''} ${four ? 'four' : ''}` },
      conditions, balls.p1, balls.p2, sideConds.p1, sideConds.p2,
      ...['p1', 'p2'].flatMap(s => slots.map(i => sprites[s][i])),
      fx,
      ...['p1', 'p2'].flatMap(s => slots.map(i => boxes[s][i])),
      banner)
    const tip = el('div', { class: 'pk-tip', hidden: true })
    const bar = el('div', { class: 'pk-bar' })
    const controls = el('div', { class: 'pk-controls' })
    const log = el('div', { class: 'pk-log', 'aria-live': 'polite' })
    const chatInput = el('input', { placeholder: spectator ? 'Say something…' : 'Chat', maxlength: 200 })
    const chatForm = io.chat && el('form', { class: 'row pk-chat', onSubmit: e => {
      e.preventDefault()
      const text = chatInput.value.trim()
      if (!text) return
      chatInput.value = ''
      io.chat(text)
    } }, chatInput, el('button', { type: 'submit' }, 'Send'))
    const emoteRow = el('div', { class: 'pk-emotes' }, SHOWDOWN_EMOTES.map(e => el('button', { type: 'button', title: 'React', onClick: () => { floatEmote(e); if (io.emote) io.emote(e) } }, e)))
    pkFill(wrap, el('div', { class: 'pk-main' }, bar, field, controls), el('div', { class: 'pk-side' }, log, emoteRow, chatForm), tip)

    // ── Effects (a DEBROD extra) ──
    // Type-coloured beams and bursts, damage numbers, and a shake for the
    // big hits. Skipped at Instant speed.
    const fxOn = () => speed !== 'instant' && !destroyed
    function spot(ident) {
      const at = placeOf(ident)
      const f = field.getBoundingClientRect()
      if (!at || !f.width) return null
      const img = sprites[at.s][at.i]
      const r = img && !img.hidden ? img.getBoundingClientRect() : null
      if (r && r.width) return { x: r.left - f.left + r.width / 2, y: r.top - f.top + r.height / 2, h: r.height }
      const near = at.s === side
      return { x: f.width * (near ? 0.25 : 0.72), y: f.height * (near ? 0.72 : 0.36), h: f.height * 0.3 }
    }
    function spawn(node, ms) {
      fx.append(node)
      setTimeout(() => node.remove(), ms)
    }
    function burst(ident, color, size = 120) {
      const p = spot(ident)
      if (!p || !fxOn()) return
      spawn(el('div', { class: 'pk-burst', style: `left: ${p.x}px; top: ${p.y}px; --c: ${color}; --s: ${size}px` }), 700)
    }
    function beam(from, to, color) {
      const a = spot(from)
      const b = spot(to)
      if (!a || !b || !fxOn()) return
      const dx = b.x - a.x
      const dy = b.y - a.y
      spawn(el('div', { class: 'pk-beam', style: `left: ${a.x}px; top: ${a.y}px; width: ${Math.hypot(dx, dy)}px; transform: rotate(${Math.atan2(dy, dx)}rad); --c: ${color}` }), 600)
    }
    function floatText(ident, text, cls) {
      const p = spot(ident)
      if (!p || !fxOn()) return
      spawn(el('div', { class: `pk-float ${cls || ''}`, style: `left: ${p.x}px; top: ${p.y - p.h / 2}px` }, text), 1300)
    }
    function bigText(text, cls) {
      if (!fxOn()) return
      spawn(el('div', { class: `pk-big ${cls || ''}` }, text), 1300)
    }
    function shake() {
      if (!fxOn()) return
      field.classList.remove('shake')
      void field.offsetWidth
      field.classList.add('shake')
    }
    function floatEmote(e) {
      if (destroyed) return
      spawn(el('div', { class: 'pk-emote', style: `left: ${10 + Math.random() * 80}%` }, e), 2600)
    }
    const sideOf = ident => String(ident || '').slice(0, 2)
    function credit(ident) {
      const key = `${sideOf(ident)}: ${String(ident).split(': ').slice(1).join(': ')}`
      if (!credits[key]) credits[key] = { name: String(ident).split(': ').slice(1).join(': '), side: sideOf(ident), dealt: 0, kos: 0 }
      return credits[key]
    }

    function effects(kind, args, kwArgs, before) {
      if (kind === 'move') {
        lastMover = args[1]
        const move = PS.Dex.moves.get(args[2])
        const color = TYPE_COLORS[move.type] || '#fff'
        const target = args[3] && args[3] !== args[1] && !kwArgs.still && !kwArgs.miss ? args[3] : null
        if (move.category === 'Status' || !target) burst(target || args[1], color, 90)
        else { beam(args[1], target, color); setTimeout(() => burst(target, color), 220) }
      } else if (kind === '-damage' || kind === '-heal') {
        const pk = battle.getPokemon(args[1])
        if (!pk || before === null || !pk.maxhp) return
        const pct = Math.round((pk.hp / pk.maxhp - before) * 100)
        if (pct) floatText(args[1], `${pct > 0 ? '+' : ''}${pct}%`, pct < 0 ? 'dmg' : 'heal')
        if (kind === '-damage' && pct < 0 && !kwArgs.from && lastMover && sideOf(lastMover) !== sideOf(args[1])) credit(lastMover).dealt -= pct
      } else if (kind === '-crit') { bigText('Critical hit!', 'crit'); shake() }
      else if (kind === '-supereffective') { bigText('Super effective!', 'se'); shake() }
      else if (kind === '-immune') floatText(args[1], 'Immune', 'imm')
      else if (kind === '-miss') floatText(args[2] || args[1], 'Missed', 'imm')
      else if (kind === 'faint') {
        animate(args[1], 'faint')
        if (lastMover && sideOf(lastMover) !== sideOf(args[1])) credit(lastMover).kos++
        // The CPU has feelings too.
        if (info.vsCpu && Math.random() < 0.35) setTimeout(() => floatEmote(sideOf(args[1]) === player ? pick(['😂', '🔥', '😎']) : pick(['😤', '💀', '😱'])), 500)
      } else if (kind === '-terastallize') { burst(args[1], TYPE_COLORS[args[2]] || '#fff', 260); bigText(`Tera ${args[2]}!`, 'tera') }
      else if (kind === '-mega') { burst(args[1], '#ff7a1a', 260); bigText('Mega Evolution!', 'tera') }
      else if ((kind === 'switch' || kind === 'drag') && /, shiny(,|$)/.test(String(args[2]))) setTimeout(() => { burst(args[1], '#ffe066', 200); floatText(args[1], '✨ Shiny', 'heal') }, 250)
      else if (kind === '-zpower') bigText('Z-Power!', 'tera')
      else if (kind === '-start' && /dynamax/i.test(String(args[2]))) { burst(args[1], '#ff2bd6', 280); bigText('Dynamax!', 'tera') }
    }

    // ── Tooltips ──
    function showTip(target, content) {
      pkFill(tip, ...[].concat(content))
      tip.hidden = false
      const r = target.getBoundingClientRect()
      const w = wrap.getBoundingClientRect()
      const left = Math.min(Math.max(0, r.left - w.left), Math.max(0, w.width - 280))
      tip.style.left = `${left}px`
      tip.style.top = `${r.bottom - w.top + 6}px`
    }
    function hideTip() { tip.hidden = true }
    // Hover shows a tooltip; on things that aren't buttons, a tap does too.
    function tippable(node, content) {
      node.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTip(node, content()) })
      node.addEventListener('pointerleave', hideTip)
      if (node.tagName !== 'BUTTON') node.addEventListener('click', () => { if (tip.hidden) showTip(node, content()); else hideTip() })
      return node
    }
    const typeChips = list => el('span', { class: 'pk-types' }, list.map(t => el('span', { class: 'pk-type', style: `background: ${TYPE_COLORS[t] || '#888'}` }, t)))

    // Our own Pokémon: everything the request tells us.
    function myTip(p) {
      const sp = PS.Dex.species.get(p.speciesForme)
      const live = battle[player].team.find(x => x.originalIdent === p.ident) || null
      const types = p.terastallized ? [p.terastallized] : live && teraOf(live) ? [teraOf(live)] : sp.types
      return [
        el('p', { class: 'name' }, `${p.name}${p.name !== sp.name ? ` (${sp.name})` : ''} `, el('span', { class: 'muted' }, `L${p.level}`)),
        typeChips(types),
        el('p', null, `HP ${Math.max(0, Math.round(p.hp))}/${p.maxhp}${p.status ? ` · ${p.status.toUpperCase()}` : ''}`),
        el('p', null, `Ability: ${PS.Dex.abilities.get(p.ability || p.baseAbility).name || '—'}`),
        el('p', null, `Item: ${p.item ? PS.Dex.items.get(p.item).name : 'none'}`),
        p.teraType && el('p', null, `Tera type: ${p.teraType}`),
        p.stats && el('p', { class: 'muted small' }, Object.entries(p.stats).map(([k, v]) => `${STAT_NAMES[k]} ${v}`).join(' · ')),
        el('p', { class: 'muted small' }, (p.moves || []).map(m => PS.Dex.moves.get(m).name).join(' · ')),
      ]
    }
    // Their Pokémon: what's been seen, and the possibilities for the rest.
    function foeTip(poke) {
      const sp = PS.Dex.species.get(poke.speciesForme)
      const abilities = poke.ability ? [PS.Dex.abilities.get(poke.ability).name] : Object.values(sp.abilities)
      const pct = poke.maxhp ? Math.round((poke.hp / poke.maxhp) * 100) : 0
      return [
        el('p', { class: 'name' }, `${poke.name}${poke.name !== sp.name ? ` (${sp.name})` : ''} `, el('span', { class: 'muted' }, `L${poke.level}`)),
        typeChips(monTypes(poke)),
        el('p', null, `HP ${pct}%${poke.status ? ` · ${poke.status.toUpperCase()}` : ''}`),
        el('p', null, `${poke.ability ? 'Ability' : 'Possible abilities'}: ${abilities.join(', ')}`),
        el('p', null, `Item: ${poke.item ? PS.Dex.items.get(poke.item).name : poke.lastItem ? `none (had ${PS.Dex.items.get(poke.lastItem).name})` : 'unknown'}`),
        el('p', { class: 'muted small' }, `Base stats: ${Object.entries(sp.baseStats).map(([k, v]) => `${STAT_NAMES[k]} ${v}`).join(' · ')}`),
        poke.moveSlots && poke.moveSlots.length
          ? el('p', { class: 'muted small' }, `Seen: ${poke.moveSlots.map(m => `${PS.Dex.moves.get(m.id).name}${m.ppUsed ? ` (${m.ppUsed} used)` : ''}`).join(' · ')}`)
          : el('p', { class: 'muted small' }, 'No moves seen yet.'),
      ]
    }
    function moveTip(id, extra) {
      const m = PS.Dex.moves.get(id)
      return [
        el('p', { class: 'name' }, m.name),
        typeChips([m.type]),
        el('p', null, `${m.category}${m.basePower ? ` · ${m.basePower} power` : ''} · ${m.accuracy === true ? 'never misses' : `${m.accuracy}% accuracy`}${m.priority ? ` · priority ${m.priority > 0 ? '+' : ''}${m.priority}` : ''}`),
        extra && el('p', { class: 'muted small' }, extra),
        el('p', { class: 'muted small' }, m.shortDesc || m.desc || ''),
      ]
    }

    // ── Field ──
    function setSprite(img, poke, back) {
      if (!poke) { img.hidden = true; img.dataset.id = ''; return }
      const species = PS.Dex.species.get(poke.speciesForme)
      const id = species.spriteid || PS.toID(poke.speciesForme)
      const key = `${id}${back ? ':b' : ''}${poke.shiny ? ':s' : ''}`
      img.hidden = false
      img.classList.toggle('fainted', !!poke.fainted)
      // Terastallized: a glow in its Tera type's colour.
      const tera = teraOf(poke)
      img.classList.toggle('tera', !!tera)
      if (tera) img.style.setProperty('--tera', teraColor(tera))
      if (img.dataset.id === key) return
      img.dataset.id = key
      const shiny = poke.shiny ? '-shiny' : ''
      const gen = battle.gen && battle.gen.num
      const tries = [
        ...(gen && gen <= 5 && gen >= 1 ? [] : [`${SHOWDOWN_SPRITES}ani${back ? '-back' : ''}${shiny}/${id}.gif`]),
        `${SHOWDOWN_SPRITES}gen5${back ? '-back' : ''}${shiny}/${id}.png`,
        `${SHOWDOWN_SPRITES}gen5${back ? '-back' : ''}/${PS.toID(species.baseSpecies || poke.speciesForme)}.png`,
      ]
      let n = 0
      // Hidden until the new one loads, so the last Pokémon doesn't linger.
      img.style.visibility = 'hidden'
      img.onload = () => { img.style.visibility = '' }
      img.onerror = () => { if (++n < tries.length) img.src = tries[n] }
      img.src = tries[0]
    }

    const hpClass = frac => (frac > 0.5 ? 'good' : frac > 0.2 ? 'warn' : 'bad')

    function infoBox(box, poke, near, slot, owner) {
      if (!poke) { box.hidden = true; return }
      box.hidden = false
      const frac = poke.maxhp ? poke.hp / poke.maxhp : 0
      const pct = Math.round(frac * 100)
      const status = poke.fainted ? 'fnt' : poke.status
      const boosts = Object.entries(poke.boosts || {}).filter(([, v]) => v)
      const mine = near && !spectator && request && request.side ? request.side.pokemon.find(p => p.ident === poke.originalIdent) : null
      const vol = Object.keys(poke.volatiles || {}).filter(v => ['dynamax', 'substitute', 'confusion', 'leechseed', 'taunt', 'encore', 'perishsong', 'yawn', 'protosynthesis', 'quarkdrive'].some(x => v.startsWith(x)))
      pkFill(box, 
        el('div', { class: 'pk-name' },
          four && owner && el('span', { class: `pk-owner ${owner === player && !spectator ? 'you' : multi && owner === allyOf() ? 'ally' : ''}` }, owner === player && !spectator ? 'You' : nameOf(owner)),
          el('strong', null, poke.name),
          el('span', { class: 'muted' }, ` L${poke.level}`),
          teraOf(poke) && el('span', { class: 'pk-tera-badge', style: `--tera: ${teraColor(teraOf(poke))}`, title: `Terastallized into ${teraOf(poke)}` }, `💎 Tera ${teraOf(poke)}`)),
        el('div', { class: 'pk-hp' }, el('div', { class: `pk-hp-fill ${hpClass(frac)}`, style: `width: ${Math.max(0, pct)}%` })),
        el('div', { class: 'pk-hp-text' },
          mine ? `${Math.max(0, Math.round(mine.hp))}/${mine.maxhp} HP` : `${pct}%`,
          status && el('span', { class: `pk-status ${status}` }, status.toUpperCase()),
          boosts.map(([stat, v]) => el('span', { class: `pk-boost ${v > 0 ? 'up' : 'down'}` }, `${v > 0 ? '+' : ''}${v} ${STAT_NAMES[stat] || stat}`)),
          vol.map(v => el('span', { class: 'pk-vol' }, v.replace(/^./, c => c.toUpperCase())))))
      box.classList.toggle('tera', !!teraOf(poke))
      if (teraOf(poke)) box.style.setProperty('--tera', teraColor(teraOf(poke)))
      box.onpointerenter = null
      box._tip = () => (mine ? myTip(mine) : foeTip(poke))
    }

    // Six balls per side: who's still standing, and how many of theirs
    // we've seen.
    function drawBalls(target, sideObj, sideId) {
      pkFill(target, ...ballNodes(sideObj, sideId), teraChip(sideId))
    }
    // Each trainer can Terastallize once a battle.
    function teraChip(sideId) {
      const t = teraUsed[sideId]
      return t ? el('span', { class: 'pk-tera-used', style: `--tera: ${teraColor(t.type)}`, title: `${t.name} Terastallized into ${t.type}` }, '💎 Tera used') : null
    }
    // Four players: each trainer on this half gets a labelled row.
    function drawBallsFour(target, half) {
      pkFill(target, SHOWDOWN_FOUR.filter(s => halfOf(s) === half && battle[s] && shown(s)).map(s =>
        el('div', { class: 'pk-ballrow' }, el('span', { class: 'pk-ballname' }, s === player && !spectator ? 'You' : nameOf(s)), ballNodes(battle[s], s), teraChip(s))))
    }
    function ballNodes(sideObj, sideId) {
      const team = sideObj.team || []
      const total = Math.max(sideObj.totalPokemon || 6, team.length)
      const out = []
      for (let i = 0; i < total; i++) {
        const p = team[i]
        const tera = teraOf(p)
        const b = el('span', { class: `pk-ball ${!p ? 'unknown' : p.fainted ? 'out' : ''} ${tera ? 'tera' : ''}`, style: tera ? `--tera: ${teraColor(tera)}` : '' })
        if (p) tippable(b, () => (sideId === player && !spectator && request && request.side
          ? myTip(request.side.pokemon.find(x => x.ident === p.originalIdent) || {})
          : foeTip(p)))
        out.push(b)
      }
      return out
    }

    function drawConditions() {
      const f = battle.field
      field.dataset.weather = f.weather || ''
      field.dataset.terrain = f.terrain || ''
      const chips = []
      if (f.weather) chips.push(PS.Dex.conditions.get(f.weather).name || f.weather)
      if (f.terrain) chips.push(PS.Dex.conditions.get(f.terrain).name || f.terrain)
      for (const id of Object.keys(f.pseudoWeather || {})) chips.push(PS.Dex.conditions.get(id).name || id)
      pkFill(conditions, ...chips.map(c => el('span', { class: 'pk-chip' }, c)))
      for (const s of ['p1', 'p2']) {
        const sc = {}
        for (const x of four ? SHOWDOWN_FOUR.filter(x => halfOf(x) === s) : [s]) Object.assign(sc, (battle[x] && battle[x].sideConditions) || {})
        pkFill(sideConds[s], ...Object.entries(sc).map(([id, c]) => el('span', { class: 'pk-chip small' },
          `${c.name || PS.Dex.conditions.get(id).name || id}${c.level > 1 ? ` ×${c.level}` : ''}`)))
      }
    }

    function renderField() {
      if (four) {
        for (const s of SHOWDOWN_FOUR) {
          const poke = shown(s) ? fieldMon(s) : null
          const at = placeOf(s)
          setSprite(sprites[at.s][at.i], poke, at.s === side)
          infoBox(boxes[at.s][at.i], poke, at.s === side, at.i, s)
        }
        for (const s of ['p1', 'p2']) drawBallsFour(balls[s], s)
        drawConditions()
        return
      }
      // Nobody is out yet during team preview.
      const previewing = !!request && request.requestType === 'team'
      for (const s of ['p1', 'p2']) {
        const sideObj = battle[s]
        if (!sideObj) continue
        for (const i of slots) {
          let poke = previewing ? null : sideObj.active[i]
          if (poke) lastShown[s][i] = poke
          // A fainted Pokémon leaves its slot empty; keep showing it, greyed
          // out, until the next one comes in.
          else if (lastShown[s][i] && lastShown[s][i].fainted) poke = lastShown[s][i]
          setSprite(sprites[s][i], poke, s === side)
          infoBox(boxes[s][i], poke, s === side, i)
        }
        drawBalls(balls[s], sideObj, s)
      }
      drawConditions()
    }
    for (const s of ['p1', 'p2']) for (const i of slots) {
      const box = boxes[s][i]
      box.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && box._tip) showTip(box, box._tip()) })
      box.addEventListener('pointerleave', hideTip)
      box.addEventListener('click', () => { if (!box._tip) return; if (tip.hidden) showTip(box, box._tip()); else hideTip() })
    }

    function animate(ident, cls) {
      const at = placeOf(ident)
      if (!at) return
      const img = sprites[at.s][at.i]
      if (!img) return
      img.classList.remove(cls)
      void img.offsetWidth
      img.classList.add(cls)
    }

    // ── Bar ──
    function fmtTime(ms) {
      const s = Math.ceil(ms / 1000)
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
    }
    function renderBar() {
      const t = timer
      const now = Date.now()
      const left = k => (t && t[k] !== null && t[k] !== undefined ? Math.max(0, t[k] - (now - t.at)) : null)
      const mineLeft = left(four ? player : 'p1')
      const foeLeft = left('p2')
      const seated = SHOWDOWN_FOUR.filter(shown)
      const everyone = seated.map(s => (s === player && !spectator ? 'You' : nameOf(s)))
      pkFill(bar, 
        el('span', { class: 'pk-format' }, showdownFormatName(info.format)),
        info.banner && el('span', { class: 'pill pk-tower-pill' }, info.banner),
        turn > 0 && el('span', { class: 'pill' }, `Turn ${turn}`),
        spectator && el('span', { class: 'pill' }, four ? `👀 ${multi ? `${nameOf('p1')} & ${nameOf('p3')} vs ${nameOf('p2')} & ${nameOf('p4')}` : everyone.join(' · ')}` : `👀 ${info.me} vs ${info.foe}`),
        t && t.on && four && el('span', { class: `pill ${!spectator && mineLeft !== null && mineLeft < 30000 ? 'pk-hurry' : ''}` },
          `⏱ ${seated.map((s, i) => `${everyone[i]} ${left(s) === null ? '—' : fmtTime(left(s))}`).join(' · ')}`),
        t && t.on && !four && el('span', { class: `pill ${mineLeft !== null && mineLeft < 30000 ? 'pk-hurry' : ''}` }, `⏱ ${spectator ? info.me : 'You'} ${mineLeft === null ? '—' : fmtTime(mineLeft)} · ${info.foe} ${foeLeft === null ? '—' : fmtTime(foeLeft)}`),
        el('span', { class: 'grow' }),
        io.timer && !result && el('button', { type: 'button', class: 'chip', onClick: () => io.timer(!(t && t.on)) }, t && t.on ? 'Timer on' : 'Timer off'),
        !spectator && el('button', { type: 'button', class: `chip ${coach ? 'on' : ''}`, title: 'Show how each move matches up, and suggest one', onClick: () => { coach = !coach; pkStore.set('coach', coach); renderBar(); renderControls() } }, '💡 Coach'),
        el('button', { type: 'button', class: 'chip', title: 'Sound', onClick: () => { setSound(!sound.on); renderBar() } }, sound.on ? '🔊' : '🔇'),
        (() => {
          const s = el('select', { class: 'pk-speed', title: 'Speed', onChange: e => { speed = e.target.value; pkStore.set('speed', speed) } },
            [['normal', 'Normal speed'], ['fast', 'Fast'], ['instant', 'Instant']].map(([v, l]) => el('option', { value: v }, l)))
          s.value = speed
          return s
        })(),
        el('button', { type: 'button', class: 'chip', onClick: downloadReplay }, 'Replay ⤓'),
        !spectator && !result && io.forfeit && el('button', { type: 'button', class: 'chip pk-forfeit', onClick: async () => {
          if (!(await ask('Forfeit this battle?', 'Forfeit'))) return
          io.forfeit()
          // In a free-for-all the other three play on without you.
          if (four && !multi) finish('lose', null, 'You forfeited')
        } }, 'Forfeit'))
    }

    // Showdown's own replay format: open the file and Showdown's replay
    // player plays it back.
    function downloadReplay() {
      const names = four ? SHOWDOWN_FOUR.filter(shown).map(nameOf).join(multi ? ' & ' : ' vs. ').replace(/^(.*?) & (.*?) & (.*?) & (.*)$/, '$1 & $3 vs. $2 & $4') : `${info.me} vs. ${info.foe}`
      const data = rawLog.join('\n').replace(/<[/]/g, '<\\/')
      const html = `<!DOCTYPE html>\n<meta charset="utf-8" />\n<title>${showdownFormatName(info.format)} replay: ${names}</title>\n` +
        '<div class="wrapper replay-wrapper" style="max-width:1180px;margin:0 auto">\n<input type="hidden" name="replayid" value="debrod" />\n' +
        '<div class="battle"></div><div class="battle-log"></div><div class="replay-controls"></div><div class="replay-controls-2"></div>\n' +
        `<h1 style="font-weight:normal;text-align:center"><strong>${showdownFormatName(info.format)}</strong><br />${names}</h1>\n` +
        `<script type="text/plain" class="battle-log-data">${data}</` + 'script>\n</div>\n' +
        `<script>let daily = Math.floor(Date.now()/1000/60/60/24);document.write('<script src="${SHOWDOWN_SITE}js/replay-embed.js?version'+daily+'"></'+'script>');</` + 'script>\n'
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }))
      // _self: the page's <base target="_top"> would otherwise turn the download into a navigation.
      const a = el('a', { href: url, target: '_self', download: `${info.format}-${four ? SHOWDOWN_FOUR.map(s => PS.toID(nameOf(s))).join('-') : `${PS.toID(info.me)}-${PS.toID(info.foe)}`}.html` })
      document.body.append(a)
      a.click()
      a.remove()
      setTimeout(() => URL.revokeObjectURL(url), 10000)
    }

    // ── Controls ──
    const activeMons = () => (request && request.side ? request.side.pokemon.slice(0, decide.length) : [])
    const typeOf = id => PS.Dex.moves.get(id).type || 'Normal'

    const genDex = () => PS.Dex.forGen((battle.gen && battle.gen.num) || 9)
    // A Pokémon's types. The battle's own data throws for species it doesn't
    // have (Pidgeot or Mawile from a Mega format, in a Gen 9 battle), so fall
    // back on the full Pokédex.
    function monTypes(f) {
      let types = null
      try { types = f.types } catch (e) { /* species missing from this gen's data */ }
      return types && types.length ? types : genDex().species.get(f.speciesForme).types
    }
    // How a move fares against each Pokémon across the field (null for
    // status moves).
    function matchup(id) {
      const dex = genDex()
      const move = dex.moves.get(id)
      if (!move.exists || move.category === 'Status') return null
      const foes = four ? opponents().map(fieldMon) : slots.map(i => battle[foeSide].active[i])
      return foes.filter(f => f && !f.fainted).map(f => {
        const types = monTypes(f)
        if (!dex.getImmunity(move.type, types)) return 0
        return Math.pow(2, dex.getEffectiveness(move.type, types))
      })
    }
    function moveScore(id, slot) {
      const dex = genDex()
      const move = dex.moves.get(id)
      if (!move.exists) return 0
      if (move.category === 'Status') return 25
      const mine = myLive(slot)
      const stab = mine && monTypes(mine).includes(move.type) ? 1.5 : 1
      const best = Math.max(0, ...(matchup(id) || [1]))
      return (move.basePower || 70) * stab * best * (move.accuracy === true ? 1 : move.accuracy / 100)
    }
    const multLabel = x => (x === 0 ? 'No effect' : x >= 4 ? '×4' : x >= 2 ? '×2' : x <= 0.25 ? '×¼' : x < 1 ? '×½' : '×1')

    function moveButton(m, j, slot, active, isBest) {
      let label = m.name || PS.Dex.moves.get(m.id).name
      let id = m.id
      let disabled = !!m.disabled
      const live = myLive(slot)
      const dynamaxed = live && live.volatiles && live.volatiles.dynamax
      if (mech === 'zmove') {
        const z = active.zMoves && active.zMoves[j]
        if (z) { label = z.name; id = z.id } else disabled = true
      } else if ((mech === 'dynamax' || dynamaxed) && active.maxMoves && active.maxMoves[j]) {
        id = active.maxMoves[j].move || active.maxMoves[j].id
        label = PS.Dex.moves.get(id).name
      }
      const type = typeOf(id)
      const mu = coach ? matchup(id) : null
      const shown = mu && mu.length ? mu : null
      const b = el('button', {
        type: 'button', class: `pk-move ${coach && isBest ? 'best' : ''}`, disabled: disabled || waiting,
        style: `--type: ${TYPE_COLORS[type] || '#888'}`,
        onClick: () => chooseMove(slot, j, m, active),
      },
        el('span', { class: 'pk-move-name' }, label, coach && isBest && el('span', { class: 'pk-best' }, ' 💡')),
        el('span', { class: 'pk-move-meta' }, `${type}${m.maxpp ? ` · ${m.pp}/${m.maxpp}` : ''}`),
        shown && el('span', { class: 'pk-eff' }, shown.map(x => el('span', { class: x === 0 ? 'imm' : x > 1 ? 'se' : x < 1 ? 'nve' : 'neu' }, multLabel(x)))))
      return tippable(b, () => moveTip(id, m.maxpp ? `PP ${m.pp}/${m.maxpp}` : ''))
    }

    function chooseMove(slot, j, m, active) {
      const target = m.target
      const needsTarget = doubles && ['normal', 'any', 'adjacentFoe', 'adjacentAlly', 'adjacentAllyOrSelf'].includes(target) && mech !== 'dynamax'
      if (needsTarget) {
        targeting = { slot, j, target, mech }
        return renderControls()
      }
      commit(slot, `move ${j + 1}${mech ? ` ${mech}` : ''}`)
    }

    function teamButton(p, i, enabled, onPick) {
      const id = PS.Dex.species.get(p.speciesForme).spriteid || PS.toID(p.speciesForme)
      const frac = p.maxhp ? p.hp / p.maxhp : 0
      const tera = p.terastallized || ''
      const b = el('button', {
        type: 'button', class: `pk-mon ${p.fainted ? 'out' : ''} ${p.active ? 'active' : ''} ${tera ? 'tera' : ''}`, disabled: !enabled || waiting,
        style: tera ? `--tera: ${teraColor(tera)}` : '',
        onClick: () => (onPick ? onPick() : null),
      },
        el('img', { src: `${SHOWDOWN_SPRITES}gen5/${id}.png`, alt: '', loading: 'lazy', onError: e => { e.target.style.visibility = 'hidden' } }),
        el('span', { class: 'pk-mon-name' }, tera && el('span', { class: 'pk-mon-tera', title: `Terastallized into ${tera}` }, '💎 '), p.name),
        el('span', { class: `pk-mon-hp ${hpClass(frac)}` }, p.fainted ? 'fainted' : `${Math.round(frac * 100)}%`))
      return tippable(b, () => myTip(p))
    }

    // Which slots still need a decision this turn.
    function slotsToDecide() {
      if (!request) return []
      if (request.requestType === 'switch') return decide.filter(i => request.forceSwitch && request.forceSwitch[i])
      if (request.requestType === 'move') return decide.filter(i => request.active && request.active[i] && !(request.side.pokemon[i] || {}).commanding)
      return []
    }

    function commit(slot, choice) {
      pending[slot] = choice
      targeting = null
      mech = ''
      const left = slotsToDecide().filter(i => pending[i] === undefined)
      if (left.length) return renderControls()
      const all = decide.map(i => (pending[i] !== undefined ? pending[i] : 'pass'))
      send(all.length > 1 ? all.join(', ') : all[0])
    }

    function send(choice) {
      if (waiting || result) return
      waiting = true
      renderControls()
      io.choose(choice)
    }

    function renderControls() {
      hideTip()
      if (result) {
        pkFill(controls, el('div', { class: 'row pk-end' },
          io.again && el('button', { type: 'button', class: 'primary', onClick: io.again }, io.againLabel ? io.againLabel(result) : info.online ? 'Rematch' : 'Battle again'),
          info.online && !io.again && !spectator && el('p', { class: 'muted small' }, 'The host can start a rematch.'),
          el('button', { type: 'button', onClick: downloadReplay }, 'Download replay'),
          el('button', { type: 'button', onClick: io.back }, '‹ Back')))
        return
      }
      if (spectator) {
        pkFill(controls, el('div', { class: 'row pk-wait' },
          el('p', { class: 'muted' }, four ? `Watching ${SHOWDOWN_FOUR.filter(shown).map(nameOf).join(', ')}.` : `Watching ${info.me} and ${info.foe}.`),
          el('button', { type: 'button', class: 'link', onClick: io.back }, 'Leave')))
        return
      }
      if (!request || request.requestType === 'wait' || waiting || pumping || nextRequest) {
        const canCancel = waiting && request && request.requestType !== 'wait' && !pumping
        pkFill(controls, el('div', { class: 'row pk-wait' },
          el('p', { class: 'muted' }, !request ? 'Starting the battle…' : pumping ? '…' : four && fieldMon(player) && fieldMon(player).fainted && request.requestType === 'wait' && !(request.side.pokemon || []).some(p => !p.fainted) ? 'You\'re out. Watching the rest…' : `Waiting for ${four ? 'the others' : info.foe}…`),
          canCancel && el('button', { type: 'button', onClick: () => { waiting = false; pending = []; io.choose('undo'); renderControls() } }, 'Cancel'),
          el('button', { type: 'button', class: 'link', onClick: io.back }, 'Leave')))
        return
      }
      const team = request.side.pokemon
      if (request.requestType === 'team') {
        const size = request.maxChosenTeamSize || team.length
        const foeTeam = (battle[foeSide] && battle[foeSide].team) || []
        pkFill(controls, 
          el('p', { class: 'pk-prompt' }, size < team.length
            ? `Choose ${size} to bring, in order${doubles ? ' (the first two lead)' : ''}. ${preview.length}/${size}`
            : `Pick your lead${doubles ? 's' : ''}, then start.`),
          foeTeam.length && el('div', { class: 'pk-foe-preview' }, el('span', { class: 'muted small' }, `${info.foe}'s team: `),
            foeTeam.map(p => tippable(el('img', { src: `${SHOWDOWN_SPRITES}gen5/${PS.Dex.species.get(p.speciesForme).spriteid}.png`, alt: p.speciesForme, title: p.speciesForme }), () => foeTip(p)))),
          el('div', { class: 'pk-team' }, team.map((p, i) => {
            const at = preview.indexOf(i)
            const b = teamButton(p, i, true, () => {
              if (at >= 0) preview.splice(at, 1)
              else if (preview.length < size) preview.push(i)
              renderControls()
            })
            if (at >= 0) { b.classList.add('picked'); b.dataset.order = String(at + 1) }
            return b
          })),
          el('div', { class: 'row' },
            el('button', { type: 'button', class: 'primary', disabled: size < team.length ? preview.length !== size : !preview.length, onClick: () => {
              const order = preview.slice()
              if (size >= team.length) for (let i = 0; i < team.length; i++) if (!order.includes(i)) order.push(i)
              preview = []
              send(`team ${order.map(i => i + 1).join('')}`)
            } }, 'Start'),
            size >= team.length && el('button', { type: 'button', onClick: () => { preview = []; send('default') } }, 'Keep this order')))
        return
      }
      const todo = slotsToDecide().filter(i => pending[i] === undefined)
      const slot = todo[0]
      if (slot === undefined) return
      const now = team[slot]
      const back = doubles && todo.length < slotsToDecide().length && el('button', { type: 'button', class: 'link', onClick: () => { pending = []; targeting = null; mech = ''; renderControls() } }, '‹ Redo this turn')
      const chosenSwitches = new Set(pending.filter(c => c && c.startsWith('switch ')).map(c => Number(c.split(' ')[1]) - 1))

      if (request.requestType === 'switch') {
        // In doubles you can be asked to fill two slots with only one
        // Pokémon left; the other slot passes.
        const options = team.filter((p, i) => !p.active && !p.fainted && !chosenSwitches.has(i))
        if (!options.length) return commit(slot, 'pass')
        pkFill(controls, 
          el('p', { class: 'pk-prompt' }, doubles ? `Send in a Pokémon for ${now ? now.name : `slot ${slot + 1}`}.` : 'Choose a Pokémon to send in.'),
          el('div', { class: 'pk-team' }, team.map((p, i) => teamButton(p, i, !p.active && !p.fainted && !chosenSwitches.has(i), () => commit(slot, `switch ${i + 1}`)))),
          back)
        return
      }

      const active = request.active[slot]
      if (targeting && targeting.slot === slot) {
        const t = targeting.target
        const opts = []
        const foeActive = battle[foeSide].active
        if (four) {
          // Everyone else on the field, by where they stand.
          const ally = allyOf()
          for (const s of others()) {
            const ok = ['normal', 'any'].includes(t) || (t === 'adjacentFoe' && s !== ally) || (['adjacentAlly', 'adjacentAllyOrSelf'].includes(t) && s === ally)
            if (!ok) continue
            const p = fieldMon(s)
            opts.push({ label: p ? `${p.name} (${s === ally ? 'your partner' : nameOf(s)})` : nameOf(s), n: targetLoc(s), ok: !!p && !p.fainted })
          }
          if (t === 'adjacentAllyOrSelf') opts.push({ label: `${now.name} (itself)`, n: targetLoc(player), ok: true })
          if (!opts.length) return commit(slot, `move ${targeting.j + 1}${targeting.mech ? ` ${targeting.mech}` : ''}`)
        } else if (['normal', 'any', 'adjacentFoe'].includes(t)) {
          for (const i of slots) opts.push({ label: foeActive[i] ? `${foeActive[i].name} (theirs)` : `Their slot ${i + 1}`, n: i + 1, ok: !!foeActive[i] && !foeActive[i].fainted })
        }
        if (!four && ['normal', 'any', 'adjacentAlly', 'adjacentAllyOrSelf'].includes(t)) {
          const ally = slot ^ 1
          if (team[ally]) opts.push({ label: `${team[ally].name} (yours)`, n: -(ally + 1), ok: !team[ally].fainted })
        }
        if (!four && t === 'adjacentAllyOrSelf') opts.push({ label: `${now.name} (itself)`, n: -(slot + 1), ok: true })
        pkFill(controls, 
          el('p', { class: 'pk-prompt' }, `${PS.Dex.moves.get(active.moves[targeting.j].id).name}: who should ${now.name} target?`),
          el('div', { class: 'pk-targets' }, opts.map(o => el('button', { type: 'button', disabled: !o.ok, onClick: () => commit(slot, `move ${targeting.j + 1} ${o.n}${targeting.mech ? ` ${targeting.mech}` : ''}`) }, o.label))),
          el('button', { type: 'button', class: 'link', onClick: () => { targeting = null; renderControls() } }, '‹ Pick a different move'))
        return
      }

      const used = new Set(pending.map(c => (c || '').split(' ').pop()))
      const mechs = [
        active.canTerastallize && ['terastallize', `Terastallize (${active.canTerastallize})`, TYPE_COLORS[active.canTerastallize]],
        active.canMegaEvo && ['mega', 'Mega Evolve', '#ff7a1a'],
        active.canUltraBurst && ['ultra', 'Ultra Burst', '#ffd319'],
        active.canZMove && ['zmove', 'Z-Move', '#00f0ff'],
        active.canDynamax && ['dynamax', active.canGigantamax ? 'Gigantamax' : 'Dynamax', '#ff2bd6'],
      ].filter(Boolean).filter(([key]) => !used.has(key))
      const trapped = active.trapped || active.maybeTrapped
      pkFill(controls, 
        el('p', { class: 'pk-prompt' }, `What will ${now ? now.name : 'your Pokémon'} do?`),
        el('div', { class: 'pk-moves' }, (() => {
          const scores = active.moves.map((m, j) => (m.disabled ? -1 : moveScore(mech === 'zmove' && active.zMoves && active.zMoves[j] ? active.zMoves[j].id : m.id, slot)))
          const best = scores.indexOf(Math.max(...scores))
          return active.moves.map((m, j) => moveButton(m, j, slot, active, j === best))
        })()),
        mechs.length && el('div', { class: 'row pk-mechs' }, mechs.map(([key, label, color]) => el('label', { class: 'pk-tera', style: `--type: ${color || '#888'}` },
          el('input', { type: 'checkbox', checked: mech === key, onChange: e => { mech = e.target.checked ? key : ''; renderControls() } }), ` ${label}`))),
        el('p', { class: 'muted small pk-switch-label' }, trapped ? 'You can\'t switch out right now.' : 'Switch'),
        el('div', { class: 'pk-team' }, team.map((p, i) => teamButton(p, i, !trapped && !p.active && !p.fainted && !chosenSwitches.has(i), () => commit(slot, `switch ${i + 1}`)))),
        back)
    }

    // ── The log ──
    // The formatter writes **bold** and ||exact||rounded|| for HP; we show
    // the rounded part, like the Showdown client does for the other side.
    function addText(text, cls) {
      for (const raw of text.split('\n')) {
        if (!raw.trim()) continue
        const t = /^== Turn (\d+) ==$/.exec(raw.trim())
        if (t) { log.append(el('p', { class: 'pk-turn' }, `Turn ${t[1]}`)); continue }
        const clean = raw.replace(/\|\|([^|]*)\|\|([^|]*)\|\|/g, '$2')
        const parts = clean.trim().split('**')
        log.append(el('p', { class: cls || (raw.startsWith('  ') ? 'minor' : '') }, parts.map((x, i) => (i % 2 ? el('strong', null, x) : x))))
      }
      while (log.children.length > 600) log.firstChild.remove()
      log.scrollTop = log.scrollHeight
    }

    const DELAYS = { move: 750, switch: 650, drag: 650, replace: 500, faint: 650, '-damage': 350, '-heal': 300, turn: 250, '-terastallize': 600, '-mega': 600, '-zpower': 500, '-start': 150, '-boost': 150, '-unboost': 150, '-status': 200, '-weather': 200 }
    const sleep = ms => new Promise(r => setTimeout(r, ms))

    // One protocol line: update the battle, write the log, and say how
    // long to linger on it.
    function handle(line) {
      if (line.startsWith('|request|')) { if (line.length > 9) nextRequest = line.slice(9); return 0 }
      if (line.startsWith('|error|')) {
        addText(`  ${line.slice(7).replace(/^\[[^\]]*\]\s*/, '')}`, 'pk-error')
        waiting = false
        pending = []
        targeting = null
        return 0
      }
      rawLog.push(line)
      let delay = 0
      for (const { args, kwArgs } of PS.Protocol.parse(line)) {
        let text = ''
        const kind = args[0]
        let before = null
        if (kind === '-damage' || kind === '-heal') {
          const pk = battle.getPokemon(args[1])
          before = pk && pk.maxhp ? pk.hp / pk.maxhp : null
        }
        try { text = fmt.formatText(args, kwArgs) } catch (e) { /* unformatted line */ }
        battle.add(args, kwArgs)
        if (text) addText(text)
        try { effects(kind, args, kwArgs, before) } catch (e) { /* effects are only decoration */ }
        if (four && ['switch', 'drag', 'replace'].includes(kind)) onField[String(args[1]).slice(0, 2)] = String(args[1])
        if (kind === 'switch' || kind === 'drag') { cry(String(args[2] || '').split(',')[0]); setTimeout(() => animate(args[1], 'enter'), 0) }
        if (kind === '-damage') animate(args[1], 'hit')
        if (kind === 'turn') turn = Number(args[1]) || turn
        if (kind === '-terastallize') {
          teraUsed[sideOf(args[1])] = { type: args[2], name: String(args[1]).split(': ').slice(1).join(': ') }
          teraMons[monKey(args[1])] = args[2]
        }
        // A Multi win names both partners: "A & B".
        if (kind === 'win') finish((four ? String(args[1]).split(' & ') : [args[1]]).includes(battle[player] && battle[player].name) ? 'win' : 'lose', args[1])
        if (kind === 'tie') finish('tie')
        delay = Math.max(delay, DELAYS[kind] || 0)
      }
      return delay
    }

    async function pump() {
      if (pumping) return
      pumping = true
      while (queue.length && !destroyed) {
        const delay = handle(queue.shift())
        const factor = speed === 'instant' ? 0 : speed === 'fast' ? 0.35 : 1
        if (delay && factor && queue.length) {
          renderField()
          renderBar()
          await sleep(delay * factor)
        }
      }
      pumping = false
      if (destroyed) return
      if (nextRequest) {
        request = PS.Protocol.parseRequest(nextRequest)
        nextRequest = null
        battle.update(request)
        waiting = false
        pending = []
        mech = ''
        targeting = null
        preview = []
      }
      renderField()
      renderBar()
      renderControls()
    }

    function feed(chunk) {
      if (destroyed) return
      for (const line of chunk.split('\n')) if (line) queue.push(line)
      pump()
    }

    // Who carried the battle: damage dealt (in % of HP) and KOs.
    function summary() {
      const rows = Object.values(credits).filter(c => spectator || c.side === player)
      if (!rows.length) return null
      const score = c => c.dealt + c.kos * 40
      rows.sort((a, b) => score(b) - score(a))
      const mvp = rows[0]
      return el('div', { class: 'pk-summary' },
        el('p', { class: 'pk-mvp' }, `MVP: ${mvp.name}`, el('span', { class: 'muted small' }, ` · ${Math.round(mvp.dealt)}% damage · ${mvp.kos} KO${mvp.kos === 1 ? '' : 's'}`)),
        el('div', { class: 'pk-summary-rows' }, rows.slice(1, 6).map(c => el('span', { class: 'muted small' }, `${c.name} ${Math.round(c.dealt)}% · ${c.kos} KO`))))
    }

    function finish(kind, who, title) {
      if (result) return
      result = kind
      music(false)
      banner.hidden = false
      pkFill(banner, 
        el('p', { class: 'wordmark' }, title || (spectator ? `${who || 'Nobody'} won` : kind === 'win' ? 'You won!' : kind === 'lose' ? `${who} won` : 'It\'s a tie')),
        el('p', { class: 'muted small' }, spectator ? 'GG.' : kind === 'win' ? 'GG.' : kind === 'lose' ? 'Better luck next time.' : 'Nobody\'s left standing.'),
        summary())
      if (kind === 'win' && !spectator) for (let i = 0; i < 8; i++) setTimeout(() => floatEmote(pick(['🎉', '✨', '🏆', '🔥'])), i * 140)
      if (io.onFinish) io.onFinish(kind)
      if (!spectator) {
        const rec = pkStore.get('record', {})
        const r = rec[info.format] || { w: 0, l: 0, t: 0 }
        r[kind === 'win' ? 'w' : kind === 'lose' ? 'l' : 't']++
        rec[info.format] = r
        pkStore.set('record', rec)
        report(info, kind)
      }
    }

    renderField()
    renderBar()
    renderControls()
    return {
      feed,
      over: () => !!result,
      notice: text => addText(`  ${text}`, 'pk-note'),
      emote: e => floatEmote(e),
      chat: (who, text) => addText(`${who}: ${text}`, 'pk-chatline'),
      timer(state) {
        timer = Object.assign({ at: Date.now() }, state)
        clearInterval(timerTick)
        timerTick = state && state.on ? setInterval(renderBar, 1000) : null
        renderBar()
      },
      destroy() {
        destroyed = true
        clearInterval(timerTick)
        hideTip()
      },
    }
  }

  // Opened from an invite link with a name we already know: straight in.
  if (opts && opts.code && name && canOnline) online(String(opts.code).toUpperCase(), 'guest')
  else menu()

  return {
    stop() {
      dead = true
      endMatch()
      leaveNet()
    },
  }
}

</script>
