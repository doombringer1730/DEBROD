<script>
// Pokémon Showdown in the arcade: Showdown's own battle simulator (MIT,
// bundled from the @pkmn packages in showdown/) running in the page, since
// play.pokemonshowdown.com won't load inside other sites.
//
// - Formats: Random Battles for every generation, Random Doubles, and
//   bring-your-own-team formats (OU, Ubers, Doubles OU, VGC and more),
//   checked by Showdown's own team validator.
// - Free-for-all battles for three or four, and 2 vs 2 Multi battles,
//   against CPUs or friends (the host's page runs those too, with the CPU in
//   any empty seat).
// - Mega Evolution formats, where every trainer gets a Mega, and Draft
//   Champions, a Free-for-all draft whose pool has Mega Stone holders
//   (one each at most), in the spirit of Pokémon Champions.
// - Random Pokémon (random battles, drafts, the tower) are sometimes shiny.
// - A team builder with Showdown's import/export text, saved in this
//   browser.
// - Battles against the CPU, or against a friend over Supabase Realtime:
//   the host's page runs the battle, forwards the guest their side (and
//   spectators the public view), and runs the optional turn timer.
//
// Loaded before Games.html (which lists it) and after App.html, whose el(),
// S, randomId(), storedName(), storeName() and copyText() it uses.

const SHOWDOWN_BASE = 'https://cdn.jsdelivr.net/gh/doombringer1730/DEBROD@85b6adb30c49bd1c0e526114038fba7a6850349b/apps-script/showdown/'
const SHOWDOWN_SITE = 'https://play.pokemonshowdown.com/'
const SHOWDOWN_SPRITES = `${SHOWDOWN_SITE}sprites/`
const SHOWDOWN_FORMATS = [
  ['DEBROD exclusives', [
    ['debrod-draft', 'Draft Battle (snake draft, then battle)'],
    ['debrod-draftdoubles', 'Draft Doubles'],
    ['debrod-draftfreeforall', 'Draft Free-for-all (4 players)'],
    ['debrod-draftfreeforall3', 'Draft Free-for-all (3 players)'],
    ['debrod-draftmulti', 'Draft Multi (2 vs 2)'],
    ['debrod-draftchampionsfreeforall', 'Draft Champions (Free-for-all, 4 players, Megas in the pool)'],
    ['debrod-draftchampionsfreeforall3', 'Draft Champions (Free-for-all, 3 players)'],
    ['debrod-tower', 'Battle Tower (a streak against the CPU)'],
  ]],
  ['Group battles', [
    ['gen9freeforallrandombattle', 'Free-for-all Random Battle (4 players, last one standing)'],
    ['debrod-freeforall3', 'Free-for-all Random Battle (3 players)'],
    ['gen9multirandombattle', 'Multi Random Battle (2 vs 2, one Pokémon each)'],
  ]],
  ['Mega Evolution', [
    ['debrod-mega', 'Mega Random Battle (everyone gets a Mega)'],
    ['debrod-megafreeforall', 'Mega Free-for-all (4 players)'],
    ['debrod-megafreeforall3', 'Mega Free-for-all (3 players)'],
    ['debrod-megamulti', 'Mega Multi (2 vs 2)'],
  ]],
  ['Random battles', [
    ['gen9randombattle', 'Gen 9 Random Battle'],
    ['gen9randomdoublesbattle', 'Gen 9 Random Doubles'],
    ['gen9babyrandombattle', 'Gen 9 Baby Random Battle'],
    ['gen9challengecup1v1', 'Gen 9 Challenge Cup 1v1'],
    ['gen9hackmonscup', 'Gen 9 Hackmons Cup'],
    ['gen8randombattle', 'Gen 8 Random Battle'],
    ['gen7randombattle', 'Gen 7 Random Battle'],
    ['gen6randombattle', 'Gen 6 Random Battle'],
    ['gen5randombattle', 'Gen 5 Random Battle'],
    ['gen4randombattle', 'Gen 4 Random Battle'],
    ['gen3randombattle', 'Gen 3 Random Battle'],
    ['gen2randombattle', 'Gen 2 Random Battle'],
    ['gen1randombattle', 'Gen 1 Random Battle'],
  ]],
  ['Bring your own team', [
    ['gen9ou', 'Gen 9 OU'],
    ['gen9ubers', 'Gen 9 Ubers'],
    ['gen9uu', 'Gen 9 UU'],
    ['gen9ru', 'Gen 9 RU'],
    ['gen9nu', 'Gen 9 NU'],
    ['gen9lc', 'Gen 9 LC'],
    ['gen9monotype', 'Gen 9 Monotype'],
    ['gen9nationaldex', 'Gen 9 National Dex'],
    ['gen91v1', 'Gen 9 1v1'],
    ['gen9anythinggoes', 'Gen 9 Anything Goes'],
    ['gen9doublesou', 'Gen 9 Doubles OU'],
    ['gen9vgc2025regi', 'Gen 9 VGC 2025 Reg I'],
    ['gen9bssregi', 'Gen 9 Battle Stadium Singles Reg I'],
    ['gen9customgame', 'Gen 9 Custom Game'],
    ['gen9doublescustomgame', 'Gen 9 Doubles Custom Game'],
  ]],
]
const SHOWDOWN_TEAM_FORMATS = SHOWDOWN_FORMATS.find(([group]) => group === 'Bring your own team')[1]
// DEBROD's own modes run on Showdown's custom-game rules, plus the usual
// clauses.
const SHOWDOWN_CLAUSES = 'Sleep Clause Mod,Species Clause,OHKO Clause,Evasion Moves Clause'
const SHOWDOWN_SIM_FORMATS = {
  'debrod-draft': `gen9customgame@@@${SHOWDOWN_CLAUSES}`,
  'debrod-draftdoubles': 'gen9doublescustomgame@@@Species Clause,OHKO Clause,Evasion Moves Clause',
  'debrod-tower': `gen9customgame@@@${SHOWDOWN_CLAUSES}`,
  'debrod-draftfreeforall': 'gen9freeforallrandombattle',
  'debrod-draftfreeforall3': 'gen9freeforallrandombattle',
  'debrod-draftmulti': 'gen9multirandombattle',
  'debrod-draftchampionsfreeforall': 'gen9freeforallrandombattle',
  'debrod-draftchampionsfreeforall3': 'gen9freeforallrandombattle',
  'debrod-freeforall3': 'gen9freeforallrandombattle',
  // Mega singles runs on Gen 7, where its sets come from; the group ones
  // are Gen 9 battles with a Mega slipped into each team.
  'debrod-mega': `gen7customgame@@@${SHOWDOWN_CLAUSES},HP Percentage Mod,!Team Preview`,
  'debrod-megafreeforall': 'gen9freeforallrandombattle',
  'debrod-megafreeforall3': 'gen9freeforallrandombattle',
  'debrod-megamulti': 'gen9multirandombattle',
}
// One random Pokémon in this many comes out shiny (Gen 2 on).
const SHOWDOWN_SHINY_ODDS = 16
const SHOWDOWN_TOWER_TRAINERS = ['Ace Trainer Nova', 'Rocker Vex', 'Psychic Luna', 'Black Belt Kenji', 'Ace Trainer Iris', 'Dragon Tamer Ryu', 'Tower Tycoon Orion']
const SHOWDOWN_EMOTES = ['🔥', '😂', '😱', '👏', '💀', '🎉', '🤔', '😤']
const SHOWDOWN_DRAFT_POOL = 16
const SHOWDOWN_DRAFT_PICKS = 6
const SHOWDOWN_DRAFT_MS = 45000
// Four drafting take four each from a bigger pool.
const SHOWDOWN_DRAFT_FOUR = { pool: 24, picks: 4 }
const SHOWDOWN_MUSIC = ['bw-trainer', 'bw-rival', 'bw2-rival', 'dpp-trainer', 'hgss-johto-trainer', 'xy-trainer', 'xy-rival', 'oras-trainer', 'sm-trainer', 'sm-rival']
const TYPE_COLORS = {
  Normal: '#a8a77a', Fire: '#ee8130', Water: '#6390f0', Electric: '#f7d02c', Grass: '#7ac74c', Ice: '#96d9d6',
  Fighting: '#c22e28', Poison: '#a33ea1', Ground: '#e2bf65', Flying: '#a98ff3', Psychic: '#f95587', Bug: '#a6b91a',
  Rock: '#b6a136', Ghost: '#735797', Dragon: '#6f35fc', Dark: '#705746', Steel: '#b7b7ce', Fairy: '#d685ad', Stellar: '#40b5a5',
  '???': '#68a090',
}
const STAT_NAMES = { hp: 'HP', atk: 'Atk', def: 'Def', spa: 'SpA', spd: 'SpD', spe: 'Spe' }
const SHOWDOWN_TIMER_MS = 150000
// Four-player battles: p1 and p3 share one half of the field, p2 and p4 the
// other (in Multi they're the teams). A seat nobody takes is the CPU's, and
// the CPU takes over for anyone who's gone this long mid-battle.
const SHOWDOWN_FOUR = ['p1', 'p2', 'p3', 'p4']
// Three-player free-for-alls are four-player ones whose fourth seat (a
// single Pokémon) forfeits as the battle starts.
const SHOWDOWN_GHOST = 'p4'
const SHOWDOWN_GHOST_NAME = 'Empty seat'
const SHOWDOWN_CPU_NAMES = { p2: 'CPU Kai', p3: 'CPU Mae', p4: 'CPU Zed' }

// How hard the CPU plays (cpuChoice). Easy mostly picks at random and never
// switches on purpose; Normal goes for super-effective hits; Hard and
// Expert estimate real damage, go for knockouts, use status moves only when
// they help and switch to whoever matches up best. Expert never makes a
// random pick and steers around abilities that absorb its moves.
const SHOWDOWN_LEVELS = [
  ['easy', 'Easy', 'Picks moves almost at random and never switches on purpose. Good for learning.'],
  ['normal', 'Normal', 'Goes for super-effective hits, most of the time.'],
  ['hard', 'Hard', 'Works out real damage, goes for knockouts, uses status moves when they help and switches smartly.'],
  ['expert', 'Expert', 'Hard, minus the mistakes: its best move every turn, and it won\'t walk into Levitate or Water Absorb.'],
]
const SHOWDOWN_BRAINS = {
  easy: { skill: 0.3, smart: false, switchy: 0, mech: 0 },
  normal: { skill: 0.8, smart: false, switchy: 0.6, mech: 0.3 },
  hard: { skill: 0.92, smart: true, switchy: 0.75, mech: 0.6 },
  expert: { skill: 1, smart: true, switchy: 0.9, mech: 1, abilities: true },
}
// Looks for the battle screen (styled in Themes.html), and the accent
// colours on offer. Game Boy keeps its own four greens.
const SHOWDOWN_LOOKS = [
  ['neon', 'Neon', 'linear-gradient(90deg, #ff2bd6, #00f0ff)'],
  ['dex', 'Pokédex', 'linear-gradient(90deg, #dc0a2d 0 60%, #f6f4ef 60%)'],
  ['stadium', 'Stadium', 'linear-gradient(180deg, #7ccbff 0 50%, #5fb24a 50%)'],
  ['midnight', 'Midnight', 'linear-gradient(90deg, #171a21 0 60%, #7aa2f7 60%)'],
  ['gameboy', 'Game Boy', 'linear-gradient(90deg, #0f380f, #306230, #8bac0f, #9bbc0f)'],
]
const SHOWDOWN_ACCENTS = ['#ff2bd6', '#dc0a2d', '#ef7d22', '#f2b600', '#2f9a3a', '#2c8783', '#1f5fbf', '#7a4ea3']

// Abilities that soak up a move type, for Expert.
const SHOWDOWN_ABSORB = {
  levitate: 'Ground', eartheater: 'Ground', flashfire: 'Fire', wellbakedbody: 'Fire', waterabsorb: 'Water', stormdrain: 'Water',
  dryskin: 'Water', voltabsorb: 'Electric', lightningrod: 'Electric', motordrive: 'Electric', sapsipper: 'Grass',
}
const SHOWDOWN_TAKEOVER_MS = 20000
let showdownEngine = null

// The engine is about 1 MB over the wire, so it loads the first time.
function loadShowdown() {
  if (!showdownEngine) {
    showdownEngine = new Promise((resolve, reject) => {
      const s = document.createElement('script')
      s.src = `${SHOWDOWN_BASE}showdown.js`
      s.onload = () => (window.PkmnShowdown ? resolve(window.PkmnShowdown) : reject(new Error('The battle engine didn\'t start.')))
      s.onerror = () => { showdownEngine = null; s.remove(); reject(new Error('Could not load the battle engine.')) }
      document.head.append(s)
    })
  }
  return showdownEngine
}

// Settings, teams and your record stay in this browser.
const pkStore = {
  get(key, fallback) {
    try { const v = localStorage.getItem(`ds_pk_${key}`); return v === null ? fallback : JSON.parse(v) } catch (e) { return fallback }
  },
  set(key, value) {
    try { localStorage.setItem(`ds_pk_${key}`, JSON.stringify(value)) } catch (e) { /* private mode */ }
  },
}

// Like replaceChildren, but skips the false/null/undefined that conditional
// pieces leave behind (replaceChildren would print them as text).
function pkFill(node, ...kids) {
  node.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false && k !== ''))
  return node
}

function showdownFormatName(id) {
  for (const [, list] of SHOWDOWN_FORMATS) for (const [fid, label] of list) if (fid === id) return label
  return id
}

function showdown(host, ctx, opts) {
  const cfg = (typeof S !== 'undefined' && S.cfg) || {}
  const canOnline = !!(cfg.supabaseUrl && cfg.supabaseKey && window.supabase)
  const me = randomId()
  const wrap = el('div', { class: 'pk' })
  host.append(wrap)

  let PS = null
  let name = storedName() || ''
  let format = pkStore.get('format', 'gen9randombattle')
  let teamId = pkStore.get('team', '')
  let look = SHOWDOWN_LOOKS.some(l => l[0] === pkStore.get('look', 'neon')) ? pkStore.get('look', 'neon') : 'neon'
  let accent = /^#[0-9a-f]{6}$/i.test(pkStore.get('accent', '') || '') ? pkStore.get('accent', '') : ''
  let level = SHOWDOWN_BRAINS[pkStore.get('level', 'normal')] ? pkStore.get('level', 'normal') : 'normal'
  const levelName = id => (SHOWDOWN_LEVELS.find(l => l[0] === id) || SHOWDOWN_LEVELS[1])[1]
  let dead = false
  let match = null      // the battle on screen
  let net = null        // the online room, if any
  const sound = { on: pkStore.get('sound', false), music: null }

  const needsTeam = id => SHOWDOWN_TEAM_FORMATS.some(([f]) => f === id)
  const isDoubles = id => /doubles|vgc/.test(id)
  const isDraft = id => id.startsWith('debrod-draft')
  const isFour = id => /freeforall|multi/.test(id)
  const isMulti = id => /multi/.test(id)
  const isThree = id => /freeforall3$/.test(id)
  const isMega = id => id.startsWith('debrod-mega')
  const isChampions = id => id.startsWith('debrod-draftchampions')
  // Who plays: two, three or four seats (a three-way leaves p4 empty).
  const seatsOf = id => (isThree(id) ? ['p1', 'p2', 'p3'] : isFour(id) ? SHOWDOWN_FOUR : ['p1', 'p2'])
  const simFormat = id => SHOWDOWN_SIM_FORMATS[id] || id
  let tower = null      // the Battle Tower run in progress
  const pick = list => list[Math.floor(Math.random() * list.length)]

  // ── Teams ──
  const loadTeams = () => pkStore.get('teams', [])
  const saveTeams = list => pkStore.set('teams', list)
  const teamById = id => loadTeams().find(t => t.id === id)

  function validate(fid, packed) {
    const sets = PS.Teams.unpack(packed || '') || []
    if (!sets.length) return ['The team is empty.']
    try { return PS.TeamValidator.get(fid).validateTeam(sets) } catch (e) { return [e.message] }
  }

  // The CPU's team for build-your-own formats: a random-battle team at
  // level 100, not checked against the format.
  function cpuTeam(fid) {
    const sets = shinify(PS.Teams.generate(isDoubles(fid) ? 'gen9randomdoublesbattle' : 'gen9randombattle'))
    for (const s of sets) s.level = fid === 'gen9lc' ? 5 : fid.includes('vgc') || fid.includes('bss') ? 50 : 100
    return PS.Teams.pack(sets)
  }

  // Random Pokémon are shiny one time in SHOWDOWN_SHINY_ODDS.
  function shinify(sets, gen = 9) {
    if (gen >= 2) for (const set of sets) if (!set.shiny && Math.random() * SHOWDOWN_SHINY_ODDS < 1) set.shiny = true
    return sets
  }
  // Mega formats: Gen 7 random-battle sets holding a Mega Stone, gathered
  // once, and one swapped into each team (never a second of a species).
  let megaSets = null
  function megaPool() {
    if (!megaSets) {
      megaSets = []
      for (let tries = 0; megaSets.length < 40 && tries < 200; tries++) {
        for (const set of PS.Teams.generate('gen7randombattle')) if (PS.Dex.items.get(set.item).megaStone) megaSets.push(set)
      }
    }
    return megaSets
  }
  function addMega(sets) {
    const base = set => PS.Dex.species.get(set.species).baseSpecies
    if (sets.some(set => PS.Dex.items.get(set.item).megaStone)) return sets
    const have = new Set(sets.map(base))
    const options = megaPool().filter(m => !have.has(base(m)))
    if (!options.length) return sets
    const out = sets.slice()
    out[Math.floor(Math.random() * out.length)] = JSON.parse(JSON.stringify(pick(options)))
    return out
  }
  // A random team for the formats the engine can't (or we don't let it)
  // build: null leaves it to the engine.
  function randomTeam(fid) {
    if (isMega(fid) && !isFour(fid)) return PS.Teams.pack(shinify(addMega(PS.Teams.generate('gen7randombattle')), 7))
    if (isFour(fid)) return fourTeam(fid)
    try {
      const sid = simFormat(fid)
      const gen = Number((/^gen(\d)/.exec(sid) || [])[1]) || 9
      return PS.Teams.pack(shinify(PS.Teams.generate(sid), gen))
    } catch (e) { return null } // the engine's own team, no shinies
  }

  // The engine can't make Free-for-all teams itself, so every format here
  // gets ordinary random-battle sets: six singles sets each for
  // Free-for-all, three doubles sets each for Multi.
  function fourTeam(fid) {
    let sets = isMulti(fid) ? PS.Teams.generate('gen9randomdoublesbattle').slice(0, 3) : PS.Teams.generate('gen9randombattle')
    if (isMega(fid)) sets = addMega(sets)
    return PS.Teams.pack(shinify(sets))
  }
  // The empty fourth seat of a three-way: one Pokémon, gone at once.
  const ghostTeam = () => PS.Teams.pack(PS.Teams.generate('gen9randombattle').slice(0, 1))
  // Everyone's team for a group battle, drafted or random.
  const groupTeams = (fid, teamFor) => Object.fromEntries(SHOWDOWN_FOUR.map(x => [x, isThree(fid) && x === SHOWDOWN_GHOST ? ghostTeam() : teamFor(x)]))

  // ── Sound ──
  function cry(speciesForme) {
    if (!sound.on || !PS) return
    const sp = PS.Dex.species.get(speciesForme)
    const a = new Audio(`${SHOWDOWN_SITE}audio/cries/${PS.toID(sp.baseSpecies || speciesForme)}.mp3`)
    a.volume = 0.45
    a.play().catch(() => {})
  }
  function music(play) {
    if (sound.music) { sound.music.pause(); sound.music = null }
    if (!play || !sound.on) return
    sound.music = new Audio(`${SHOWDOWN_SITE}audio/${pick(SHOWDOWN_MUSIC)}.mp3`)
    sound.music.loop = true
    sound.music.volume = 0.22
    sound.music.play().catch(() => {})
  }
  function setSound(on) {
    sound.on = on
    pkStore.set('sound', on)
    music(on && match && !match.view.over())
  }

  // ── Look ──
  // The theme goes on the wrapper; the accent is a colour variable, with
  // dark or light text on it depending on how bright it is.
  function applyLook() {
    wrap.dataset.pkTheme = look
    wrap.classList.toggle('pk-skinned', look !== 'neon')
    if (accent && look !== 'gameboy') {
      const [r, g, b] = [1, 3, 5].map(i => parseInt(accent.slice(i, i + 2), 16))
      wrap.style.setProperty('--pk-accent', accent)
      wrap.style.setProperty('--pk-on-accent', 0.299 * r + 0.587 * g + 0.114 * b > 150 ? '#111' : '#fff')
    } else {
      wrap.style.removeProperty('--pk-accent')
      wrap.style.removeProperty('--pk-on-accent')
    }
  }
  applyLook()

  function lookPicker(redraw) {
    const set = (l, a) => { look = l; accent = a; pkStore.set('look', l); pkStore.set('accent', a); applyLook(); redraw() }
    return el('div', { class: 'field' }, el('span', null, 'Look'),
      el('div', { class: 'pk-looks' }, SHOWDOWN_LOOKS.map(([id, label, chip]) => el('button', {
        type: 'button', class: look === id ? 'on' : '', 'aria-pressed': look === id ? 'true' : 'false', onClick: () => set(id, accent),
      }, el('span', { class: 'pk-look-chip', style: `background: ${chip}` }), label))),
      look === 'gameboy'
        ? el('p', { class: 'muted small' }, 'Game Boy keeps its four greens.')
        : el('div', { class: 'pk-swatches' },
          el('button', { type: 'button', class: `pk-swatch-default ${accent ? '' : 'on'}`, onClick: () => set(look, '') }, 'Default'),
          SHOWDOWN_ACCENTS.map(c => el('button', { type: 'button', class: accent === c ? 'on' : '', style: `background: ${c}`, 'aria-label': `Accent ${c}`, title: c, onClick: () => set(look, c) })),
          el('input', { type: 'color', value: accent || '#ff2bd6', 'aria-label': 'Pick any colour', title: 'Pick any colour', onChange: e => set(look, e.target.value) })))
  }

  // ── Menu ──
  function menu(err) {
    music(false)
    let draftName = name
    let draftCode = (opts && opts.code) || ''
    // Kept as you type, so a trip to the team builder doesn't lose it.
    const nameInput = el('input', { value: draftName, maxlength: 18, placeholder: 'Trainer name', autofocus: true, onInput: e => { draftName = e.target.value; name = draftName.trim().slice(0, 18) || name } })
    const formatSelect = el('select', { onChange: e => { format = e.target.value; pkStore.set('format', format); menu() } },
      SHOWDOWN_FORMATS.map(([group, list]) => el('optgroup', { label: group }, list.map(([id, label]) => el('option', { value: id }, label)))))
    formatSelect.value = format
    const teams = loadTeams()
    const teamSelect = el('select', { onChange: e => { teamId = e.target.value; pkStore.set('team', teamId) } },
      el('option', { value: '' }, teams.length ? 'Choose a team…' : 'No teams yet'),
      teams.map(t => el('option', { value: t.id }, `${t.name}${t.format && t.format !== format ? ` (${showdownFormatName(t.format)})` : ''}`)))
    teamSelect.value = teams.some(t => t.id === teamId) ? teamId : ''
    const okName = () => {
      const n = draftName.trim().slice(0, 18)
      if (!n) { nameInput.focus(); return false }
      name = n
      storeName(n)
      return true
    }
    const record = pkStore.get('record', {})[format]
    pkFill(wrap, el('div', { class: 'card stack pk-menu' },
      el('div', null,
        el('p', { class: 'wordmark' }, 'Showdown'),
        el('p', { class: 'tagline' }, 'Pokémon battles on Showdown\'s engine')),
      err && el('p', { class: 'error' }, err),
      el('label', { class: 'field' }, el('span', null, 'Trainer name'), nameInput),
      el('label', { class: 'field' }, el('span', null, 'Format'), formatSelect),
      format === 'debrod-tower'
        ? el('p', { class: 'muted small' }, 'The tower sets its own difficulty: it starts at Normal, plays like Hard from floor 4, and every boss plays at Expert.')
        : el('div', { class: 'field' }, el('span', null, 'CPU difficulty'),
          el('div', { class: 'toggle pk-level' }, SHOWDOWN_LEVELS.map(([id, label]) => el('button', {
            type: 'button', class: level === id ? 'on' : '', 'aria-pressed': level === id ? 'true' : 'false',
            onClick: () => { level = id; pkStore.set('level', id); menu(err) },
          }, label))),
          el('p', { class: 'muted small' }, (SHOWDOWN_LEVELS.find(l => l[0] === level) || [])[2])),
      needsTeam(format) && el('div', { class: 'field' }, el('span', null, 'Your team'),
        el('div', { class: 'row' }, teamSelect, el('button', { type: 'button', onClick: () => builder(teamSelect.value) }, 'Edit'))),
      lookPicker(() => menu(err)),
      record && el('p', { class: 'muted small' }, `Your record here: ${record.w} won · ${record.l} lost${record.t ? ` · ${record.t} tied` : ''}`),
      format === 'debrod-tower' && el('p', { class: 'muted small' }, `Climb floor by floor with a rental team; the CPU gets tougher, and after each win you can swap in one of theirs. Best: floor ${pkStore.get('tower', { best: 0 }).best || 0}.`),
      isMega(format) && el('p', { class: 'muted small' }, 'Every trainer\'s team has a Pokémon holding its Mega Stone. Tap Mega Evolve before you pick a move (once a battle).'),
      isFour(format) && !isDraft(format) && el('p', { class: 'muted small' }, isMulti(format)
        ? 'You and a partner against two others, one Pokémon out each. Play with up to three friends; the CPU takes any empty seat.'
        : isThree(format)
          ? 'Three trainers, one Pokémon out each, everyone against everyone. Play with up to two friends; the CPU takes any empty seat.'
          : 'Four trainers, one Pokémon out each, everyone against everyone. Play with up to three friends; the CPU takes any empty seat.'),
      isDraft(format) && el('p', { class: 'muted small' }, isFour(format)

        : `Take turns picking from ${SHOWDOWN_DRAFT_POOL} random Pokémon (snake order) until you each have ${SHOWDOWN_DRAFT_PICKS}, then battle with what you drafted.`),

  function newCode() {
    const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'
    return Array.from(crypto.getRandomValues(new Uint8Array(5)), b => abc[b % abc.length]).join('')
  }

    if (!t) return `${showdownFormatName(format)} needs a team. Build one in the team builder.`

  async function builder(openId) {

    const dex = PS.Dex
    let teams = loadTeams()

    }
    const speciesList = ensureList('pk-dl-species', dex.species.all().filter(s => s.num > 0 && (!s.isNonstandard || s.isNonstandard === 'Past')).map(s => s.name).sort())
    const itemList = ensureList('pk-dl-items', dex.items.all().filter(i => !i.isNonstandard || i.isNonstandard === 'Past').map(i => i.name).sort())
    const natures = dex.natures.all().map(n => n.name).sort()
    const types = dex.types.names().filter(t => t !== '???')

    let saving = null
    function persist() {
      if (!current) return
      current.packed = PS.Teams.pack(sets)
      clearTimeout(saving)

        teams = loadTeams().map(t => (t.id === current.id ? current : t))
        if (!teams.some(t => t.id === current.id)) teams.push(current)
        saveTeams(teams)
      }, 250)
    }
    function flushSave() {
      if (!current) return
      clearTimeout(saving)
      current.packed = PS.Teams.pack(sets)
      teams = loadTeams().filter(t => t.id !== current.id).concat(current)
      saveTeams(teams)
    }

    function newTeam(fromSets, label) {
      flushSave()

        }))),

            el('input', { type: 'number', min: 0, max: 252, step: 4, value: evs[k], onChange: e => { evs[k] = Math.max(0, Math.min(252, Number(e.target.value) || 0)); set.evs = evs; redraw() } })))),
        el('details', { class: 'pk-ivs' }, el('summary', { class: 'muted small' }, 'IVs'),
          el('div', { class: 'pk-evs' }, Object.keys(STAT_NAMES).map(k => el('label', null, STAT_NAMES[k],
            el('input', { type: 'number', min: 0, max: 31, value: ivs[k], onChange: e => { ivs[k] = Math.max(0, Math.min(31, Number(e.target.value) || 0)); set.ivs = ivs; persist() } }))))))
    }

    function exportText() {
      const copy = PS.Teams.unpack(PS.Teams.pack(sets)) || []
      for (const s of copy) delete s.hpType
      return PS.Teams.export(copy)
    }

    function pasteDialog(title, text, onOk, okLabel) {

    function render() {

      pkFill(wrap, el('div', { class: 'pk-builder' },
        el('div', { class: 'row pk-builder-top' },
          el('button', { type: 'button', class: 'link back', onClick: () => { flushSave(); if (current) { teamId = current.id; pkStore.set('team', teamId) } menu() } }, '‹ Done'),
          el('p', { class: 'name grow' }, 'Team builder'),
          el('button', { type: 'button', onClick: () => newTeam() }, '+ New team'),
          el('button', { type: 'button', onClick: () => pasteDialog('Import a team (Showdown text)', '', text => {

            if (!imported || !imported.length) return tell('That doesn\'t look like a Showdown team.')

          }, 'Import') }, 'Import')),
        el('div', { class: 'pk-builder-body' },
          el('div', { class: 'pk-team-list' }, teams.length
            ? teams.map(t => el('button', { type: 'button', class: `pk-team-item ${current && t.id === current.id ? 'on' : ''}`,
              onClick: () => { flushSave(); current = loadTeams().find(x => x.id === t.id) || t; sets = PS.Teams.unpack(current.packed) || []; problems = null; render() } },
              el('span', { class: 'truncate' }, t.name),
              el('span', { class: 'pk-team-icons' }, (PS.Teams.unpack(t.packed) || []).map(s => el('img', { src: `${SHOWDOWN_SPRITES}gen5/${dex.species.get(s.species).spriteid}.png`, alt: '' })))))
            : el('p', { class: 'muted small' }, 'No teams yet. Make one, or import one from Showdown.')),
          current
            ? el('div', { class: 'pk-team-edit stack' },

                el('input', { value: current.name, maxlength: 40, onChange: e => { current.name = e.target.value.trim() || current.name; flushSave(); render() } }),
                sel(SHOWDOWN_TEAM_FORMATS.map(([id, label]) => [id, label]), current.format, v => { current.format = v; problems = null; flushSave(); render() })),
              el('div', { class: 'row pk-team-actions' },
                el('button', { type: 'button', class: 'primary', onClick: () => { flushSave(); problems = validate(current.format, current.packed) || []; render() } }, 'Check team'),

                el('button', { type: 'button', onClick: () => pasteDialog('Replace this team with Showdown text', exportText(), text => {

                el('button', { type: 'button', onClick: () => { flushSave(); const copy = Object.assign({}, current, { id: randomId(), name: `${current.name} (copy)` }); saveTeams(loadTeams().concat(copy)); current = copy; render() } }, 'Copy'),

                  if (!(await ask(`Delete ${current.name}?`, 'Delete'))) return
                  saveTeams(loadTeams().filter(t => t.id !== current.id))

                  render()

                ? el('div', { class: 'pk-problems' }, problems.map(p => el('p', { class: 'error' }, p)))
                : el('p', { class: 'pk-ok' }, `✓ Legal in ${showdownFormatName(current.format)}`)),
              el('div', { class: 'pk-slots' }, sets.map(slotCard),
                sets.length < 6 && el('button', { type: 'button', class: 'pk-slot pk-add', onClick: () => { sets.push({ species: '', moves: [], evs: {}, ivs: {} }); persist(); render() } }, '+ Add a Pokémon')))
            : el('div', { class: 'pk-team-edit' }))))
    }
    render()

  // ── Running a battle (CPU, or the host's side of an online one) ──
  // fid is DEBROD's format id; random teams are made here when nobody
  // brought one, and a three-way's empty seat forfeits straight away.
  function runSim(fid, p1, p2, handlers, more = []) {
    for (const p of [p1, p2, ...more]) if (!p.team && !needsTeam(fid)) p.team = randomTeam(fid)
    const stream = new PS.BattleStreams.BattleStream()
    const streams = PS.BattleStreams.getPlayerStreams(stream)
    let over = false
    const pump = async (s, fn) => {
      if (!fn) return
      try {
        for await (const chunk of s) {
          if (over || dead) break
          try { fn(chunk) } catch (e) { console.error('Showdown:', e) }
        }
      } catch (e) { /* stream closed */ }
    }
    pump(streams.p1, handlers.p1)
    pump(streams.p2, handlers.p2)
    more.forEach((p, i) => pump(streams[`p${i + 3}`], handlers[`p${i + 3}`]))
    pump(streams.spectator, handlers.spectator)
    const player = p => JSON.stringify(Object.assign({ name: p.name }, p.team ? { team: p.team } : {}))
    const extra = more.map((p, i) => `\n>player p${i + 3} ${player(p)}`).join('')
    streams.omniscient.write(`>start ${JSON.stringify({ formatid: simFormat(fid) })}\n>player p1 ${player(p1)}\n>player p2 ${player(p2)}${extra}${isThree(fid) ? `\n>forcelose ${SHOWDOWN_GHOST}` : ''}`)
    return {
      stream,
      choose: (side, choice) => { if (!over) streams[side].write(choice) },
      forfeit: side => { if (!over) streams.omniscient.write(`>forcelose ${side}`) },
      end() {
        over = true
        try { streams.omniscient.writeEnd() } catch (e) { /* already closed */ }
      },
    }
  }

  const requestsIn = chunk => chunk.split('\n').filter(l => l.startsWith('|request|') && l.length > 9).map(l => JSON.parse(l.slice(9)))

  async function startCpu() {
    try { await engine() } catch (e) { return menu(e.message) }
    if (dead) return
    if (format === 'debrod-tower') return towerStart()
    if (isDraft(format)) return draftVsCpu()
    if (isFour(format)) return cpuFour()
    const problem = myTeamProblem()
    if (problem) return menu(problem)
    cpuBattle(format, needsTeam(format) ? teamById(teamId).packed : null, needsTeam(format) ? cpuTeam(format) : null)
  }

  function cpuBattle(fid, myTeam, theirTeam, extra = {}) {
    endMatch()
    const foe = extra.foe || 'CPU'
    const brain = extra.brain || level
    const view = viewer('p1', { format: fid, me: name, foe, vsCpu: true, level: extra.brain ? null : level, floor: extra.floor, banner: extra.banner || `CPU: ${levelName(level)}` }, {
      choose: choice => sim.choose('p1', choice),
      forfeit: () => sim.forfeit('p1'),
      again: extra.again || (() => startCpu()),
      againLabel: extra.againLabel,
      onFinish: extra.onFinish,
      back: () => { endMatch(); menu() },
    })
    const sim = runSim((fid), { name, team: myTeam }, { name: foe, team: theirTeam }, {
      p1: chunk => view.feed(chunk),
      p2: chunk => {
        for (const req of requestsIn(chunk)) {
          // A beat before the CPU answers, so it doesn't feel instant.
          setTimeout(() => { const c = cpuChoice(req, sim.stream.battle, 'p2', brain); if (c) sim.choose('p2', c) }, 400 + Math.random() * 600)
        }
      },
    })
    match = { sim, view }
    music(true)
  }

  // A CPU in one seat: answers each request after a beat, and falls back on
  // the default choice if the battle turns its pick down.
  function cpuSeat(getSim, sideId, brain = level) {
    let retried = false
    return chunk => {
      if (/(^|\n)\|error\|/.test(chunk)) {
        if (!retried) { retried = true; setTimeout(() => getSim().choose(sideId, 'default'), 50) }
        return
      }
      for (const req of requestsIn(chunk)) {
        if (req.wait) continue
        retried = false
        setTimeout(() => { const sim = getSim(); const c = cpuChoice(req, sim.stream.battle, sideId, brain); if (c) sim.choose(sideId, c) }, 400 + Math.random() * 600)
      }
    }
  }

  // You and three CPUs, with random teams or the ones drafted.
  function cpuFour(teams, extra = {}) {
    endMatch()
    const names = Object.assign({ p1: name }, SHOWDOWN_CPU_NAMES, isMulti(format) ? { p3: 'Partner Mae' } : {}, isThree(format) ? { [SHOWDOWN_GHOST]: SHOWDOWN_GHOST_NAME } : {})
    const fid = format
    const T = teams || groupTeams(fid, () => fourTeam(fid))
    const view = viewer('p1', { format: fid, me: name, foe: 'the CPUs', names, vsCpu: true, level, banner: `CPUs: ${levelName(level)}` }, {
      choose: choice => sim.choose('p1', choice),
      forfeit: () => sim.forfeit('p1'),
      again: extra.again || (() => startCpu()),
      againLabel: extra.againLabel,
      back: () => { endMatch(); menu() },
    })
    const get = () => sim
    const sim = runSim((fid), { name, team: T.p1 }, { name: names.p2, team: T.p2 }, {
      p1: chunk => view.feed(chunk),
      p2: cpuSeat(get, 'p2'),
      p3: cpuSeat(get, 'p3'),
      p4: isThree(fid) ? null : cpuSeat(get, 'p4'),
    }, [{ name: names.p3, team: T.p3 }, { name: names.p4, team: T.p4 }])
    match = { sim, view }
    music(true)
  }

  // ── Draft (a DEBROD extra) ──
  // A shared pool of random-battle sets, picked in snake order (A, B, B, A,
  // A, B…), then battled with as drafted.
  function draftPool(doubles, size = SHOWDOWN_DRAFT_POOL) {
    const out = []
    const seen = new Set()
    for (let tries = 0; out.length < size && tries < 16; tries++) {
      for (const set of shinify(PS.Teams.generate(doubles ? 'gen9randomdoublesbattle' : 'gen9randombattle'))) {
        const base = PS.Dex.species.get(set.species).baseSpecies
        if (seen.has(base)) continue
        seen.add(base)
        out.push(set)
        if (out.length >= size) break
      }
    }
    return out
  }
  const isMegaSet = set => !!(set && set.item && PS.Dex.items.get(set.item).megaStone)
  // Draft Champions: ordinary sets plus a few Mega holders (all different
  // species), shuffled together.
  function championsPool(size, megas) {
    const base = set => PS.Dex.species.get(set.species).baseSpecies
    const out = []
    const seen = new Set()
    for (const m of megaPool()) {
      if (out.length >= megas) break
      if (seen.has(base(m))) continue
      seen.add(base(m))
      out.push(JSON.parse(JSON.stringify(m)))
    }
    for (let tries = 0; out.length < size && tries < 16; tries++) {
      for (const set of PS.Teams.generate('gen9randombattle')) {
        if (isMegaSet(set) || seen.has(base(set))) continue
        seen.add(base(set))
        out.push(set)
        if (out.length >= size) break
      }
    }
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1))
      ;[out[i], out[j]] = [out[j], out[i]]
    }
    return shinify(out)
  }
  // Two drafting (p1, p2, p2, p1…) or four (p1–p4, then back).
  function newDraft(fid, names) {
    const sides = seatsOf(fid)
    const each = isFour(fid) ? SHOWDOWN_DRAFT_FOUR.picks : SHOWDOWN_DRAFT_PICKS
    const order = []
    for (let r = 0; order.length < each * sides.length; r++) order.push(...(r % 2 ? sides.slice().reverse() : sides))
    const pool = isChampions(fid)
      ? championsPool(SHOWDOWN_DRAFT_FOUR.pool, sides.length + 2)
      : draftPool(isDoubles(fid), isFour(fid) ? SHOWDOWN_DRAFT_FOUR.pool : SHOWDOWN_DRAFT_POOL)
    return { id: randomId(), fid, pool, picks: Object.fromEntries(sides.map(x => [x, []])), order, at: 0, names, sides, each }
  }
  const draftSides = D => D.sides || ['p1', 'p2']
  const draftDone = D => D.at >= D.order.length
  const draftTaken = D => new Set(draftSides(D).flatMap(x => D.picks[x] || []))
  // In Draft Champions a side can hold one Mega Stone; nobody can use a second.
  const draftAllowed = (D, side, idx) => !(isChampions(D.fid) && isMegaSet(D.pool[idx]) && (D.picks[side] || []).some(j => isMegaSet(D.pool[j])))
  function draftPick(D, side, idx) {
    if (draftDone(D) || D.order[D.at] !== side || !D.pool[idx] || draftTaken(D).has(idx) || !draftAllowed(D, side, idx)) return false
    D.picks[side].push(idx)
    D.at++
    return true
  }
  const draftTeam = (D, side) => PS.Teams.pack(D.picks[side].map(i => D.pool[i]))
  const bst = set => Object.values(PS.Dex.species.get(set.species).baseStats).reduce((a, b) => a + b, 0)
  // The CPU likes strong Pokémon and types it doesn't have yet.
  function draftCpuPick(D, side) {
    const taken = draftTaken(D)
    const have = new Set(D.picks[side].flatMap(i => PS.Dex.species.get(D.pool[i].species).types))
    let best = -1
    let bestScore = -Infinity
    D.pool.forEach((set, i) => {
      if (taken.has(i) || !draftAllowed(D, side, i)) return
      const types = PS.Dex.species.get(set.species).types
      // Easy drafts loosely, Expert barely leaves it to chance.
      const noise = { easy: 400, normal: 90, hard: 60, expert: 25 }[level] || 90
      // A Mega is worth about a hundred base stats more than it shows.
      const score = (bst(set) + (isMegaSet(set) ? 100 : 0)) * ((set.level || 100) / 100) + types.filter(t => !have.has(t)).length * 40 + Math.random() * noise
      if (score > bestScore) { bestScore = score; best = i }
    })
    return best
  }

  function draftScreen(D, mySide, onPick, opts = {}) {
    const turn = draftDone(D) ? null : D.order[D.at]
    const locked = opts.locked && opts.locked()
    const myTurn = !opts.spectator && turn === mySide && !locked
    const taken = draftTaken(D)
    const sides = draftSides(D)
    const each = D.each || SHOWDOWN_DRAFT_PICKS
    const left = opts.deadline ? Math.max(0, opts.deadline - Date.now()) : null
    const owner = i => sides.find(x => (D.picks[x] || []).includes(i)) || ''
    // Ours first, then everyone else in seat order.
    const shown = opts.spectator ? sides : [mySide, ...sides.filter(x => x !== mySide)]
    const column = side => el('div', { class: `pk-draft-col ${side === mySide ? 'mine' : ''} ${turn === side ? 'turn' : ''}` },
      el('p', { class: 'name' }, side === mySide && !opts.spectator ? `You (${D.names[side]})` : D.names[side]),
      el('div', { class: 'pk-draft-picks', style: `grid-template-columns: repeat(${each}, minmax(0, 1fr))` }, Array.from({ length: each }, (_, k) => {
        const i = D.picks[side][k]
        const set = D.pool[i]
        return set
          ? el('div', { class: 'pk-draft-picked', title: `${set.species} · ${set.moves.join(', ')}` },
            el('img', { src: `${SHOWDOWN_SPRITES}gen5/${PS.Dex.species.get(set.species).spriteid}.png`, alt: '' }),
            el('span', null, set.species))
          : el('div', { class: 'pk-draft-picked empty' }, '?')
      })))
    pkFill(wrap, el('div', { class: 'pk-draft' },
      el('div', { class: 'row pk-draft-top' },
        el('button', { type: 'button', class: 'link back', onClick: opts.back }, '‹ Leave'),
        el('p', { class: 'pk-format grow' }, showdownFormatName(D.fid)),
        el('p', { class: `pk-draft-turn ${myTurn ? 'mine' : ''}` }, !turn ? 'Draft done. To battle!' : locked ? 'Picked!' : myTurn ? 'Your pick!' : `${D.names[turn]} is picking…`),
        left !== null && turn && el('span', { class: 'pill' }, `⏱ ${Math.ceil(left / 1000)}s`)),
      el('div', { class: `pk-draft-teams ${sides.length > 2 ? 'four' : ''}` }, shown.map(column)),
      el('div', { class: 'pk-draft-pool' }, D.pool.map((set, i) => {
        const sp = PS.Dex.species.get(set.species)
        const who = owner(i)
        const blocked = !who && !opts.spectator && !draftAllowed(D, mySide, i)
        return el('button', {
          type: 'button', class: `pk-draft-card ${who ? `taken ${who === mySide && !opts.spectator ? 'mine' : 'theirs'}` : ''} ${blocked ? 'blocked' : ''}`,
          disabled: !myTurn || taken.has(i) || blocked,
          title: `${set.species} @ ${set.item || 'no item'}\n${set.ability}\n${set.moves.map(m => PS.Dex.moves.get(m).name).join(', ')}`,
          onClick: () => onPick(i),
        },
          el('img', { src: `${SHOWDOWN_SPRITES}ani/${sp.spriteid}.gif`, alt: '', onError: e => { e.target.onerror = null; e.target.src = `${SHOWDOWN_SPRITES}gen5/${sp.spriteid}.png` } }),
          el('span', { class: 'pk-draft-name' }, set.species),
          el('span', { class: 'pk-types' }, sp.types.map(t => el('span', { class: 'pk-type', style: `background: ${TYPE_COLORS[t]}` }, t))),
          el('span', { class: 'muted small' }, `L${set.level || 100} · BST ${bst(set)}`),
          el('span', { class: 'muted small pk-draft-moves' }, set.moves.map(m => PS.Dex.moves.get(m).name).join(' · ')),
          isChampions(D.fid) && isMegaSet(set) && el('span', { class: 'pk-draft-mega', title: blocked ? 'You already drafted a Mega' : `Holds ${set.item}` }, 'Mega'),
          who && el('span', { class: 'pk-draft-owner' }, who === mySide && !opts.spectator ? 'Yours' : D.names[who]))
      }))))
  }

  function draftVsCpu() {
    const fid = format
    const D = newDraft(fid, isFour(fid) ? Object.assign({ p1: name }, SHOWDOWN_CPU_NAMES, isMulti(fid) ? { p3: 'Partner Mae' } : {}) : { p1: name, p2: 'CPU' })
    D.live = true
    const render = () => draftScreen(D, 'p1', i => { if (draftPick(D, 'p1', i)) step() }, { back: () => { D.live = false; menu() } })
    const step = () => {
      render()
      if (draftDone(D)) {
        return setTimeout(() => {
          if (!D.live || dead) return
          const again = { again: () => draftVsCpu(), againLabel: () => 'Draft again' }
          if (isFour(fid)) cpuFour(groupTeams(fid, x => draftTeam(D, x)), again)
          else cpuBattle(fid, draftTeam(D, 'p1'), draftTeam(D, 'p2'), again)
        }, 1000)
      }
      const cpu = D.order[D.at]
      if (cpu !== 'p1') setTimeout(() => { if (D.live && !dead && draftPick(D, cpu, draftCpuPick(D, cpu))) step() }, 650)
    }
    step()
  }

  // ── Battle Tower (a DEBROD extra) ──
  // A rental team climbs floor by floor. The CPU gets stronger and
  // smarter; a boss waits every 7th floor; after a win you may swap one of
  // your Pokémon for one of theirs.
  function towerStart() {
    tower = { floor: 1, team: shinify(PS.Teams.generate('gen9randombattle')) }
    towerIntro()
  }
  const towerBest = () => pkStore.get('tower', { best: 0 }).best || 0
  function towerTeamRow(sets, onPick, picked) {
    return el('div', { class: 'pk-tower-team' }, sets.map((set, i) => {
      const sp = PS.Dex.species.get(set.species)
      return el(onPick ? 'button' : 'div', {
        type: onPick ? 'button' : null, class: `pk-tower-mon ${picked === i ? 'picked' : ''}`,
        title: `${set.species} @ ${set.item || 'no item'} · ${set.ability}\n${set.moves.map(m => PS.Dex.moves.get(m).name).join(', ')}`,
        onClick: onPick ? () => onPick(i) : null,
      },
        el('img', { src: `${SHOWDOWN_SPRITES}gen5/${sp.spriteid}.png`, alt: '' }),
        el('span', { class: 'pk-mon-name' }, set.species),
        el('span', { class: 'muted small' }, `L${set.level || 100}`))
    }))
  }
  function towerIntro() {
    const floor = tower.floor
    const boss = floor % 7 === 0
    pkFill(wrap, el('div', { class: 'card stack pk-menu pk-tower-card' },
      el('p', { class: 'wordmark' }, `Floor ${floor}`),
      el('p', { class: 'tagline' }, boss ? `Boss: ${SHOWDOWN_TOWER_TRAINERS[6]}` : `Next: ${SHOWDOWN_TOWER_TRAINERS[(floor - 1) % 6]}`),
      el('p', { class: 'muted small' }, `Best run: floor ${towerBest()}. Your team heals between floors.`),
      towerTeamRow(tower.team),
      el('div', { class: 'row' },
        el('button', { type: 'button', class: 'primary grow', onClick: towerFloor }, `Battle floor ${floor}`),
        floor === 1 && el('button', { type: 'button', onClick: () => { tower.team = shinify(PS.Teams.generate('gen9randombattle')); towerIntro() } }, 'New rental team')),
      el('button', { type: 'button', class: 'link', onClick: () => { tower = null; menu() } }, '‹ Leave the tower')))
  }
  function towerFloor() {
    const floor = tower.floor
    const boss = floor % 7 === 0
    const cpuSets = shinify(PS.Teams.generate('gen9randombattle'))
    const bonus = Math.min(12, Math.floor((floor - 1) / 2) * 2) + (boss ? 4 : 0)
    for (const set of cpuSets) set.level = Math.min(100, (set.level || 80) + bonus)
    const foe = boss ? SHOWDOWN_TOWER_TRAINERS[6] : SHOWDOWN_TOWER_TRAINERS[(floor - 1) % 6]
    let outcome = null
    cpuBattle('debrod-tower', PS.Teams.pack(tower.team), PS.Teams.pack(cpuSets), {
      foe,
      floor,
      // Sharper every floor; it thinks like Hard from floor 4, and bosses play at Expert.
      brain: boss ? SHOWDOWN_BRAINS.expert
        : Object.assign({}, floor >= 4 ? SHOWDOWN_BRAINS.hard : SHOWDOWN_BRAINS.normal, { skill: Math.min(0.95, 0.62 + floor * 0.04) }),
      banner: `Floor ${floor} · Best ${towerBest()}`,
      onFinish: result => {
        outcome = result
        if (result === 'win') pkStore.set('tower', { best: Math.max(towerBest(), floor) })
      },
      againLabel: r => (r === 'win' ? `On to floor ${floor + 1} ›` : 'Start a new run'),
      again: () => (outcome === 'win' ? towerSwap(cpuSets) : towerStart()),
    })
  }
  function towerSwap(theirs, takeIdx) {
    endMatch()
    pkFill(wrap, el('div', { class: 'card stack pk-menu pk-tower-card' },
      el('p', { class: 'wordmark' }, `Floor ${tower.floor} cleared!`),
      el('p', { class: 'muted small' }, takeIdx === undefined
        ? 'Want one of theirs? Pick it, then pick who it replaces. Or keep your team.'
        : `Who makes room for ${theirs[takeIdx].species}?`),
      el('p', { class: 'muted small' }, 'Their team'),
      towerTeamRow(theirs, i => towerSwap(theirs, i), takeIdx),
      el('p', { class: 'muted small' }, 'Your team'),
      towerTeamRow(tower.team, takeIdx === undefined ? null : i => {
        tower.team[i] = Object.assign({}, theirs[takeIdx], { level: Math.min(theirs[takeIdx].level || 80, 90) })
        tower.floor++
        towerIntro()
      }),
      el('button', { type: 'button', class: 'primary', onClick: () => { tower.floor++; towerIntro() } }, 'Keep my team ›')))
  }

  function endMatch() {
    if (match && match.sim) match.sim.end()
    if (match && match.view) match.view.destroy()
    if (net && net.timerTick) { clearInterval(net.timerTick); net.timerTick = null }
    match = null
    music(false)
  }

  // The CPU's turn. `brain` is a level ('easy' … 'expert'), a brain from
  // SHOWDOWN_BRAINS, or (for old callers) a plain skill number.
  // Normal and Easy score moves by base power, STAB, type and accuracy and
  // switch at random when nothing lands. Hard and Expert estimate the real
  // damage from stats and boosts, chase knockouts, weigh status moves by
  // whether they'd do anything, and switch to the best matchup. Nothing here
  // touches the battle's own random numbers.
  function cpuChoice(req, battle, sideId, brain = 'normal') {
    if (!req || req.wait || !battle) return null
    if (req.teamPreview) return 'default'
    const B = typeof brain === 'number' ? Object.assign({}, SHOWDOWN_BRAINS.normal, { skill: brain })
      : typeof brain === 'string' ? SHOWDOWN_BRAINS[brain] || SHOWDOWN_BRAINS.normal : brain
    const sideObj = battle[sideId]
    const four = battle.sides.length > 2
    // In four-player battles everyone but your partner is a foe.
    const foeSides = four ? battle.sides.filter(x => x !== sideObj && x !== sideObj.allySide) : [battle[sideId === 'p1' ? 'p2' : 'p1']]
    const team = req.side.pokemon
    const doubles = battle.gameType !== 'singles'
    const dex = battle.dex
    const taken = new Set()
    const healthy = () => team.map((p, i) => ({ p, i })).filter(({ p, i }) => !p.active && !p.condition.endsWith(' fnt') && !taken.has(i))
    const liveFoes = () => foeSides.flatMap(x => x.active.map((f, i) => ({ f, i }))).filter(({ f }) => f && !f.fainted)

    // ── Estimates (Hard and Expert) ──
    const stage = b => (b >= 0 ? (2 + b) / 2 : 2 / (2 - b))
    const speed = p => p.storedStats.spe * stage(p.boosts.spe || 0) * (p.status === 'par' ? 0.5 : 1)
    const absorbs = (move, foe) => B.abilities && SHOWDOWN_ABSORB[foe.ability] === move.type
    // Share of the foe's remaining HP a hit would take: stats, boosts, STAB,
    // type, burn and multi-hit; no items, crits or damage roll.
    function hitShare(move, atk, def) {
      if (!def || move.category === 'Status') return 0
      const types = def.getTypes()
      if (!dex.getImmunity(move.type, types) || absorbs(move, def)) return 0
      let dmg
      if (move.damage === 'level') dmg = atk.level
      else if (typeof move.damage === 'number') dmg = move.damage
      else {
        const phys = move.category === 'Physical'
        const a = atk.storedStats[phys ? 'atk' : 'spa'] * stage(atk.boosts[phys ? 'atk' : 'spa'] || 0)
        const d = def.storedStats[phys ? 'def' : 'spd'] * stage(def.boosts[phys ? 'def' : 'spd'] || 0)
        dmg = ((2 * atk.level / 5 + 2) * (move.basePower || 0) * a / Math.max(1, d)) / 50 + 2
        if (atk.hasType(move.type)) dmg *= 1.5
        dmg *= Math.pow(2, dex.getEffectiveness(move.type, types))
        if (phys && atk.status === 'brn') dmg *= 0.5
        if (move.multihit) dmg *= Array.isArray(move.multihit) ? 3 : move.multihit
      }
      return dmg / Math.max(1, def.hp)
    }
    const accuracy = move => (move.accuracy === true ? 1 : move.accuracy / 100)
    // How hard a foe's own types hit this Pokémon: 0 (immune) to 4.
    const threat = (foe, p) => Math.max(...foe.getTypes().map(t => (dex.getImmunity(t, p.getTypes()) ? Math.pow(2, dex.getEffectiveness(t, p.getTypes())) : 0)))
    // How well a teammate would do against a foe: its best hit, minus the
    // foe's types against it, plus how healthy it is.
    function matchup(p, foe) {
      if (!foe) return p.hp / p.maxhp
      const best = Math.max(0, ...p.moveSlots.map(m => Math.min(1, hitShare(dex.moves.get(m.id), p, foe)) * accuracy(dex.moves.get(m.id))))
      return best * 100 - threat(foe, p) * 22 + (p.hp / p.maxhp) * 25
    }
    function statusScore(move, mine, foe) {
      const hp = mine.hp / mine.maxhp
      const types = foe ? foe.getTypes() : []
      const foeSide = foe ? foe.side : null
      if (move.status) {
        if (!foe || foe.status || foe.volatiles.substitute) return 0
        if (!dex.getImmunity(move.status, types) || (move.flags.powder && !dex.getImmunity('powder', types))) return 0
        if (move.id === 'thunderwave' && types.includes('Ground')) return 0
        if (absorbs(move, foe)) return 0
        const worth = { slp: 72, par: speed(foe) > speed(mine) ? 62 : 40, brn: foe.storedStats.atk > foe.storedStats.spa ? 64 : 28, tox: 56, psn: 38, frz: 50 }[move.status] || 35
        return worth * accuracy(move)
      }
      if (move.volatileStatus === 'confusion' || move.volatileStatus === 'attract') return foe && !foe.volatiles[move.volatileStatus] ? 22 : 0
      if (move.heal || move.flags.heal) return hp < 0.4 ? 88 : hp < 0.65 ? 38 : 2
      if (move.boosts && (move.target === 'self' || move.target === 'adjacentAllyOrSelf')) {
        const have = Object.keys(move.boosts).reduce((a, k) => a + Math.max(0, mine.boosts[k] || 0), 0)
        if (have >= 4) return 0
        return hp > 0.6 ? 62 - have * 14 : 12
      }
      if (move.sideCondition && foeSide) return foeSide.sideConditions[move.sideCondition] ? 0 : 48
      if (move.weather) return battle.field.weather === PS.toID(move.weather) ? 0 : 34
      if (move.terrain) return battle.field.terrain === PS.toID(move.terrain) ? 0 : 30
      if (move.volatileStatus === 'substitute') return hp > 0.5 && !mine.volatiles.substitute ? 34 : 0
      if (move.stallingMove) return 10
      return 22
    }

    // ── Who comes in ──
    function bestSwitch(foe) {
      const h = healthy()
      if (!h.length) return null
      if (!B.smart || !foe) return pick(h)
      return h.map(c => ({ c, s: matchup(sideObj.pokemon[c.i], foe) })).sort((a, b) => b.s - a.s)[0].c
    }
    if (req.forceSwitch) {
      const foe = (liveFoes()[0] || {}).f
      return req.forceSwitch.map(f => {
        if (!f) return 'pass'
        const c = bestSwitch(foe)
        if (!c) return 'pass'
        taken.add(c.i)
        return `switch ${c.i + 1}`
      }).join(', ')
    }

    let mechUsed = false
    return (req.active || []).map((active, slot) => {
      const mon = team[slot]
      if (!active || !mon || mon.condition.endsWith(' fnt') || mon.commanding) return 'pass'
      const mine = sideObj.active[slot]
      const foes = liveFoes()
      const ally = four && sideObj.allySide ? sideObj.allySide.active.find(a => a && !a.fainted) : null
      // A target's number from where we stand: positive across the field,
      // negative on our own half.
      const loc = t => {
        if (mine.getLocOf) return mine.getLocOf(t)
        const position = t.position + Math.floor(t.side.n / 2) * t.side.active.length + 1
        return mine.side.n % 2 === t.side.n % 2 ? -position : position
      }
      const simple = (id, foe) => {
        const move = dex.moves.get(id)
        if (move.category === 'Status') return 35 * (0.6 + Math.random() * 0.8)
        let s = move.basePower || 70
        if (foe) {
          const types = foe.getTypes()
          if (!dex.getImmunity(move.type, types)) return 0
          s *= Math.pow(2, dex.getEffectiveness(move.type, types))
        }
        if (mine && mine.hasType(move.type)) s *= 1.5
        if (move.accuracy !== true) s *= move.accuracy / 100
        return s * (0.85 + Math.random() * 0.3)
      }
      const smart = (id, foe) => {
        const move = dex.moves.get(id)
        if (move.category === 'Status') return statusScore(move, mine, foe) * (0.92 + Math.random() * 0.16)
        const share = hitShare(move, mine, foe)
        const acc = accuracy(move)
        let s = Math.min(share, 1) * 100 * acc
        if (share >= 0.95) s += 45 * acc                      // a knockout
        if (share >= 0.95 && move.priority > 0) s += 25       // and before they can move
        if (move.flags.charge) s *= 0.6                       // two-turn moves
        if (move.self && move.self.volatileStatus === 'mustrecharge') s *= share >= 0.95 ? 0.9 : 0.6
        if (move.selfdestruct) s *= mine.hp / mine.maxhp < 0.3 ? 1 : 0.25
        if (move.recoil || move.mindBlownRecoil) s *= 0.92
        return s * (0.96 + Math.random() * 0.08)
      }
      const score = B.smart ? smart : simple
      const options = []
      active.moves.forEach((m, j) => {
        if (m.disabled) return
        if (!foes.length) return options.push({ j, s: 1, t: null })
        if (four && m.target === 'adjacentAlly' && !ally) return
        for (const { f, i } of foes) options.push({ j, s: score(m.id, f), t: i, foe: f, target: m.target, id: m.id })
      })
      options.sort((a, b) => b.s - a.s)
      const trapped = active.trapped || active.maybeTrapped
      const h = healthy()
      // Switching out on purpose.
      if (h.length && !trapped && B.switchy && Math.random() < B.switchy) {
        const foe = (options[0] && options[0].foe) || (foes[0] || {}).f
        if (B.smart && mine && foe) {
          const here = matchup(mine, foe)
          const c = bestSwitch(foe)
          const stuck = !options.length || options[0].s < 25
          const outmatched = threat(foe, mine) >= 2 && speed(foe) > speed(mine) && mine.hp / mine.maxhp < 0.5 && (!options.length || options[0].s < 90)
          if (c && (stuck || outmatched) && matchup(sideObj.pokemon[c.i], foe) > here + 20) {
            taken.add(c.i)
            return `switch ${c.i + 1}`
          }
        } else if (!options.length || options[0].s < 30) {
          const c = pick(h)
          taken.add(c.i)
          return `switch ${c.i + 1}`
        }
      }
      if (!options.length) return 'move 1'
      const c = Math.random() < B.skill ? options[0] : pick(options)
      let target = ''
      if (four && mine) {
        if (['normal', 'any', 'adjacentFoe'].includes(c.target) && c.foe) target = ` ${loc(c.foe)}`
        if (c.target === 'adjacentAlly' && ally) target = ` ${loc(ally)}`
        if (c.target === 'adjacentAllyOrSelf') target = ` ${loc(mine)}`
      } else if (doubles) {
        if (['normal', 'any', 'adjacentFoe'].includes(c.target) && c.t !== null) target = ` ${c.t + 1}`
        if (c.target === 'adjacentAlly') target = ` -${(slot ^ 1) + 1}`
        if (c.target === 'adjacentAllyOrSelf') target = ` -${slot + 1}`
      }
      // Mega always; the smart levels save Tera, Dynamax and Z-Moves for
      // a strong hit (Tera only in its own type).
      let mech = ''
      if (!mechUsed && B.mech) {
        const move = c.id ? dex.moves.get(c.id) : null
        const strong = c.s >= 55
        if (active.canMegaEvo) mech = ' mega'
        else if (active.canTerastallize && (B.smart ? move && active.canTerastallize === move.type && strong : Math.random() < B.mech)) mech = ' terastallize'
        else if (active.canDynamax && (B.smart ? strong && mine.hp / mine.maxhp > 0.6 : Math.random() < B.mech)) mech = ' dynamax'
        else if (active.canZMove && active.canZMove[c.j] && (B.smart ? strong : Math.random() < B.mech)) mech = ' zmove'
        if (mech) mechUsed = true
      }
      return `move ${c.j + 1}${target}${mech}`
    }).join(', ')
  }

  // Every finished battle goes on the Home leaderboard (debrod_pk_results),
  // when you're signed in. Losing the report just means it isn't counted.
  function report(info, kind) {
    const auth = typeof Account !== 'undefined' && Account.ready() ? Account.client() : null
    const who = auth && Account.profile()
    if (!who) return
    const row = {
      user_id: who.id,
      kind: info.format === 'debrod-tower' ? 'tower' : info.vsCpu ? 'cpu' : 'online',
      level: info.vsCpu && info.level ? info.level : null,
      format: String(info.format).slice(0, 60),
      result: kind === 'win' ? 'win' : kind === 'lose' ? 'lose' : 'tie',
      floor: info.floor || null,
    }
    auth.from('debrod_pk_results').insert(row).then(({ error }) => {
      if (error) console.warn('Showdown: result not counted:', error.message)
      else if (typeof Hub !== 'undefined' && Hub.refresh) Hub.refresh(true)
    })
  }

  // ── Online: the host runs the battle; the guest and spectators follow ──
  function online(code, role) {
    if (role === 'host') {
      const problem = PS ? myTeamProblem() : null
      if (problem) return menu(problem)
    }
    leaveNet()
    endMatch()
    loading(role === 'host' ? 'Making a room…' : `Joining room ${code}…`)
    const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey)
    const channel = sb.channel(`ds-showdown:${code}`, { config: { presence: { key: me }, broadcast: { self: false } } })
    const n = {
      sb, channel, code, role, players: [], joinedAt: Date.now(), timers: [],
      // host
      format, guestId: null, guestName: '', guestTeam: null, battle: null, chunks: [], spec: [], timerOn: false, deadline: { p1: null, p2: null },
      four: role === 'host' && isFour(format), seats: { p2: null, p3: null, p4: null }, names: null,
      // guest / spectator
      hostId: null, mode: null, expect: 0, buffer: {}, teamSent: false, seat: null,
    }
    net = n
    if (typeof hubActivity === 'function') hubActivity({ game: 'showdown', code, label: role === 'host' ? `Pokémon Showdown (${showdownFormatName(n.format)})` : 'Pokémon Showdown', joinable: true })
    n.send = (event, payload) => channel.send({ type: 'broadcast', event, payload: Object.assign({ from: me }, payload) })

    channel.on('presence', { event: 'sync' }, () => {
      n.players = Object.values(channel.presenceState()).map(m => m[m.length - 1]).sort((a, b) => a.joinedAt - b.joinedAt)
      if (role === 'host') hostPresence()
      else followerPresence()
    })
    for (const ev of ['room', 'chunk', 'schunk', 'reset', 'choice', 'resend', 'hello', 'team', 'teamerror', 'chat', 'forfeit', 'timer', 'draft', 'draftpick', 'emote']) {
      channel.on('broadcast', { event: ev }, ({ payload }) => (role === 'host' ? hostEvent : followerEvent)(ev, payload || {}))
    }
    channel.subscribe(async status => {
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        if (!n.subscribed) menu('Can\'t reach Supabase. Check SUPABASE_URL and SUPABASE_ANON_KEY in DEBROD → Settings.')
        return
      }
      if (status !== 'SUBSCRIBED') return
      n.subscribed = true
      await channel.track({ id: me, name, role, joinedAt: n.joinedAt })
      if (role === 'host') {
        try { await engine() } catch (e) { return menu(e.message) }
        const problem = myTeamProblem()
        if (problem) { leaveNet(); return menu(problem) }
        n.hostTeam = needsTeam(n.format) ? teamById(teamId).packed : null
        n.ready = true
        waitingRoom()
        hostPresence()
      } else {
        n.send('hello', {})
        n.timers.push(setTimeout(() => { if (net === n && !n.hostId) { leaveNet(); menu(`Nobody is hosting room ${code}.`) } }, 7000))
      }
    })
  }

  function leaveNet() {
    if (!net) return
    if (typeof hubActivity === 'function') hubActivity({ game: 'showdown', label: 'Pokémon Showdown', joinable: false })
    for (const t of net.timers) clearTimeout(t)
    if (net.timerTick) clearInterval(net.timerTick)
    if (net.draftTick) clearInterval(net.draftTick)
    try { net.channel.untrack(); net.sb.removeChannel(net.channel) } catch (e) { /* gone */ }
    net = null
  }

  function inviteLink(n) {
    return cfg.appUrl ? `${cfg.appUrl}?showdown=${n.code}` : ''
  }

  function waitingRoom(note) {
    const n = net
    if (n.four) return fourLobby()
    const link = inviteLink(n)
    pkFill(wrap, el('div', { class: 'card stack pk-menu' },
      el('p', { class: 'wordmark' }, 'Showdown'),
      el('p', { class: 'tagline' }, showdownFormatName(n.format)),
      note && el('p', { class: 'muted small' }, note),
      el('p', null, n.guestId ? `${n.guestName} is picking a team…` : 'Waiting for your opponent…'),
      el('p', { class: 'pk-code' }, n.code),
      el('p', { class: 'muted small' }, `${link ? 'Send the link, or have' : 'Have'} them open Arcade → Pokémon Showdown and enter the code. Anyone else who joins can watch.`),
      el('button', { type: 'button', class: 'primary', onClick: async () => {
        const ok = await copyText(link || n.code)
        if (!ok) showText('Send this:', link || n.code)
      } }, link ? 'Copy invite link' : 'Copy code'),
      el('button', { type: 'button', class: 'link', onClick: () => { leaveNet(); menu() } }, '‹ Cancel')))
  }

  // Host side
  function hostRoom() {
    const n = net
    if (!n) return
    if (n.four) return fourRoom()
    n.send('room', {
      format: n.format, hostName: name, guestId: n.guestId, guestName: n.guestName,
      needsTeam: needsTeam(n.format), battle: n.battle, timer: n.timerOn, draft: n.draft && !n.battle ? n.draft.id : null,
    })
  }

  function hostPresence() {
    const n = net
    // Presence can arrive before the engine has loaded; we run again then.
    if (!n || !n.ready) return
    if (n.four) return fourPresence()
    const others = n.players.filter(p => p.id !== me)
    if (n.guestId && !others.some(p => p.id === n.guestId)) {
      n.guestId = null
      if (match) match.view.notice(`${n.guestName} left. If they come back, the battle carries on.`)
    }
    if (!n.guestId) {
      // Mid-battle only the same trainer can take the seat back; otherwise
      // the first to arrive gets it.
      const next = n.battle ? others.find(p => p.name === n.guestName) : others[0]
      if (next) {
        n.guestId = next.id
        if (!n.battle) { n.guestName = next.name; n.guestTeam = null }
        if (n.battle) { if (match) match.view.notice(`${n.guestName} is back.`); hostReplay() }
        else if (isDraft(n.format)) hostDraft()
        else if (!needsTeam(n.format)) hostStart()
        else { hostRoom(); if (!match) waitingRoom() }
      }
    }
    hostRoom()
  }

  // ── Four players online ──
  // The host is p1; friends take p2, p3 and p4 in the order they arrive,
  // and anyone past that watches. Seats nobody takes go to the CPU.
  const SEATS = ['p2', 'p3', 'p4']
  // The seats friends can take (a three-way keeps p4 empty).
  const openSeats = n => SEATS.filter(x => !(isThree(n.format) && x === SHOWDOWN_GHOST))
  const seatOf = (n, id) => SEATS.find(x => n.seats[x] && n.seats[x].id && n.seats[x].id === id) || null

  function fourRoom() {
    const n = net
    const seats = {}
    for (const x of SEATS) seats[x] = n.seats[x] && { id: n.seats[x].id, name: n.seats[x].name, cpu: !!n.seats[x].cpu }
    n.send('room', { four: true, format: n.format, hostName: name, seats, names: n.names, battle: n.battle, timer: n.timerOn, draft: n.draft && !n.battle ? n.draft.id : null })
  }

  function fourName(n, wanted) {
    const taken = new Set([name, ...SEATS.map(x => n.seats[x] && n.seats[x].name)].filter(Boolean))
    let out = wanted || 'Trainer'
    for (let k = 2; taken.has(out); k++) out = `${wanted} ${k}`
    return out
  }

  function fourPresence() {
    const n = net
    const others = n.players.filter(p => p.id !== me)
    const here = id => others.some(p => p.id === id)
    for (const x of SEATS) {
      const seat = n.seats[x]
      if (!seat || !seat.id || here(seat.id)) continue
      if (n.battle) {
        // Their seat waits for them; the CPU steps in if they stay away.
        seat.id = null
        seat.goneAt = Date.now()
        if (match) match.view.notice(`${seat.name} left. If they're not back in ${SHOWDOWN_TAKEOVER_MS / 1000} seconds, the CPU plays for them.`)
      } else if (n.draft) {
        // Mid-draft the CPU picks for them straight away.
        seat.id = null
        seat.goneAt = Date.now()
        seat.cpu = true
        fourDraftNext(true)
      } else n.seats[x] = null
    }
    for (const p of others) {
      if (seatOf(n, p.id)) continue
      if (n.battle || n.draft) {
        const x = SEATS.find(k => n.seats[k] && !n.seats[k].id && !n.seats[k].bot && n.seats[k].name === p.name)
        if (!x) continue
        Object.assign(n.seats[x], { id: p.id, cpu: false, goneAt: null })
        if (match) match.view.notice(`${p.name} is back.`)
        if (n.battle) fourReplay(x)
        else { fourRoom(); n.send('draft', draftPayload(n.draft)) }
      } else {
        const x = openSeats(n).find(k => !n.seats[k])
        if (x) n.seats[x] = { id: p.id, name: fourName(n, p.name) }
      }
    }
    fourRoom()
    if (!match) fourLobby()
  }

  // Multi: change who's your partner by moving everyone round a seat.
  function fourRotate() {
    const n = net
    const [a, b, c] = SEATS.map(x => n.seats[x])
    n.seats = { p2: c, p3: a, p4: b }
    fourRoom()
    fourLobby()
  }

  function fourLobby() {
    const n = net
    if (!n || match || n.draft) return
    const link = inviteLink(n)
    const multi = isMulti(n.format)
    const who = x => (x === 'p1' ? `${name} (you)` : n.seats[x] ? n.seats[x].name : 'CPU')
    const open = openSeats(n)
    const filled = open.filter(x => n.seats[x]).length
    pkFill(wrap, el('div', { class: 'card stack pk-menu' },
      el('p', { class: 'wordmark' }, 'Showdown'),
      el('p', { class: 'tagline' }, showdownFormatName(n.format)),
      multi
        ? el('div', { class: 'pk-seats' },
          el('p', null, el('strong', null, 'Your team: '), `${who('p1')} & ${who('p3')}`),
          el('p', null, el('strong', null, 'Against: '), `${who('p2')} & ${who('p4')}`))
        : el('div', { class: 'pk-seats' }, seatsOf(n.format).map(x => el('p', null, `${x.toUpperCase()} · ${who(x)}`))),
      el('p', { class: 'pk-code' }, n.code),
      el('p', { class: 'muted small' }, `${link ? 'Send the link, or have' : 'Have'} friends open Arcade → Pokémon Showdown and enter the code. Up to ${open.length === 2 ? 'two' : 'three'} can play; the CPU takes any empty seat, and anyone after that watches.`),
      el('button', { type: 'button', onClick: async () => {
        const ok = await copyText(link || n.code)
        if (!ok) showText('Send this:', link || n.code)
      } }, link ? 'Copy invite link' : 'Copy code'),
      multi && filled > 0 && el('button', { type: 'button', onClick: fourRotate }, 'Change partners'),
      el('button', { type: 'button', class: 'primary', onClick: () => (isDraft(n.format) ? fourDraft() : fourStart()) },
        `${filled === open.length ? (isDraft(n.format) ? 'Start the draft' : 'Start the battle') : `Start (${open.length - filled} CPU${open.length - filled === 1 ? '' : 's'})`}`),
      el('button', { type: 'button', class: 'link', onClick: () => { leaveNet(); menu() } }, '‹ Cancel')))
  }

  // Empty seats go to the CPU, and everyone's name is fixed for the battle.
  function fourSeats() {
    const n = net
    for (const x of SEATS) if (!n.seats[x]) n.seats[x] = { id: null, name: isThree(n.format) && x === SHOWDOWN_GHOST ? SHOWDOWN_GHOST_NAME : fourName(n, SHOWDOWN_CPU_NAMES[x]), cpu: true, bot: true }
    n.names = { p1: name }
    for (const x of SEATS) n.names[x] = n.seats[x].name
  }

  // A four-way draft: the host keeps the board and the clock, and picks for
  // the CPU's seats.
  function fourDraft() {
    const n = net
    if (!n) return
    if (match) endMatch()
    fourSeats()
    n.battle = null
    const D = n.draft = newDraft(n.format, n.names)
    D.deadline = Date.now() + SHOWDOWN_DRAFT_MS
    if (n.draftTick) clearInterval(n.draftTick)
    n.draftTick = setInterval(() => {
      if (net !== n || n.draft !== D || draftDone(D) || n.battle) return
      if (Date.now() > D.deadline) {
        const x = D.order[D.at]
        if (draftPick(D, x, draftCpuPick(D, x))) fourDraftNext()
      } else fourDraftShow()
    }, 1000)
    fourRoom()
    fourDraftNext(true)
  }
  function fourDraftShow() {
    const n = net
    const D = n.draft
    draftScreen(D, 'p1', i => { if (draftPick(D, 'p1', i)) fourDraftNext() }, { back: () => { endMatch(); leaveNet(); menu() }, deadline: D.deadline })
  }
  // After each pick (or a seat changing hands): tell everyone, and let the
  // CPU pick if it's its turn.
  function fourDraftNext(keepClock) {
    const n = net
    const D = n && n.draft
    if (!D || n.battle) return
    if (!keepClock) D.deadline = Date.now() + SHOWDOWN_DRAFT_MS
    n.send('draft', draftPayload(D))
    fourDraftShow()
    if (draftDone(D)) {
      clearInterval(n.draftTick)
      const teams = groupTeams(n.format, x => draftTeam(D, x))
      setTimeout(() => { if (net === n && n.draft === D && !n.battle) fourStart(teams) }, 1200)
      return
    }
    const x = D.order[D.at]
    if (x !== 'p1' && n.seats[x] && n.seats[x].cpu) {
      setTimeout(() => { if (net === n && n.draft === D && D.order[D.at] === x && draftPick(D, x, draftCpuPick(D, x))) fourDraftNext() }, 650)
    }
  }

  function fourStart(teams) {
    const n = net
    if (!n) return
    if (match) endMatch()
    fourSeats()
    n.chunks = { p2: [], p3: [], p4: [] }
    n.spec = []
    n.battle = randomId()
    n.deadline = { p1: null, p2: null, p3: null, p4: null }
    n.awaiting = { p1: false, p2: false, p3: false, p4: false }
    n.lastReq = {}
    n.retried = {}
    const fid = n.format
    const view = viewer('p1', { format: fid, me: name, foe: 'the others', names: n.names, online: true, host: true }, {
      choose: choice => { hostChoice('p1', choice) },
      forfeit: () => sim.forfeit('p1'),
      again: () => {
        // The CPU's seats open up again for anyone who's arrived since.
        endMatch()
        n.battle = null
        n.draft = null
        for (const x of SEATS) if (n.seats[x] && (n.seats[x].bot || !n.seats[x].id)) n.seats[x] = null
        fourPresence()
        if (isDraft(n.format)) fourDraft()
        else fourStart()
      },
      emote: e => n.send('emote', { e }),
      back: () => { endMatch(); leaveNet(); menu() },
      chat: text => { n.send('chat', { name, text }); view.chat(name, text) },
      timer: on => {
        n.timerOn = on
        for (const x of SHOWDOWN_FOUR) n.deadline[x] = on && n.awaiting[x] && !(n.seats[x] && n.seats[x].cpu) ? Date.now() + SHOWDOWN_TIMER_MS : null
        hostTimer()
        fourRoom()
      },
    })
    const seatHandler = x => chunk => {
      const seq = n.chunks[x].push(chunk) - 1
      n.send('chunk', { battle: n.battle, seq, data: chunk, side: x })
      const seat = n.seats[x]
      // Once per request, the CPU falls back on the default if its pick
      // was turned down.
      if (/(^|\n)\|error\|/.test(chunk) && seat.cpu) {
        if (!n.retried[x]) { n.retried[x] = true; hostChoice(x, 'default') }
        return
      }
      const reqs = requestsIn(chunk).filter(r => !r.wait)
      if (!reqs.length) return
      n.retried[x] = false
      n.lastReq[x] = reqs[reqs.length - 1]
      hostArm(x)
      if (seat.cpu) fourCpu(x)
    }
    const T = teams || groupTeams(fid, () => fourTeam(fid))
    const sim = runSim((fid), { name, team: T.p1 }, { name: n.names.p2, team: T.p2 }, {
      p1: chunk => { view.feed(chunk); if (requestsIn(chunk).some(r => !r.wait)) hostArm('p1') },
      p2: seatHandler('p2'),
      p3: seatHandler('p3'),
      p4: isThree(fid) ? null : seatHandler('p4'),
      spectator: chunk => {
        const seq = n.spec.push(chunk) - 1
        n.send('schunk', { battle: n.battle, seq, data: chunk })
      },
    }, [{ name: n.names.p3, team: T.p3 }, { name: n.names.p4, team: T.p4 }])
    match = { sim, view }
    if (n.timerTick) clearInterval(n.timerTick)
    n.timerTick = setInterval(hostTimerCheck, 1000)
    fourRoom()
    music(true)
  }

  // The CPU answers for a seat it holds (or has taken over).
  function fourCpu(x) {
    const n = net
    const battleId = n.battle
    setTimeout(() => {
      if (net !== n || !match || n.battle !== battleId || !n.awaiting[x] || !n.seats[x].cpu) return
      const c = cpuChoice(n.lastReq[x], match.sim.stream.battle, x, level)
      hostChoice(x, c || 'default')
    }, 400 + Math.random() * 600)
  }

  function fourReplay(x) {
    const n = net
    const seat = n.seats[x]
    fourRoom()
    if (!seat || !seat.id || !n.battle) return
    n.send('reset', { battle: n.battle, to: seat.id })
    n.chunks[x].forEach((data, seq) => n.send('chunk', { battle: n.battle, seq, data, side: x }))
    hostTimer()
  }

  const draftPayload = D => ({ id: D.id, fid: D.fid, pool: PS.Teams.pack(D.pool), picks: D.picks, order: D.order, at: D.at, names: D.names, sides: D.sides, each: D.each, left: Math.max(0, D.deadline - Date.now()) })

  // An online draft: the host keeps the board and the pick clock.
  function hostDraft() {
    const n = net
    if (!n || !n.guestId) return
    if (match) endMatch()
    n.battle = null
    n.draft = newDraft(n.format, { p1: name, p2: n.guestName })
    n.draft.deadline = Date.now() + SHOWDOWN_DRAFT_MS
    if (n.draftTick) clearInterval(n.draftTick)
    n.draftTick = setInterval(() => {
      const D = n.draft
      if (net !== n || !D || draftDone(D)) return
      if (Date.now() > D.deadline) {
        const side = D.order[D.at]
        if (draftPick(D, side, draftCpuPick(D, side))) hostDraftNext()
      } else if (!n.battle) hostDraftShow()
    }, 1000)
    hostRoom()
    hostDraftSync()
  }
  function hostDraftShow() {
    const n = net
    const D = n.draft
    draftScreen(D, 'p1', i => { if (draftPick(D, 'p1', i)) hostDraftNext() }, { back: () => { endMatch(); leaveNet(); menu() }, deadline: D.deadline })
  }
  function hostDraftSync() {
    const n = net
    const D = n.draft
    if (!D) return
    n.send('draft', draftPayload(D))
    if (!n.battle) hostDraftShow()
  }
  function hostDraftNext() {
    const n = net
    const D = n.draft
    D.deadline = Date.now() + SHOWDOWN_DRAFT_MS
    hostDraftSync()
    if (!draftDone(D)) return
    clearInterval(n.draftTick)
    n.hostTeam = draftTeam(D, 'p1')
    n.guestTeam = draftTeam(D, 'p2')
    setTimeout(() => { if (net === n && n.draft === D) hostStart() }, 1200)
  }

  function hostStart() {
    const n = net
    if (!n || !n.guestId) return
    if (match) endMatch()
    n.chunks = []
    n.spec = []
    n.battle = randomId()
    n.deadline = { p1: null, p2: null }
    n.awaiting = { p1: false, p2: false }
    const view = viewer('p1', { format: n.format, me: name, foe: n.guestName, online: true, host: true }, {
      choose: choice => { hostChoice('p1', choice) },
      forfeit: () => sim.forfeit('p1'),
      again: () => { if (n.guestId) (isDraft(n.format) ? hostDraft() : hostStart()) },
      emote: e => n.send('emote', { e }),
      back: () => { endMatch(); leaveNet(); menu() },
      chat: text => { n.send('chat', { name, text }); view.chat(name, text) },
      // Turning the timer on starts the clock for anyone already deciding.
      timer: on => {
        n.timerOn = on
        for (const side of ['p1', 'p2']) n.deadline[side] = on && n.awaiting[side] ? Date.now() + SHOWDOWN_TIMER_MS : null
        hostTimer()
        hostRoom()
      },
    })
    const sim = runSim((n.format), { name, team: n.hostTeam }, { name: n.guestName, team: n.guestTeam }, {
      p1: chunk => { view.feed(chunk); if (requestsIn(chunk).some(r => !r.wait)) hostArm('p1') },
      p2: chunk => {
        const seq = n.chunks.push(chunk) - 1
        n.send('chunk', { battle: n.battle, seq, data: chunk })
        if (requestsIn(chunk).some(r => !r.wait)) hostArm('p2')
      },
      spectator: chunk => {
        const seq = n.spec.push(chunk) - 1
        n.send('schunk', { battle: n.battle, seq, data: chunk })
      },
    })
    match = { sim, view }
    if (n.timerTick) clearInterval(n.timerTick)
    n.timerTick = setInterval(hostTimerCheck, 1000)
    hostRoom()
    music(true)
  }

  function hostChoice(side, choice) {
    const n = net
    if (!match || !n) return
    match.sim.choose(side, choice)
    if (choice === 'undo') hostArm(side)
    else { n.deadline[side] = null; n.awaiting[side] = false }
    hostTimer()
  }

  // The turn timer: each side gets SHOWDOWN_TIMER_MS per decision once the
  // host turns it on; running out picks the default move for you.
  function hostArm(side) {
    const n = net
    if (!n) return
    n.awaiting[side] = true
    n.deadline[side] = n.timerOn && !(n.four && n.seats[side] && n.seats[side].cpu) ? Date.now() + SHOWDOWN_TIMER_MS : null
    hostTimer()
  }
  function hostTimer() {
    const n = net
    if (!n || !match) return
    const left = side => (n.deadline[side] ? Math.max(0, n.deadline[side] - Date.now()) : null)
    const state = { on: n.timerOn }
    for (const x of n.four ? SHOWDOWN_FOUR : ['p1', 'p2']) state[x] = left(x)
    match.view.timer(state)
    n.send('timer', Object.assign({ battle: n.battle }, state))
  }
  function hostTimerCheck() {
    const n = net
    if (!n || !match) return
    // Four players: the CPU takes the seat of anyone who's been gone a while.
    if (n.four) {
      for (const x of SEATS) {
        const seat = n.seats[x]
        if (!seat || seat.cpu || seat.id || !seat.goneAt || Date.now() - seat.goneAt < SHOWDOWN_TAKEOVER_MS) continue
        seat.cpu = true
        n.deadline[x] = null
        match.view.notice(`The CPU is playing for ${seat.name} now.`)
        n.send('chat', { name: '🤖', text: `The CPU is playing for ${seat.name} now.` })
        if (n.awaiting[x]) fourCpu(x)
        hostTimer()
      }
    }
    if (!n.timerOn) return
    for (const side of n.four ? SHOWDOWN_FOUR : ['p1', 'p2']) {
      if (n.deadline[side] && Date.now() > n.deadline[side]) {
        n.deadline[side] = null
        const who = side === 'p1' ? name : n.four ? n.names[side] : n.guestName
        match.view.notice(`${who} ran out of time, so the battle chose for them.`)
        n.send('chat', { name: '⏱', text: `${who} ran out of time, so the battle chose for them.` })
        match.sim.choose(side, 'default')
        hostTimer()
      }
    }
  }

  function hostReplay() {
    const n = net
    hostRoom()
    n.send('reset', { battle: n.battle, to: n.guestId })
